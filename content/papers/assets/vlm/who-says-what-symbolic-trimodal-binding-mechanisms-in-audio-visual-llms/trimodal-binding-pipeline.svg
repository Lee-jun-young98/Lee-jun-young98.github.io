<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="700"
  viewBox="0 0 1200 700"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Who Says What의 symbolic trimodal binding과 ASD 보강 파이프라인</title>
  <desc id="desc">
    텍스트 질문의 발화 의미를 시간 ID로 바꾸고, 시간 ID를 화자 위치 ID에 대응시킨 뒤, 해당 위치의
    시각 의미를 회수하는 세 단계와 ASD가 활성 화자 경계상자를 제공해 두 번째 단계를 보강하는 흐름
  </desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155" />
    </marker>
    <style>
      .title {
        font:
          700 28px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #0f172a;
      }
      .subtitle {
        font:
          600 17px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #334155;
      }
      .head {
        font:
          700 20px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #0f172a;
      }
      .body {
        font:
          16px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #1e293b;
      }
      .small {
        font:
          14px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #475569;
      }
      .box {
        stroke-width: 2;
        rx: 16;
      }
      .arrow {
        stroke: #334155;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
      .dash {
        stroke: #dc2626;
        stroke-width: 3;
        stroke-dasharray: 9 7;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#f8fafc" />
  <text x="600" y="48" text-anchor="middle" class="title">
    Symbolic Trimodal Binding: 의미가 아니라 구조 ID를 거쳐 연결
  </text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">
    논문 Figure 1(a), Sections 3.1–3.2와 Figure 1(b), Section 4.2를 바탕으로 재구성
  </text>

  <rect x="55" y="130" width="210" height="165" class="box" fill="#dbeafe" stroke="#2563eb" />
  <text x="160" y="162" text-anchor="middle" class="head">입력</text>
  <text x="78" y="198" class="body">텍스트 질문: “Japan은</text>
  <text x="78" y="224" class="body">누가 말했는가?”</text>
  <text x="78" y="256" class="small">오디오: 4개 발화 순서</text>
  <text x="78" y="279" class="small">비디오: 4개 화자 위치</text>

  <rect x="330" y="130" width="220" height="165" class="box" fill="#dcfce7" stroke="#16a34a" />
  <text x="440" y="162" text-anchor="middle" class="head">1. Anchor ID 검색</text>
  <text x="353" y="202" class="body">발화 의미 “Japan”</text>
  <text x="440" y="236" text-anchor="middle" class="head">→ Temporal ID t=3</text>
  <text x="353" y="270" class="small">질문의 anchor를 발화 순서로 추상화</text>

  <rect x="615" y="130" width="225" height="165" class="box" fill="#fef3c7" stroke="#d97706" />
  <text x="727" y="162" text-anchor="middle" class="head">2. Target ID 선택</text>
  <text x="643" y="202" class="body">Temporal ID t=3</text>
  <text x="727" y="236" text-anchor="middle" class="head">→ Position ID p=1</text>
  <text x="643" y="270" class="small">오디오–비디오 대응의 주 실패 지점</text>

  <rect x="905" y="130" width="240" height="165" class="box" fill="#f3e8ff" stroke="#9333ea" />
  <text x="1025" y="162" text-anchor="middle" class="head">3. 의미 특징 회수</text>
  <text x="930" y="202" class="body">p=1의 시각 토큰 조회</text>
  <text x="1025" y="236" text-anchor="middle" class="head">→ “tiger” 출력</text>
  <text x="930" y="270" class="small">가장 깊은 층에서 의미가 우세</text>

  <path d="M265 212 H320" class="arrow" />
  <path d="M550 212 H605" class="arrow" />
  <path d="M840 212 H895" class="arrow" />

  <rect
    x="55"
    y="360"
    width="1090"
    height="250"
    rx="20"
    fill="#fff7ed"
    stroke="#ea580c"
    stroke-width="2"
  />
  <text x="600" y="398" text-anchor="middle" class="head">
    ASD visual prompting: 학습 전·후 모두 target-ID 대응을 명시적으로 보강
  </text>

  <rect x="95" y="435" width="240" height="120" class="box" fill="#ffedd5" stroke="#f97316" />
  <text x="215" y="470" text-anchor="middle" class="head">오프더셸프 ASD</text>
  <text x="215" y="505" text-anchor="middle" class="body">프레임별 활성 화자 탐지</text>
  <text x="215" y="532" text-anchor="middle" class="small">TalkNCE 계열 검출기</text>

  <rect x="435" y="435" width="275" height="120" class="box" fill="#fee2e2" stroke="#dc2626" />
  <text x="572" y="470" text-anchor="middle" class="head">시각 프롬프트 렌더링</text>
  <text x="572" y="505" text-anchor="middle" class="body">활성 화자에 빨간 bounding box</text>
  <text x="572" y="532" text-anchor="middle" class="small">텍스트로 상자의 의미도 설명</text>

  <rect x="810" y="435" width="290" height="120" class="box" fill="#ecfccb" stroke="#65a30d" />
  <text x="955" y="470" text-anchor="middle" class="head">AVLLM 입력 / 선택적 LoRA</text>
  <text x="955" y="505" text-anchor="middle" class="body">학습 없음: ASD prompting</text>
  <text x="955" y="532" text-anchor="middle" class="small">학습 있음: 300 step 미만 ASD-FT</text>

  <path d="M335 495 H425" class="arrow" />
  <path d="M710 495 H800" class="arrow" />
  <path d="M955 435 C955 365 760 350 727 305" class="dash" />

  <text x="600" y="652" text-anchor="middle" class="small">
    실선: 기본 추론 흐름 · 붉은 점선: ASD가 활성 화자 위치를 제공해 Temporal ID ↔ Position ID 대응을
    보조
  </text>
  <text x="600" y="678" text-anchor="middle" class="small">
    출처: arXiv:2609.31193, Figure 1 및 Sections 3.1–3.2, 4.2 · 원본을 복사하지 않은 한국어 재구성
  </text>
</svg>
