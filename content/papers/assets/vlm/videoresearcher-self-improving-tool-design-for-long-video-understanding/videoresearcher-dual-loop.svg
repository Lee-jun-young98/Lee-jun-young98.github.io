<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="700"
  viewBox="0 0 1200 700"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">VideoResearcher의 Solving Loop와 Evolving Loop</title>
  <desc id="desc">
    고정 Worker와 고정 지각 모델 사이의 도구 상자가 장문 비디오 증거를 모으고, 실패 궤적을 진단한
    다중 에이전트가 후보 도구를 만들고 동일 조건 정확도로 검증해 도구 상자를 갱신하는 구조
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eef2ff" />
    </linearGradient>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="9"
      refY="3"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .title {
        font:
          700 28px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #0f172a;
      }
      .label {
        font:
          700 18px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #0f172a;
      }
      .body {
        font:
          500 15px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #334155;
      }
      .small {
        font:
          500 13px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #475569;
      }
      .box {
        fill: #fff;
        stroke: #94a3b8;
        stroke-width: 2;
      }
      .fixed {
        fill: #f1f5f9;
        stroke: #64748b;
        stroke-width: 2;
      }
      .tool {
        fill: #ecfeff;
        stroke: #0891b2;
        stroke-width: 2;
      }
      .evolve {
        fill: #fff7ed;
        stroke: #ea580c;
        stroke-width: 2;
      }
      .accept {
        fill: #ecfdf5;
        stroke: #059669;
        stroke-width: 2;
      }
      .line {
        fill: none;
        stroke: #334155;
        stroke-width: 2.4;
        marker-end: url(#arrow);
      }
      .dash {
        fill: none;
        stroke: #ea580c;
        stroke-width: 2.4;
        stroke-dasharray: 8 6;
        marker-end: url(#arrow);
      }
    </style>
  </defs>
  <rect width="1200" height="700" rx="22" fill="url(#bg)" />
  <text x="48" y="48" class="title">VideoResearcher — 모델은 고정하고 관찰 도구만 진화</text>
  <rect
    x="35"
    y="72"
    width="1130"
    height="260"
    rx="18"
    fill="#ffffffaa"
    stroke="#7c3aed"
    stroke-width="2"
  />
  <text x="60" y="105" class="label">① Solving Loop · 답변과 실행 궤적 수집</text>
  <rect x="65" y="140" width="165" height="92" rx="14" class="box" />
  <text x="147" y="174" text-anchor="middle" class="label">입력</text>
  <text x="147" y="202" text-anchor="middle" class="body">긴 비디오 V + 질문 q</text>
  <rect x="295" y="140" width="180" height="92" rx="14" class="fixed" />
  <text x="385" y="174" text-anchor="middle" class="label">Worker</text>
  <text x="385" y="202" text-anchor="middle" class="small">고정 · 도구/인자 선택</text>
  <rect x="540" y="128" width="225" height="116" rx="14" class="tool" />
  <text x="652" y="160" text-anchor="middle" class="label">Toolbox T⁽ʳ⁾</text>
  <text x="652" y="187" text-anchor="middle" class="small">초기: ask_video</text>
  <text x="652" y="211" text-anchor="middle" class="small">시간 분할 · 프레임 선택 · 집계</text>
  <rect x="830" y="140" width="190" height="92" rx="14" class="fixed" />
  <text x="925" y="174" text-anchor="middle" class="label">Perception</text>
  <text x="925" y="202" text-anchor="middle" class="small">고정 · 텍스트 관찰 반환</text>
  <path d="M230 186 H295" class="line" />
  <path d="M475 186 H540" class="line" />
  <path d="M765 186 H830" class="line" />
  <path d="M925 232 C925 286 385 286 385 233" class="line" />
  <text x="655" y="305" text-anchor="middle" class="small">
    관찰 → 추가 호출 또는 답 ŷ · 전체 상호작용 궤적 τ 저장
  </text>
  <rect
    x="35"
    y="358"
    width="1130"
    height="290"
    rx="18"
    fill="#ffffffaa"
    stroke="#ea580c"
    stroke-width="2"
  />
  <text x="80" y="392" class="label">Evolving Loop · 실패를 실행 가능한 새 관찰 절차로 변환</text>
  <rect x="65" y="432" width="180" height="92" rx="14" class="evolve" />
  <text x="155" y="466" text-anchor="middle" class="label">진단</text>
  <text x="155" y="492" text-anchor="middle" class="small">coverage · evidence 품질</text>
  <rect x="300" y="432" width="190" height="92" rx="14" class="evolve" />
  <text x="395" y="466" text-anchor="middle" class="label">명세 · 코딩</text>
  <text x="395" y="492" text-anchor="middle" class="small">후보 Python 도구 g̃</text>
  <rect x="545" y="420" width="235" height="116" rx="14" class="evolve" />
  <text x="662" y="454" text-anchor="middle" class="label">디버그 · 역검증</text>
  <text x="662" y="481" text-anchor="middle" class="small">같은 300문항 · 모델 · 시드</text>
  <text x="662" y="505" text-anchor="middle" class="small">A_val(g̃) &gt; A_val(T⁽ʳ⁾)?</text>
  <rect x="845" y="432" width="245" height="92" rx="14" class="accept" />
  <text x="967" y="466" text-anchor="middle" class="label">검증 · 기억</text>
  <text x="967" y="492" text-anchor="middle" class="small">개선 시 채택 · 모든 시도 기록</text>
  <path d="M245 478 H300" class="line" />
  <path d="M490 478 H545" class="line" />
  <path d="M780 478 H845" class="line" />
  <path d="M385 280 C250 315 50 325 50 478 H65" class="dash" />
  <text x="70" y="324" class="small">τ, 정답, 기존 toolbox</text>
  <path d="M967 432 C1110 410 1110 290 765 220" class="dash" />
  <text x="960" y="310" text-anchor="middle" class="small">채택된 T⁽ʳ⁺¹⁾만 다음 라운드로</text>
  <rect x="65" y="565" width="1025" height="55" rx="12" fill="#0f172a" />
  <text
    x="577"
    y="589"
    text-anchor="middle"
    style="
      font:
        700 15px Arial,
        &quot;Noto Sans KR&quot;,
        sans-serif;
      fill: #fff;
    "
  >
    진화: reference answer로 도구 선택 · 최종 추론: frozen toolbox + Worker + perception만 사용
  </text>
  <text
    x="577"
    y="610"
    text-anchor="middle"
    style="
      font:
        500 12px Arial,
        &quot;Noto Sans KR&quot;,
        sans-serif;
      fill: #cbd5e1;
    "
  >
    원 논문 Figure 2와 식 (1)–(8)을 바탕으로 재구성
  </text>
  <text x="600" y="679" text-anchor="middle" class="small">
    출처: arXiv:2609.19664v1 (Figure 2, Sections 3.1–3.3)
  </text>
</svg>
