  <title id="title">OccludeBench 진단 및 inpaint-then-confront 파이프라인</title>
  <desc id="desc">
    실제 이미지의 물체를 완전히 가린 뒤 direct와 inferential 증거를 평가하고, 네 단계 OccludeTrace로
    전체 장면 속 투영 회수 병목을 찾은 후 시각 가설 생성과 물리 일관성 대조로 답을 수정하는 흐름
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426" />
      <stop offset="1" stop-color="#15294a" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8fb8ff" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020817" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
