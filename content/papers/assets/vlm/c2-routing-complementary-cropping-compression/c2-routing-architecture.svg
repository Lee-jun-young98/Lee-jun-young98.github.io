<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc">
  <title id="title">C²-Routing의 crop, compression, safety fallback 구조</title>
  <desc id="desc">이미지와 질문을 공유 인코더에 넣고 crop 또는 compression을 선택한다. 공동 정답 상태를 예측한 safety gate가 축소 입력을 승인하거나 원본으로 되돌린 뒤 frozen target VLM이 답을 생성한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="crop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6fff5"/><stop offset="1" stop-color="#c8f7e5"/></linearGradient>
    <linearGradient id="comp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4df"/><stop offset="1" stop-color="#ffe2ab"/></linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2eaff"/><stop offset="1" stop-color="#ddccff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#20304a" flood-opacity="0.16"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#334155"/></marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0f8a64"/></marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#c2414b"/></marker>
    <style>
      .h1{font:700 34px 'Segoe UI','Noto Sans KR',sans-serif;fill:#12213a}.h2{font:700 22px 'Segoe UI','Noto Sans KR',sans-serif;fill:#17233b}.body{font:18px 'Segoe UI','Noto Sans KR',sans-serif;fill:#26364d}.small{font:15px 'Segoe UI','Noto Sans KR',sans-serif;fill:#526174}.mono{font:600 17px Consolas,monospace;fill:#27364c}.pill{font:700 15px 'Segoe UI','Noto Sans KR',sans-serif;fill:#fff}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="880" rx="28" fill="url(#bg)"/>
  <text x="750" y="58" text-anchor="middle" class="h1">C²-Routing: 근거의 공간 분포에 맞춘 입력 라우팅</text>
  <text x="750" y="90" text-anchor="middle" class="small">논문 Figure 2와 Eqs. 1-7을 바탕으로 재구성 · target VLM 내부 접근 없이 입력 단계에서 결정</text>

  <g filter="url(#shadow)">
    <rect x="55" y="170" width="235" height="205" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="80" y="200" width="112" height="105" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="110" cy="230" r="14" fill="#fbbf24"/><path d="M88 285 L124 252 L148 275 L171 242 L183 285 Z" fill="#65a30d"/>
    <rect x="97" y="215" width="65" height="55" rx="5" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="7 5"/>
    <text x="210" y="222" class="h2">입력</text><text x="210" y="255" class="body">이미지 I</text><text x="210" y="285" class="body">질문 Q</text>
    <text x="172" y="340" text-anchor="middle" class="small">작은 글자? 여러 객체 관계?</text>
  </g>

  <path d="M290 273 H355" class="line"/>
  <g filter="url(#shadow)">
    <rect x="355" y="180" width="275" height="185" rx="22" fill="#e8f1ff" stroke="#7aa2e3" stroke-width="2"/>
    <rect x="390" y="212" width="205" height="48" rx="24" fill="#315f9c"/>
    <text x="493" y="243" text-anchor="middle" class="pill">Frozen SmolVLM-500M</text>
    <text x="493" y="300" text-anchor="middle" class="h2">공유 image-question 특징</text>
    <text x="493" y="335" text-anchor="middle" class="mono">hᵢ = E(Iᵢ, Qᵢ)</text>
  </g>

  <path d="M630 273 H690" class="line"/>
  <g filter="url(#shadow)">
    <rect x="690" y="180" width="235" height="185" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="808" y="225" text-anchor="middle" class="h2">Selection head</text>
    <path d="M808 255 L856 290 L808 325 L760 290 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="808" y="295" text-anchor="middle" class="body">어느 전략?</text>
    <text x="808" y="345" text-anchor="middle" class="small">정답 우선, 동률이면 저비용</text>
  </g>

  <path d="M808 365 V410 H555 V444" fill="none" stroke="#0f8a64" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M808 365 V410 H1045 V444" fill="none" stroke="#c47a10" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="355" y="445" width="400" height="210" rx="22" fill="url(#crop)" stroke="#35a77d" stroke-width="2"/>
    <rect x="380" y="465" width="110" height="32" rx="16" fill="#0f8a64"/><text x="435" y="487" text-anchor="middle" class="pill">LOCAL</text>
    <text x="555" y="530" text-anchor="middle" class="h2">Crop branch</text>
    <text x="555" y="560" text-anchor="middle" class="body">Grounding DINO-tiny</text>
    <text x="555" y="590" text-anchor="middle" class="body">질문 관련 영역 localization · 작은 세부 확대</text>
    <text x="555" y="630" text-anchor="middle" class="mono">후보 R (최대 1,024 token)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="805" y="445" width="400" height="210" rx="22" fill="url(#comp)" stroke="#d79a32" stroke-width="2"/>
    <rect x="830" y="465" width="118" height="32" rx="16" fill="#b66d08"/><text x="889" y="487" text-anchor="middle" class="pill">GLOBAL</text>
    <text x="1005" y="530" text-anchor="middle" class="h2">Compression branch</text>
    <text x="1005" y="565" text-anchor="middle" class="body">Resolution head가 전체 이미지 예산 선택</text>
    <text x="1005" y="598" text-anchor="middle" class="body">분산된 근거·공간 관계·문맥을 유지</text>
    <text x="1005" y="630" text-anchor="middle" class="mono">후보 C₂₅₆ 또는 C₅₁₂</text>
  </g>

  <path d="M1205 550 H1250" class="line"/>
  <path d="M755 620 V675 H1218 V625 H1245" fill="none" stroke="#0f8a64" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <g filter="url(#shadow)">
    <rect x="1245" y="400" width="210" height="300" rx="22" fill="url(#gate)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="1350" y="445" text-anchor="middle" class="h2">Risk heads</text>
    <text x="1350" y="485" text-anchor="middle" class="small">공동 정답 상태 예측</text>
    <g transform="translate(1270 505)"><rect width="62" height="42" rx="9" fill="#dcfce7"/><text x="31" y="28" text-anchor="middle" class="mono">11</text><rect x="73" width="62" height="42" rx="9" fill="#fee2e2"/><text x="104" y="28" text-anchor="middle" class="mono">H</text><rect y="53" width="62" height="42" rx="9" fill="#dbeafe"/><text x="31" y="81" text-anchor="middle" class="mono">B</text><rect x="73" y="53" width="62" height="42" rx="9" fill="#e5e7eb"/><text x="104" y="81" text-anchor="middle" class="mono">00</text></g>
    <text x="1350" y="635" text-anchor="middle" class="mono">risk = pH - pB</text>
    <text x="1350" y="675" text-anchor="middle" class="small">축소 손해 - 축소 이익</text>
  </g>

  <path d="M1245 625 H1160 V735 H1005" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="650" y="700" width="355" height="125" rx="22" fill="#fff" stroke="#8b5cf6" stroke-width="3"/>
    <text x="828" y="740" text-anchor="middle" class="h2">Safety gate</text>
    <text x="828" y="775" text-anchor="middle" class="mono">pH - pB ≤ λ(1 - cost ratio) ?</text>
    <text x="828" y="805" text-anchor="middle" class="small">예상 정확도 손실과 계산 절감 비교</text>
  </g>
  <path d="M650 755 H530" fill="none" stroke="#0f8a64" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="590" y="742" text-anchor="middle" class="small" fill="#0f8a64">승인</text>
  <path d="M650 795 H530" fill="none" stroke="#c2414b" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="590" y="830" text-anchor="middle" class="small" fill="#c2414b">fallback</text>
  <g filter="url(#shadow)">
    <rect x="250" y="700" width="280" height="125" rx="22" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="390" y="740" text-anchor="middle" class="h2">최종 시각 입력</text>
    <text x="390" y="777" text-anchor="middle" class="mono">R / C₂₅₆ / C₅₁₂</text>
    <text x="390" y="808" text-anchor="middle" class="mono" fill="#c2414b">또는 원본 F₁₀₂₄</text>
  </g>
  <path d="M250 763 H175" class="line"/>
  <g filter="url(#shadow)">
    <rect x="35" y="690" width="140" height="145" rx="22" fill="#17233b"/>
    <text x="105" y="733" text-anchor="middle" class="pill">Frozen</text><text x="105" y="761" text-anchor="middle" class="pill">target VLM</text>
    <text x="105" y="800" text-anchor="middle" class="pill">1회 호출</text>
  </g>
  <text x="750" y="862" text-anchor="middle" class="small">학습: target VLM의 원본·축소 답으로 branch label 생성 · 추론: router 결정 후 최종 입력만 target VLM에 전달</text>
</svg>
