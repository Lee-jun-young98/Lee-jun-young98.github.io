<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">VLM의 binding, relay, cursor, select, gaze 계획 메커니즘</title>
  <desc id="desc">질문의 shape token과 이미지 token이 binding head에서 포인터로 결합되고 relay head가 이를 답변 token으로 전달한다. gaze head는 선택된 영역의 개념을 읽고 language head와 MLP가 단어를 생성한다. 여러 답에서는 마지막 answer token을 이미지 위치에 다시 결합해 cursor를 만들고 다음 미작성 영역을 선택한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#334155"/></marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
    <style>
      .h1{font:700 34px 'Segoe UI','Malgun Gothic',sans-serif;fill:#0f172a}.h2{font:700 23px 'Segoe UI','Malgun Gothic',sans-serif;fill:#0f172a}.t{font:18px 'Segoe UI','Malgun Gothic',sans-serif;fill:#334155}.s{font:15px 'Segoe UI','Malgun Gothic',sans-serif;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.violet{fill:#ede9fe;stroke:#7c3aed;stroke-width:3}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:3}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.pink{fill:#fce7f3;stroke:#db2777;stroke-width:3}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.flow{fill:none;stroke:#2563eb;stroke-width:4;marker-end:url(#arrowBlue)}.dash{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="900" fill="url(#bg)"/>
  <text x="750" y="55" text-anchor="middle" class="h1">VLM은 “어디를 볼지” 먼저 정하고, 포인터를 실행해 내용을 읽는다</text>
  <text x="60" y="105" class="h2">① 단일 답: request → pointer → visual concept → word</text>

  <rect x="55" y="135" width="275" height="180" rx="18" class="box"/>
  <text x="192" y="170" text-anchor="middle" class="h2">입력 image tokens</text>
  <rect x="80" y="195" width="52" height="82" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="106" y="242" text-anchor="middle" class="t">○A</text>
  <rect x="145" y="195" width="52" height="82" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="3"/><text x="171" y="242" text-anchor="middle" class="t">★T</text>
  <rect x="210" y="195" width="52" height="82" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="236" y="242" text-anchor="middle" class="t">□K</text>
  <text x="192" y="300" text-anchor="middle" class="s">image keys = 위치, values = 내용</text>

  <rect x="55" y="340" width="275" height="105" rx="18" class="box"/>
  <text x="192" y="375" text-anchor="middle" class="h2">질문 shape token</text>
  <text x="192" y="414" text-anchor="middle" class="t">“... inside the <tspan font-weight="700" fill="#2563eb">star</tspan>?”</text>

  <rect x="405" y="195" width="220" height="155" rx="18" class="blue"/>
  <text x="515" y="235" text-anchor="middle" class="h2">Binding heads</text>
  <text x="515" y="276" text-anchor="middle" class="t">query: 무엇을 찾나?</text>
  <text x="515" y="307" text-anchor="middle" class="t">key: 어디에 있나?</text>
  <text x="515" y="333" text-anchor="middle" class="s">→ 공간 pointer K</text>
  <path d="M330 225 C365 225 370 240 405 250" class="line"/><path d="M330 390 C370 390 370 310 405 300" class="line"/>

  <rect x="690" y="195" width="210" height="155" rx="18" class="violet"/>
  <text x="795" y="238" text-anchor="middle" class="h2">Relay heads</text>
  <text x="795" y="279" text-anchor="middle" class="t">shape token →</text>
  <text x="795" y="309" text-anchor="middle" class="t">colon/comma token</text>
  <text x="795" y="335" text-anchor="middle" class="s">pointer를 운반</text>
  <path d="M625 272 L690 272" class="flow"/>

  <rect x="965" y="195" width="210" height="155" rx="18" class="amber"/>
  <text x="1070" y="238" text-anchor="middle" class="h2">Gaze heads</text>
  <text x="1070" y="279" text-anchor="middle" class="t">pointer 실행</text>
  <text x="1070" y="309" text-anchor="middle" class="t">image value 읽기</text>
  <text x="1070" y="335" text-anchor="middle" class="s">→ 언어 독립 concept</text>
  <path d="M900 272 L965 272" class="flow"/><path d="M965 225 C850 120 340 115 200 195" class="dash"/>

  <rect x="1240" y="195" width="210" height="155" rx="18" class="green"/>
  <text x="1345" y="235" text-anchor="middle" class="h2">Language + MLP</text>
  <text x="1345" y="278" text-anchor="middle" class="t">질문 언어 선택</text>
  <text x="1345" y="309" text-anchor="middle" class="t">concept → “T”</text>
  <text x="1345" y="335" text-anchor="middle" class="s">최종 answer token</text>
  <path d="M1175 272 L1240 272" class="flow"/>

  <line x1="55" y1="485" x2="1445" y2="485" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="535" class="h2">② 여러 답: 이전 출력에서 progress를 매번 다시 만든다</text>

  <rect x="65" y="575" width="245" height="125" rx="18" class="pink"/>
  <text x="187" y="615" text-anchor="middle" class="h2">마지막 answer token</text>
  <text x="187" y="655" text-anchor="middle" class="t">“Answer: A, T,”</text>
  <text x="187" y="684" text-anchor="middle" class="s">직전에 쓴 글자 T</text>

  <rect x="385" y="575" width="235" height="125" rx="18" class="blue"/>
  <text x="502" y="615" text-anchor="middle" class="h2">Re-binding</text>
  <text x="502" y="655" text-anchor="middle" class="t">T ↔ 원래 image panel</text>
  <text x="502" y="684" text-anchor="middle" class="s">같은 binding 계열 재사용</text>
  <path d="M310 638 L385 638" class="flow"/>

  <rect x="695" y="575" width="235" height="125" rx="18" class="violet"/>
  <text x="812" y="615" text-anchor="middle" class="h2">Cursor</text>
  <text x="812" y="655" text-anchor="middle" class="t">“panel 4까지 완료”</text>
  <text x="812" y="684" text-anchor="middle" class="s">comma, layers 20–21</text>
  <path d="M620 638 L695 638" class="flow"/>

  <rect x="1005" y="555" width="245" height="165" rx="18" class="amber"/>
  <text x="1127" y="598" text-anchor="middle" class="h2">Select</text>
  <text x="1127" y="638" text-anchor="middle" class="t">후보 집합 + cursor</text>
  <text x="1127" y="670" text-anchor="middle" class="t">가장 가까운 미작성 영역</text>
  <text x="1127" y="700" text-anchor="middle" class="s">없으면 돌아가거나 stop</text>
  <path d="M930 638 L1005 638" class="flow"/>

  <rect x="1315" y="575" width="135" height="125" rx="18" class="green"/>
  <text x="1382" y="618" text-anchor="middle" class="h2">다음 pointer</text>
  <text x="1382" y="660" text-anchor="middle" class="t">→ Gaze</text>
  <text x="1382" y="687" text-anchor="middle" class="s">반복/종료</text>
  <path d="M1250 638 L1315 638" class="flow"/>

  <path d="M1380 575 C1370 470 1130 430 1070 350" class="dash"/>
  <rect x="90" y="770" width="1320" height="80" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="750" y="805" text-anchor="middle" class="t">핵심 구분: Binding/Relay는 <tspan font-weight="700" fill="#2563eb">주소(pointer)</tspan>를 정하고 운반한다. Gaze는 그 주소의 <tspan font-weight="700" fill="#d97706">내용(value)</tspan>을 읽는다.</text>
  <text x="750" y="834" text-anchor="middle" class="s">출처: Gandikota et al., “How VLMs Plan What’s Next,” Figure 1 및 Sections 4–6을 바탕으로 재구성</text>
</svg>
