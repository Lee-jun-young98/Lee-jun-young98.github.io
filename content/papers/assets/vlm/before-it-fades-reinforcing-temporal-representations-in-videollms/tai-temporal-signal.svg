<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Temporal Activation Injection 설명도</title>
  <desc id="desc">정방향과 역방향 영상의 중간층 활성 차이에서 시간 신호를 추출하고, 감쇠하는 후속 층에 프로파일 가중치로 다시 주입하는 흐름을 재구성한 그림</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="1" stop-color="#132a4b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.58" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0.35"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect width="1200" height="630" rx="26" fill="url(#bg)"/>
  <text x="60" y="67" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">TAI: 사라지기 전 시간 표현을 다시 붙잡기</text>
  <text x="60" y="101" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">Before It Fades · Figure 2·3 기반 재구성</text>

  <rect x="60" y="145" width="260" height="165" rx="18" fill="#0f2746" stroke="#38bdf8" stroke-width="2"/>
  <text x="86" y="180" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="20" font-weight="700">1. 대조 입력</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1">
    <rect x="88" y="201" width="44" height="42" rx="7" fill="#164e63"/><text x="103" y="228">1</text>
    <rect x="140" y="201" width="44" height="42" rx="7" fill="#155e75"/><text x="155" y="228">2</text>
    <rect x="192" y="201" width="44" height="42" rx="7" fill="#0e7490"/><text x="207" y="228">3</text>
    <text x="86" y="270">정방향 V + 질문 Q</text>
    <text x="86" y="296">역방향 Ṽ + 동일 질문</text>
  </g>

  <line x1="330" y1="228" x2="387" y2="228" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="400" y="145" width="330" height="300" rx="18" fill="#0f2746" stroke="#fbbf24" stroke-width="2"/>
  <text x="426" y="180" fill="#fef3c7" font-family="Arial, sans-serif" font-size="20" font-weight="700">2. 시간 발산 프로파일</text>
  <line x1="444" y1="376" x2="688" y2="376" stroke="#64748b" stroke-width="2"/>
  <line x1="444" y1="214" x2="444" y2="376" stroke="#64748b" stroke-width="2"/>
  <path d="M452 355 C500 350 518 320 548 270 C575 224 610 218 632 246 C655 276 668 324 684 348" fill="none" stroke="url(#signal)" stroke-width="8" stroke-linecap="round"/>
  <line x1="598" y1="207" x2="598" y2="379" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="598" cy="226" r="9" fill="#fbbf24"/>
  <text x="548" y="405" fill="#fbbf24" font-family="Arial, sans-serif" font-size="15">Lsrc: peak</text>
  <text x="471" y="428" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">중간층에서 커지고 출력층에서 감쇠</text>
  <text x="415" y="229" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" transform="rotate(-90 415 229)">τ̂l</text>

  <line x1="742" y1="228" x2="799" y2="228" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="812" y="145" width="328" height="300" rx="18" fill="#0f2746" stroke="#a78bfa" stroke-width="2"/>
  <text x="838" y="180" fill="#ede9fe" font-family="Arial, sans-serif" font-size="20" font-weight="700">3. TAI 재주입</text>
  <text x="838" y="218" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">τsteer = h<tspan baseline-shift="sub" font-size="12">fwd</tspan> − h<tspan baseline-shift="sub" font-size="12">rev</tspan> @ Lsrc</text>
  <g>
    <rect x="842" y="258" width="52" height="58" rx="8" fill="#164e63"/><text x="857" y="291" fill="#e0f2fe" font-family="Arial" font-size="14">Lsrc</text>
    <rect x="918" y="258" width="52" height="58" rx="8" fill="#4338ca"/><text x="933" y="291" fill="#e0e7ff" font-family="Arial" font-size="14">L+1</text>
    <rect x="994" y="258" width="52" height="58" rx="8" fill="#5b21b6"/><text x="1009" y="291" fill="#f3e8ff" font-family="Arial" font-size="14">L+2</text>
    <rect x="1070" y="258" width="42" height="58" rx="8" fill="#701a75"/><text x="1080" y="291" fill="#fae8ff" font-family="Arial" font-size="14">…</text>
    <path d="M894 287 H914 M970 287 H990 M1046 287 H1066" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M868 340 C910 370 1020 370 1091 340" fill="none" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="875" y="397" fill="#fde68a" font-family="Arial, sans-serif" font-size="15">β · wl · τsteer</text>
    <text x="838" y="424" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">감쇠 프로파일에 맞춰 후속 층 보강</text>
  </g>

  <rect x="60" y="490" width="1080" height="92" rx="16" fill="#0b203a" stroke="#334155"/>
  <text x="86" y="526" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="700">핵심 결과</text>
  <text x="86" y="555" fill="#bae6fd" font-family="Arial, sans-serif" font-size="17">학습 없이 3개 VideoLLM × 3개 시간 벤치마크의 평균 정확도를 모두 개선</text>
  <text x="745" y="555" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="17">Qwen2.5-VL: +2.0~+3.2%p</text>
  <text x="60" y="612" fill="#64748b" font-family="Arial, sans-serif" font-size="13">재구성 · 출처: arXiv:2610.01595, Figure 2–3 및 Section 3–5</text>
</svg>
