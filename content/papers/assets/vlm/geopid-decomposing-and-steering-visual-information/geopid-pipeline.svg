<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">GeoPID 표현 분해와 시각 고유 성분 증폭 파이프라인</title>
  <desc id="desc">
    이미지와 질문 토큰으로부터 공유, 시각 고유, 텍스트 고유, 시너지 부분공간을 추정하고, 선택된
    디코더 층에서 시각 고유 성분만 증폭해 답을 생성하는 흐름
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426" />
      <stop offset="1" stop-color="#10243d" />
    </linearGradient>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="9"
      refY="3"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M0,0 L0,6 L9,3 z" fill="#9fb4cc" />
    </marker>
    <style>
      .title {
        font:
          700 30px "Malgun Gothic",
          "Noto Sans KR",
          sans-serif;
        fill: #f7fbff;
      }
      .subtitle {
        font:
          500 16px "Malgun Gothic",
          "Noto Sans KR",
          sans-serif;
        fill: #a9bfd6;
      }
      .head {
        font:
          700 19px "Malgun Gothic",
          "Noto Sans KR",
          sans-serif;
        fill: #f7fbff;
      }
      .body {
        font:
          500 15px "Malgun Gothic",
          "Noto Sans KR",
          sans-serif;
        fill: #d9e6f2;
      }
      .small {
        font:
          500 13px "Malgun Gothic",
          "Noto Sans KR",
          sans-serif;
        fill: #adc2d5;
      }
      .math {
        font:
          700 17px "Segoe UI",
          sans-serif;
      }
      .box {
        fill: #122a45;
        stroke: #365473;
        stroke-width: 2;
      }
      .arrow {
        fill: none;
        stroke: #9fb4cc;
        stroke-width: 2.5;
        marker-end: url(#arrow);
      }
    </style>
  </defs>
  <rect width="1200" height="630" rx="24" fill="url(#bg)" />
  <text x="54" y="55" class="title">GeoPID: 기하로 진단하고 시각 고유 정보만 증폭</text>
  <text x="54" y="84" class="subtitle">
    논문 Figure 1 · Section 2를 바탕으로 재구성 — 동결 VLM, 가중치 업데이트 없음
  </text>

  <rect x="50" y="125" width="235" height="330" rx="18" class="box" />
  <text x="75" y="160" class="head">1. 멀티모달 입력</text>
  <rect
    x="75"
    y="184"
    width="82"
    height="82"
    rx="12"
    fill="#173f69"
    stroke="#4ea8de"
    stroke-width="2"
  />
  <circle cx="98" cy="211" r="10" fill="#ffd166" />
  <path d="M82 252 L108 223 L126 240 L145 215 L150 252 Z" fill="#4ea8de" opacity="0.9" />
  <text x="174" y="211" class="body">이미지 토큰</text>
  <text x="174" y="235" class="math" fill="#62c0f5">Vᵢ</text>
  <rect
    x="75"
    y="290"
    width="185"
    height="86"
    rx="12"
    fill="#3b2a25"
    stroke="#ff9f6e"
    stroke-width="2"
  />
  <text x="92" y="322" class="body">질문 / 지시문 토큰</text>
  <text x="92" y="351" class="math" fill="#ffab7d">Tᵢ</text>
  <text x="75" y="414" class="small">층별 hidden state 수집</text>
  <text x="75" y="438" class="small">샘플별 토큰 수 정규화</text>

  <path d="M285 290 H340" class="arrow" />

  <rect x="340" y="125" width="350" height="330" rx="18" class="box" />
  <text x="365" y="160" class="head">2. 기하적 PID 추정</text>
  <text x="365" y="188" class="small">PCA + principal angle + Rényi-2 MI</text>
  <rect
    x="365"
    y="215"
    width="138"
    height="76"
    rx="12"
    fill="#263d4c"
    stroke="#a7b6c4"
    stroke-width="2"
  />
  <text x="383" y="247" class="math" fill="#d8e2eb">Gᴿ</text>
  <text x="383" y="273" class="body">공유 방향</text>
  <rect
    x="527"
    y="215"
    width="138"
    height="76"
    rx="12"
    fill="#173f69"
    stroke="#4ea8de"
    stroke-width="3"
  />
  <text x="545" y="247" class="math" fill="#62c0f5">Gᵁⱽ</text>
  <text x="545" y="273" class="body">시각 고유</text>
  <rect
    x="365"
    y="313"
    width="138"
    height="76"
    rx="12"
    fill="#4a2d28"
    stroke="#ff9f6e"
    stroke-width="2"
  />
  <text x="383" y="345" class="math" fill="#ffab7d">Gᵁᵗ</text>
  <text x="383" y="371" class="body">텍스트 고유</text>
  <rect
    x="527"
    y="313"
    width="138"
    height="76"
    rx="12"
    fill="#243d34"
    stroke="#6ed5a3"
    stroke-width="2"
  />
  <text x="545" y="345" class="math" fill="#7ce0af">Gˢ</text>
  <text x="545" y="371" class="body">시너지 평가</text>
  <text x="365" y="420" class="small">정합 쌍 − 이미지 오배치 쌍 정보량</text>
  <text x="365" y="442" class="small">→ 질문·정답 관련 성분을 오프라인 진단</text>

  <path d="M690 290 H745" class="arrow" />

  <rect x="745" y="125" width="405" height="330" rx="18" class="box" />
  <text x="770" y="160" class="head">3. 추론 중 선택적 개입</text>
  <text x="770" y="190" class="small">100문항 calibration: 층 ℓ* · 강도 α 고정</text>
  <rect
    x="770"
    y="218"
    width="355"
    height="72"
    rx="12"
    fill="#173f69"
    stroke="#4ea8de"
    stroke-width="3"
  />
  <text x="792" y="249" class="math" fill="#f3f9ff">Vˡ* ← Vˡ*(I + αGᵁⱽGᵁⱽᵀ)</text>
  <text x="792" y="275" class="small">시각 고유 투영만 (1+α)배 · 직교 성분 보존</text>
  <path d="M947 290 V330" class="arrow" />
  <rect
    x="770"
    y="330"
    width="166"
    height="70"
    rx="12"
    fill="#213750"
    stroke="#567493"
    stroke-width="2"
  />
  <text x="790" y="360" class="body">후속 디코더 층</text>
  <text x="790" y="384" class="small">강화 증거 통합</text>
  <path d="M936 365 H980" class="arrow" />
  <rect
    x="980"
    y="330"
    width="145"
    height="70"
    rx="12"
    fill="#2c493d"
    stroke="#6ed5a3"
    stroke-width="2"
  />
  <text x="1010" y="360" class="body">최종 답변</text>
  <text x="998" y="384" class="small">시각 grounding ↑</text>
  <text x="770" y="435" class="small">샘플별 라벨·게이트 없이 고정 설정 적용</text>

  <rect
    x="50"
    y="490"
    width="1100"
    height="95"
    rx="16"
    fill="#0d2036"
    stroke="#274766"
    stroke-width="2"
  />
  <text x="75" y="524" class="head">핵심 차이</text>
  <text x="205" y="524" class="body">
    시각 전체를 무작정 키우지 않고, 텍스트로 설명되지 않는 시각 방향만 표적으로 삼는다.
  </text>
  <text x="75" y="554" class="small">분석: 시각 관찰형·결합형 정답에서 Uᵥ가 강함</text>
  <text x="475" y="554" class="small">개입: 동결 모델의 중간 활성값만 수정</text>
  <text x="845" y="554" class="small">출력: 전체 +5.1%p, 결합형 +9.6%p</text>
</svg>
