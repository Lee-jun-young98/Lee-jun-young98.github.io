<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="680"
  viewBox="0 0 1200 680"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">시각 인코더 기반 모델과 encoder-free MLLM의 구조 및 스케일링 비교</title>
  <desc id="desc">
    왼쪽은 사전학습 ViT를 거치는 encoder-based 경로와 raw patch를 decoder에 직접 넣는 encoder-free
    경로를 비교한다. 오른쪽은 작은 compute에서 encoder-free 멀티모달 손실이 높지만 약 6.1 곱하기
    10의 21승 FLOPs에서 fitted curve가 교차하는 모습을 설명한다.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eef2ff" />
    </linearGradient>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="9"
      refY="3"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
    <style>
      .label {
        font:
          600 22px system-ui,
          sans-serif;
        fill: #0f172a;
      }
      .body {
        font:
          17px system-ui,
          sans-serif;
        fill: #334155;
      }
      .small {
        font:
          15px system-ui,
          sans-serif;
        fill: #475569;
      }
      .box {
        rx: 14;
        stroke-width: 2;
      }
    </style>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)" />
  <text x="60" y="55" class="label">구조 선택이 바꾸는 멀티모달 스케일링</text>
  <text x="60" y="84" class="small">논문 Figure 1·2·4와 §3.1–3.2를 바탕으로 재구성</text>

  <rect
    x="45"
    y="115"
    width="520"
    height="500"
    rx="22"
    fill="#ffffff"
    stroke="#cbd5e1"
    stroke-width="2"
  />
  <text x="75" y="155" class="label">입력 경로</text>

  <text x="75" y="205" class="body">Encoder-based</text>
  <rect class="box" x="75" y="230" width="112" height="66" fill="#dbeafe" stroke="#60a5fa" />
  <text x="101" y="269" class="body">Image</text>
  <line
    x1="187"
    y1="263"
    x2="235"
    y2="263"
    stroke="#475569"
    stroke-width="3"
    marker-end="url(#arrow)"
  />
  <rect class="box" x="245" y="220" width="126" height="86" fill="#e0e7ff" stroke="#818cf8" />
  <text x="275" y="253" class="body">SigLIP 2</text>
  <text x="285" y="278" class="small">ViT prior</text>
  <line
    x1="371"
    y1="263"
    x2="419"
    y2="263"
    stroke="#475569"
    stroke-width="3"
    marker-end="url(#arrow)"
  />
  <rect class="box" x="429" y="230" width="105" height="66" fill="#ede9fe" stroke="#a78bfa" />
  <text x="450" y="258" class="body">MoE</text>
  <text x="442" y="282" class="small">decoder</text>

  <text x="75" y="370" class="body">Encoder-free</text>
  <rect class="box" x="75" y="395" width="112" height="66" fill="#dcfce7" stroke="#4ade80" />
  <text x="91" y="423" class="body">Raw image</text>
  <text x="104" y="447" class="small">patches</text>
  <line
    x1="187"
    y1="428"
    x2="255"
    y2="428"
    stroke="#475569"
    stroke-width="3"
    marker-end="url(#arrow)"
  />
  <rect class="box" x="265" y="385" width="154" height="86" fill="#fef3c7" stroke="#f59e0b" />
  <text x="286" y="418" class="body">Projection</text>
  <text x="280" y="445" class="small">no visual prior</text>
  <line
    x1="419"
    y1="428"
    x2="459"
    y2="428"
    stroke="#475569"
    stroke-width="3"
    marker-end="url(#arrow)"
  />
  <rect class="box" x="469" y="385" width="65" height="86" fill="#ffedd5" stroke="#fb923c" />
  <text x="481" y="420" class="body">MoE</text>
  <text x="477" y="445" class="small">takes</text>
  <text x="479" y="465" class="small">over</text>

  <rect x="75" y="505" width="459" height="76" rx="12" fill="#fff7ed" stroke="#fdba74" />
  <text x="95" y="535" class="small">시각 token 양방향 attention · 얕은 layer 재표현</text>
  <text x="95" y="561" class="small">· visual expert routing 집중으로 encoder 기능을 흡수</text>

  <rect
    x="600"
    y="115"
    width="555"
    height="500"
    rx="22"
    fill="#ffffff"
    stroke="#cbd5e1"
    stroke-width="2"
  />
  <text x="630" y="155" class="label">Compute-optimal 멀티모달 손실</text>
  <line
    x1="675"
    y1="520"
    x2="1095"
    y2="520"
    stroke="#64748b"
    stroke-width="2"
    marker-end="url(#arrow)"
  />
  <line
    x1="675"
    y1="520"
    x2="675"
    y2="205"
    stroke="#64748b"
    stroke-width="2"
    marker-end="url(#arrow)"
  />
  <text x="1015" y="555" class="small">학습 compute</text>
  <text x="625" y="225" class="small" transform="rotate(-90 625 225)">
    validation loss (낮을수록 좋음)
  </text>

  <path d="M700 295 C800 345, 900 405, 1080 472" fill="none" stroke="#4f46e5" stroke-width="5" />
  <path d="M700 245 C805 310, 890 400, 1080 490" fill="none" stroke="#ea580c" stroke-width="5" />
  <text x="720" y="280" class="small" fill="#4f46e5">Encoder-based</text>
  <text x="720" y="225" class="small" fill="#ea580c">Encoder-free</text>

  <line
    x1="950"
    y1="190"
    x2="950"
    y2="520"
    stroke="#0f172a"
    stroke-width="2"
    stroke-dasharray="8 7"
  />
  <circle cx="950" cy="438" r="8" fill="#0f172a" />
  <rect x="820" y="170" width="260" height="72" rx="12" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="839" y="199" class="small">외삽 교차점 점 추정치</text>
  <text x="839" y="225" class="body">6.1 × 10²¹ FLOPs</text>

  <rect x="705" y="555" width="390" height="35" rx="10" fill="#fee2e2" />
  <text x="727" y="579" class="small">주의: 측정값이 아니라 fitted law의 외삽 결과</text>
</svg>
