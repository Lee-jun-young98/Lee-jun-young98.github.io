  <title id="title">VideoEvolve 메모리와 검색 공진화 아키텍처</title>
  <desc id="desc">
    저프레임률 비디오에서 만든 고정 Base Memory를 Memory Evolver가 Delta로 보강하고 Retrieval
    Evolver가 질문별로 검색하며, BEF와 CEF가 두 정책의 다음 학습 주기를 조정하는 흐름
  </desc>
