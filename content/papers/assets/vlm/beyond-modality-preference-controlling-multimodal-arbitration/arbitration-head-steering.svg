<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">MLLM modality arbitration head 탐색과 추론 시점 steering 파이프라인</title>
  <desc id="desc">이미지 전용, 텍스트 전용, 충돌 입력의 activation patching으로 arbitration head를 찾고, 선택된 head에서 시각 또는 텍스트 token의 attention logit을 조절해 답을 지정 모달리티로 유도한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .h1{font:700 25px 'Pretendard','Noto Sans KR',sans-serif;fill:#0f172a}
      .h2{font:700 19px 'Pretendard','Noto Sans KR',sans-serif;fill:#172554}
      .body{font:500 15px 'Pretendard','Noto Sans KR',sans-serif;fill:#334155}
      .small{font:500 13px 'Pretendard','Noto Sans KR',sans-serif;fill:#475569}
      .mono{font:600 14px ui-monospace,monospace;fill:#312e81}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16}
      .arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="660" fill="url(#bg)" rx="24"/>
  <text x="48" y="48" class="h1">충돌 근거를 중재하는 소수 attention head를 찾아 양방향 제어</text>
  <text x="48" y="76" class="small">논문 Figure 1과 Eqs. 1–7을 바탕으로 재구성</text>

  <rect x="40" y="105" width="300" height="475" class="box"/>
  <text x="64" y="141" class="h2">1. 세 가지 실행</text>
  <rect x="66" y="170" width="248" height="88" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="84" y="201" class="body">이미지 전용 실행</text>
  <text x="84" y="228" class="small">시각 정답 yᵛ를 지지하는 head 출력 oᵥ</text>
  <rect x="66" y="278" width="248" height="88" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="84" y="309" class="body">텍스트 전용 실행</text>
  <text x="84" y="336" class="small">텍스트 정답 yᵗ를 지지하는 head 출력 oₜ</text>
  <rect x="66" y="386" width="248" height="126" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="84" y="417" class="body">이미지–텍스트 충돌 실행 I꜀</text>
  <text x="84" y="444" class="small">같은 질문, 서로 다른 답을 지지</text>
  <text x="84" y="476" class="mono">Δ = log p(yᵛ) − log p(yᵗ)</text>
  <text x="84" y="498" class="small">Δ &gt; 0: 시각 / Δ &lt; 0: 텍스트 선호</text>

  <rect x="385" y="105" width="380" height="475" class="box"/>
  <text x="409" y="141" class="h2">2. Arbitration head localization</text>
  <rect x="413" y="178" width="324" height="104" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="433" y="210" class="body">각 layer–head에 activation patching</text>
  <text x="433" y="239" class="small">oᵥ 또는 oₜ를 충돌 실행의 head 출력에 대입</text>
  <text x="433" y="262" class="small">→ 답 logit margin Δ의 인과적 변화 측정</text>
  <path d="M575 282 L575 321" class="arrow"/>
  <rect x="413" y="324" width="324" height="110" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="433" y="356" class="body">양방향 일관성 점수 C⁽ˡ·ʰ⁾</text>
  <text x="433" y="384" class="small">시각 패치와 텍스트 패치 모두에서</text>
  <text x="433" y="407" class="small">선호를 올바른 방향으로 움직이는 head 우선</text>
  <path d="M575 434 L575 470" class="arrow"/>
  <rect x="452" y="472" width="246" height="66" rx="33" fill="#312e81"/>
  <text x="498" y="501" style="font:700 16px 'Pretendard','Noto Sans KR',sans-serif;fill:#fff">상위 k=30 head 선택</text>
  <text x="491" y="523" style="font:500 12px 'Pretendard','Noto Sans KR',sans-serif;fill:#c7d2fe">1,000+ head 중 compact control point</text>

  <path d="M340 238 C365 238 365 225 407 225" class="dash"/>
  <path d="M340 326 C365 326 365 246 407 246" class="dash"/>
  <path d="M340 448 C365 448 370 263 407 263" class="dash"/>

  <rect x="810" y="105" width="350" height="475" class="box"/>
  <text x="834" y="141" class="h2">3. 추론 시점 attention steering</text>
  <rect x="839" y="173" width="292" height="116" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="859" y="205" class="body">선택된 head의 pre-softmax logit</text>
  <text x="859" y="234" class="small">신뢰 token: + αĉ⁽ˡ·ʰ⁾</text>
  <text x="859" y="259" class="small">경쟁 token: − αĉ⁽ˡ·ʰ⁾</text>
  <path d="M985 289 L985 327" class="arrow"/>
  <rect x="839" y="330" width="292" height="84" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="859" y="361" class="body">양방향 출력 제어</text>
  <text x="859" y="388" class="small">이미지 우선 ↔ 텍스트 우선</text>
  <rect x="839" y="447" width="292" height="93" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="859" y="478" class="body">Adaptive gate</text>
  <text x="859" y="504" class="small">단일 모달리티 logit 유사도 s가 낮을수록</text>
  <text x="859" y="526" class="small">충돌로 보고 α를 크게 설정</text>
  <path d="M765 505 C792 505 792 230 833 230" class="arrow"/>
  <path d="M1120 447 L1120 298" class="arrow"/>

  <rect x="40" y="606" width="1120" height="34" rx="10" fill="#e2e8f0"/>
  <text x="60" y="628" class="small">핵심 차이: 한 모달리티를 삭제하거나 전체 hidden state를 이동하지 않고, 인과적으로 찾은 head에서 두 근거의 상대 attention만 조절한다.</text>
</svg>
