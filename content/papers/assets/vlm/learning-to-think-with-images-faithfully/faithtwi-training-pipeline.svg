<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FaithTwI 적응형 데이터 선택과 훈련 파이프라인</title>
  <desc id="desc">고해상도 이미지에서 질문과 정답 crop을 합성하고, 현재 정책의 전체 이미지 정확도와 crop 포함 정확도를 비교해 zoom이 유용한 질문만 선택한 뒤 적응성 보상을 포함한 GRPO로 정책을 갱신하는 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .h1 { font-size: 36px; font-weight: 750; }
      .stage { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 15px; fill: #475569; }
      .formula { font-size: 17px; font-weight: 650; fill: #1d4ed8; }
      .box { fill: white; stroke: #cbd5e1; stroke-width: 2; rx: 20; filter: url(#shadow); }
      .chip { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 12; }
      .flow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .blueflow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="58" text-anchor="middle" class="h1">FaithTwI: zoom이 실제로 도움 되는 질문만 계속 학습</text>
  <text x="800" y="91" text-anchor="middle" class="body" fill="#475569">논문 Figure 4와 Equations 2–5를 바탕으로 재구성</text>

  <rect x="55" y="135" width="360" height="605" class="box"/>
  <rect x="620" y="135" width="430" height="605" class="box"/>
  <rect x="1265" y="135" width="280" height="605" class="box"/>

  <circle cx="93" cy="178" r="22" fill="#2563eb"/>
  <text x="93" y="185" text-anchor="middle" font-size="20" font-weight="700" style="fill:#ffffff">1</text>
  <text x="128" y="186" class="stage">검증된 질문 합성</text>

  <rect x="87" y="225" width="296" height="92" class="chip"/>
  <text x="235" y="255" text-anchor="middle" class="body" font-weight="650">고해상도 이미지 I</text>
  <text x="235" y="282" text-anchor="middle" class="small">타일 분할 → 물체 유형 열거</text>
  <text x="235" y="304" text-anchor="middle" class="small">SAM3 box, confidence 상위 32개</text>

  <path d="M235 318 L235 350" class="flow"/>
  <rect x="87" y="352" width="296" height="108" class="chip"/>
  <text x="235" y="382" text-anchor="middle" class="body" font-weight="650">질문·증거 생성</text>
  <text x="235" y="409" text-anchor="middle" class="small">전체 이미지 + 물체 crop + 주변 crop</text>
  <text x="235" y="434" text-anchor="middle" class="small">속성 질문 / 공간 관계 질문</text>

  <path d="M235 461 L235 493" class="flow"/>
  <rect x="87" y="495" width="296" height="138" class="chip"/>
  <text x="235" y="525" text-anchor="middle" class="body" font-weight="650">3단계 검증</text>
  <text x="108" y="555" class="small">① 대상이 하나로 특정되는가?</text>
  <text x="108" y="581" class="small">② crop이 정답을 지지하는가?</text>
  <text x="108" y="607" class="small">③ 이미지 없이 추측할 수 없는가?</text>

  <rect x="106" y="662" width="258" height="48" rx="24" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="235" y="692" text-anchor="middle" class="body" font-weight="700">(I, q, y, V⁺)</text>

  <path d="M415 430 C505 430, 525 430, 620 430" class="blueflow"/>

  <circle cx="658" cy="178" r="22" fill="#2563eb"/>
  <text x="658" y="185" text-anchor="middle" font-size="20" font-weight="700" style="fill:#ffffff">2</text>
  <text x="693" y="186" class="stage">현재 정책으로 증거 이득 측정</text>

  <rect x="660" y="226" width="350" height="70" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="835" y="255" text-anchor="middle" class="body" font-weight="650">현재 정책 π<tspan baseline-shift="sub" font-size="13">t</tspan></text>
  <text x="835" y="281" text-anchor="middle" class="small">같은 모델, 같은 질문, 입력 증거만 변경</text>

  <path d="M835 297 L835 329" stroke="#334155" stroke-width="3"/>
  <path d="M835 329 L730 363" class="flow"/>
  <path d="M835 329 L940 363" class="flow"/>

  <rect x="652" y="365" width="170" height="120" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="737" y="397" text-anchor="middle" class="body" font-weight="700">Branch A</text>
  <text x="737" y="426" text-anchor="middle" class="small">전체 이미지 I</text>
  <text x="737" y="450" text-anchor="middle" class="small">+ 질문 q</text>
  <text x="737" y="475" text-anchor="middle" class="formula">acc(I,q)</text>

  <rect x="848" y="365" width="170" height="120" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="933" y="397" text-anchor="middle" class="body" font-weight="700">Branch B</text>
  <text x="933" y="426" text-anchor="middle" class="small">전체 이미지 I</text>
  <text x="933" y="450" text-anchor="middle" class="small">+ 정답 crop V⁺</text>
  <text x="933" y="475" text-anchor="middle" class="formula">acc(I,V⁺,q)</text>

  <path d="M737 486 L794 526" class="flow"/>
  <path d="M933 486 L876 526" class="flow"/>
  <polygon points="835,510 982,578 835,646 688,578" fill="#eef2ff" stroke="#818cf8" stroke-width="2.5"/>
  <text x="835" y="564" text-anchor="middle" class="body" font-weight="700">crop 이득 ≥ δ ?</text>
  <text x="835" y="591" text-anchor="middle" class="formula">acc(I,V⁺,q) − acc(I,q)</text>
  <text x="835" y="617" text-anchor="middle" class="small">매 RL step에서 다시 계산</text>

  <text x="1018" y="570" class="small" font-weight="700" fill="#16a34a">YES</text>
  <path d="M982 578 C1110 578, 1145 430, 1265 430" class="blueflow"/>
  <text x="835" y="682" text-anchor="middle" class="small" fill="#dc2626">NO → 이번 step 학습에서 제외</text>

  <circle cx="1303" cy="178" r="22" fill="#2563eb"/>
  <text x="1303" y="185" text-anchor="middle" font-size="20" font-weight="700" style="fill:#ffffff">3</text>
  <text x="1338" y="186" class="stage">GRPO 갱신</text>

  <rect x="1293" y="235" width="224" height="115" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="1405" y="267" text-anchor="middle" class="body" font-weight="700">실제 rollout</text>
  <text x="1405" y="295" text-anchor="middle" class="small">입력: I, q만 제공</text>
  <text x="1405" y="320" text-anchor="middle" class="small">직접 답변 또는 zoom 선택</text>

  <path d="M1405 351 L1405 384" class="flow"/>
  <rect x="1293" y="386" width="224" height="157" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="1405" y="418" text-anchor="middle" class="body" font-weight="700">보상</text>
  <text x="1405" y="448" text-anchor="middle" class="small">정답 r<tspan baseline-shift="sub" font-size="11">acc</tspan></text>
  <text x="1405" y="474" text-anchor="middle" class="small">형식 r<tspan baseline-shift="sub" font-size="11">fmt</tspan></text>
  <text x="1405" y="500" text-anchor="middle" class="small">적응성 r<tspan baseline-shift="sub" font-size="11">adapt</tspan></text>
  <text x="1405" y="526" text-anchor="middle" class="small">풀 수 있으면 tool-free 정답 우대</text>

  <path d="M1405 544 L1405 577" class="flow"/>
  <rect x="1293" y="579" width="224" height="82" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="1405" y="611" text-anchor="middle" class="body" font-weight="700">FaithTwI 정책</text>
  <text x="1405" y="638" text-anchor="middle" class="small">필요할 때만 zoom</text>

  <rect x="55" y="782" width="1490" height="74" rx="18" fill="#0f172a"/>
  <text x="800" y="813" text-anchor="middle" font-size="19" font-weight="700" style="fill:#ffffff">훈련과 추론의 차이</text>
  <text x="800" y="840" text-anchor="middle" font-size="17" style="fill:#cbd5e1">정답 crop V⁺는 샘플 선택에만 사용 · 실제 rollout과 추론에서는 정책이 전체 이미지와 질문만 보고 직접 답할지 zoom할지 결정</text>
</svg>
