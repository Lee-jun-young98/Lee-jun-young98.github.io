<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">VLM reality monitoring concept-injection pipeline</title>
  <desc id="desc">An image and question pass through a vision encoder and language model. A visual concept direction can enter image tokens and a thought concept direction can enter answer tokens. The model reports seen content, whether an injection occurred, and the injected thought. Report-gate and image-state replacement interventions separate reporting failure from source misattribution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="pinkArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#db2777"/>
    </marker>
    <marker id="amberArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <style>
      .k { font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill: #0f172a; }
      .small { font-size: 16px; }
      .body { font-size: 18px; }
      .label { font-size: 20px; font-weight: 700; }
      .head { font-size: 30px; font-weight: 800; }
      .muted { fill: #475569; }
      .white { fill: #ffffff; }
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="54" y="55" class="k head">VLM Reality Monitoring: 내용과 출처를 분리해 평가</text>
  <text x="55" y="84" class="k small muted">Figure 1 · Figure 4 · Figure 5 · Eq. 1을 바탕으로 재구성</text>

  <g filter="url(#shadow)">
    <rect x="54" y="130" width="190" height="142" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="78" y="155" width="68" height="68" rx="12" fill="#e0f2fe" stroke="#38bdf8"/>
    <circle cx="112" cy="187" r="17" fill="#38bdf8"/>
    <path d="M88 216l20-20 14 12 12-9 9 17z" fill="#0ea5e9" opacity="0.7"/>
    <text x="162" y="178" class="k label">이미지</text>
    <text x="162" y="205" class="k small muted">gray / Y</text>
    <text x="78" y="250" class="k small">질문 + 보고 형식</text>
  </g>

  <path d="M244 201 H305" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="318" y="130" width="220" height="142" rx="20" fill="#0f766e"/>
    <text x="428" y="177" text-anchor="middle" class="k label white">Vision Encoder</text>
    <text x="428" y="208" text-anchor="middle" class="k body white">image → 256 tokens</text>
    <text x="428" y="238" text-anchor="middle" class="k small white">SigLIP (Gemma-3)</text>
  </g>

  <path d="M538 201 H601" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="614" y="130" width="260" height="142" rx="20" fill="url(#model)"/>
    <text x="744" y="175" text-anchor="middle" class="k label white">Language Model</text>
    <text x="744" y="207" text-anchor="middle" class="k body white">image tokens + question</text>
    <text x="744" y="238" text-anchor="middle" class="k small white">62 layers · residual stream</text>
  </g>

  <path d="M874 201 H932" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="945" y="118" width="205" height="166" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1047" y="153" text-anchor="middle" class="k label">구조화된 보고</text>
    <rect x="970" y="170" width="155" height="30" rx="8" fill="#e0f2fe"/>
    <text x="981" y="191" class="k small">SEEN: 무엇?</text>
    <rect x="970" y="207" width="155" height="30" rx="8" fill="#fef3c7"/>
    <text x="981" y="228" class="k small">INJECTED: yes/no</text>
    <rect x="970" y="244" width="155" height="30" rx="8" fill="#fce7f3"/>
    <text x="981" y="265" class="k small">THOUGHT: 무엇?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="330" width="250" height="110" rx="18" fill="#fdf2f8" stroke="#f472b6" stroke-width="2"/>
    <text x="465" y="363" text-anchor="middle" class="k label" fill="#9d174d">Visual injection</text>
    <text x="465" y="391" text-anchor="middle" class="k body">vision encoder / image token</text>
    <text x="465" y="419" text-anchor="middle" class="k small muted">주로 “보았다”로 보고</text>
  </g>
  <path d="M465 330 C465 298 428 302 428 274" fill="none" stroke="#db2777" stroke-width="4" marker-end="url(#pinkArrow)"/>
  <path d="M530 330 C568 300 640 310 660 274" fill="none" stroke="#db2777" stroke-width="4" marker-end="url(#pinkArrow)"/>

  <g filter="url(#shadow)">
    <rect x="652" y="330" width="250" height="110" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="777" y="363" text-anchor="middle" class="k label" fill="#92400e">Thought injection</text>
    <text x="777" y="391" text-anchor="middle" class="k body">assistant / answer tokens</text>
    <text x="777" y="419" text-anchor="middle" class="k small muted">약하면 생각, 강하면 시각 누출</text>
  </g>
  <path d="M777 330 V277" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#amberArrow)"/>

  <rect x="74" y="334" width="214" height="101" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="181" y="366" text-anchor="middle" class="k label">상대적 주입</text>
  <text x="181" y="397" text-anchor="middle" class="k body">h ← h + α‖h‖v̂<tspan baseline-shift="sub" font-size="13">c</tspan></text>
  <text x="181" y="422" text-anchor="middle" class="k small muted">층별 activation norm 보정</text>

  <line x1="52" y1="483" x2="1148" y2="483" stroke="#cbd5e1" stroke-width="2"/>
  <text x="55" y="520" class="k label">추가 개입으로 실패 유형 분리</text>

  <g filter="url(#shadow)">
    <rect x="55" y="545" width="340" height="90" rx="18" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <circle cx="92" cy="590" r="20" fill="#4f46e5"/>
    <text x="92" y="597" text-anchor="middle" class="k body white">1</text>
    <text x="126" y="578" class="k label">Report-gate push</text>
    <text x="126" y="608" class="k small muted">누락된 thought report 복구 여부</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="545" width="340" height="90" rx="18" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="467" cy="590" r="20" fill="#0f766e"/>
    <text x="467" y="597" text-anchor="middle" class="k body white">2</text>
    <text x="501" y="578" class="k label">Image-state replacement</text>
    <text x="501" y="608" class="k small muted">시각 억제 구간: layer 15–25</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="805" y="545" width="340" height="90" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="842" cy="590" r="20" fill="#d97706"/>
    <text x="842" y="597" text-anchor="middle" class="k body white">3</text>
    <text x="876" y="578" class="k label">일반 caption / yes-no</text>
    <text x="876" y="608" class="k small muted">없는 물체 언급: 최대 87%</text>
  </g>
</svg>
