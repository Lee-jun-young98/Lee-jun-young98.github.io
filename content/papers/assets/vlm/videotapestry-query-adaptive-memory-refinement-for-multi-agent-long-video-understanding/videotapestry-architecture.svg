<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">VideoTapestry의 계층형 질문 적응 메모리 정제 구조</title>
  <desc id="desc">
    긴 비디오에서 미리 구축한 SuperEvent, MacroEvent, Subgraph 계층을 Overview, Skim, Focus
    에이전트가 질문에 맞춰 순서대로 관찰하고 수정한 뒤, 전역 뼈대와 세부 경로를 합쳐 Answer Agent에
    전달하는 추론 파이프라인
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc" />
      <stop offset="1" stop-color="#eef2ff" />
    </linearGradient>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="9"
      refY="3"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .title {
        font:
          700 28px "Malgun Gothic",
          "Noto Sans KR",
          sans-serif;
        fill: #0f172a;
      }
      .subtitle {
        font:
          500 14px "Malgun Gothic",
          "Noto Sans KR",
          sans-serif;
        fill: #475569;
      }
      .head {
        font:
          700 18px "Malgun Gothic",
          "Noto Sans KR",
          sans-serif;
        fill: #0f172a;
      }
      .body {
        font:
          500 14px "Malgun Gothic",
          "Noto Sans KR",
          sans-serif;
        fill: #334155;
      }
      .small {
        font:
          500 12px "Malgun Gothic",
          "Noto Sans KR",
          sans-serif;
        fill: #475569;
      }
      .pill {
        font:
          700 12px "Malgun Gothic",
          "Noto Sans KR",
          sans-serif;
        fill: #ffffff;
      }
      .arrow {
        stroke: #334155;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
  </defs>
  <rect width="1200" height="630" rx="24" fill="url(#bg)" />
  <text x="48" y="52" class="title">VideoTapestry: 질문에 따라 다시 짜는 장시간 비디오 메모리</text>
  <text x="48" y="78" class="subtitle">
    논문 Figure 2와 Sections 3.1–3.3을 바탕으로 재구성 · 학습 없이 질문별 추론에서만 정제
  </text>

  <rect
    x="46"
    y="112"
    width="210"
    height="438"
    rx="18"
    fill="#ffffff"
    stroke="#94a3b8"
    stroke-width="2"
  />
  <rect x="66" y="132" width="170" height="48" rx="12" fill="#1e3a8a" />
  <text x="151" y="153" text-anchor="middle" class="pill">입력</text>
  <text x="151" y="170" text-anchor="middle" class="pill">긴 비디오 + 질문</text>
  <text x="68" y="208" class="head">오프라인 고정 메모리</text>
  <rect x="68" y="230" width="166" height="72" rx="12" fill="#dbeafe" stroke="#60a5fa" />
  <text x="151" y="258" text-anchor="middle" class="head">SuperEvent</text>
  <text x="151" y="282" text-anchor="middle" class="small">전역 서사 · 큰 시간대</text>
  <path d="M151 302 L151 325" class="arrow" />
  <rect x="68" y="326" width="166" height="72" rx="12" fill="#dcfce7" stroke="#4ade80" />
  <text x="151" y="354" text-anchor="middle" class="head">MacroEvent</text>
  <text x="151" y="378" text-anchor="middle" class="small">국소 사건 · 후보 구간</text>
  <path d="M151 398 L151 421" class="arrow" />
  <rect x="68" y="422" width="166" height="82" rx="12" fill="#fef3c7" stroke="#fbbf24" />
  <text x="151" y="449" text-anchor="middle" class="head">Subgraph</text>
  <text x="151" y="472" text-anchor="middle" class="small">Entity · Event · OCR</text>
  <text x="151" y="490" text-anchor="middle" class="small">typed relation</text>
  <text x="151" y="530" text-anchor="middle" class="small">질문과 독립적으로 1회 구축</text>

  <path d="M256 330 L302 330" class="arrow" />
  <rect
    x="304"
    y="112"
    width="550"
    height="438"
    rx="18"
    fill="#ffffff"
    stroke="#64748b"
    stroke-width="2"
  />
  <text x="332" y="145" class="head">질문별 coarse-to-fine 정제</text>
  <text x="332" y="169" class="small">각 수준: Plan → Observe → Update → Decide</text>

  <rect
    x="330"
    y="196"
    width="498"
    height="92"
    rx="14"
    fill="#eff6ff"
    stroke="#3b82f6"
    stroke-width="2"
  />
  <circle cx="365" cy="230" r="21" fill="#2563eb" />
  <text x="365" y="235" text-anchor="middle" class="pill">1</text>
  <text x="400" y="225" class="head">Overview Agent · Super 수준</text>
  <text x="400" y="249" class="body">넓은 구간의 프레임 grid + 선택 구간 ASR 관찰</text>
  <text x="400" y="270" class="small">관련 노드와 이웃은 보강, 무관한 전역 노드는 압축</text>

  <path d="M579 288 L579 313" class="arrow" />
  <rect
    x="330"
    y="314"
    width="498"
    height="92"
    rx="14"
    fill="#f0fdf4"
    stroke="#22c55e"
    stroke-width="2"
  />
  <circle cx="365" cy="348" r="21" fill="#16a34a" />
  <text x="365" y="353" text-anchor="middle" class="pill">2</text>
  <text x="400" y="343" class="head">Skim Agent · Macro 수준</text>
  <text x="400" y="367" class="body">선택된 부모의 사건 구간만 세밀하게 재관찰</text>
  <text x="400" y="388" class="small">후보를 좁히고 다음 검증 instruction 전달</text>

  <path d="M579 406 L579 431" class="arrow" />
  <rect
    x="330"
    y="432"
    width="498"
    height="92"
    rx="14"
    fill="#fffbeb"
    stroke="#f59e0b"
    stroke-width="2"
  />
  <circle cx="365" cy="466" r="21" fill="#d97706" />
  <text x="365" y="471" text-anchor="middle" class="pill">3</text>
  <text x="400" y="461" class="head">Focus Agent · Subgraph 수준</text>
  <text x="400" y="485" class="body">객체 · 행동 · OCR · 관계를 프레임으로 검증</text>
  <text x="400" y="506" class="small">세부 설명을 다시 쓰고 계층 탐색 종료</text>

  <path d="M854 330 L898 330" class="arrow" />
  <rect
    x="900"
    y="112"
    width="254"
    height="438"
    rx="18"
    fill="#ffffff"
    stroke="#7c3aed"
    stroke-width="2"
  />
  <text x="1027" y="150" text-anchor="middle" class="head">Composite Memory</text>
  <rect x="922" y="177" width="210" height="88" rx="14" fill="#ede9fe" stroke="#8b5cf6" />
  <text x="1027" y="208" text-anchor="middle" class="body">압축된 전역 scaffold</text>
  <text x="1027" y="232" text-anchor="middle" class="small">video-wide context 유지</text>
  <text x="1027" y="250" text-anchor="middle" class="small">관련 SuperEvent는 증거 보강</text>
  <text x="1027" y="295" text-anchor="middle" class="head">+</text>
  <rect x="922" y="316" width="210" height="88" rx="14" fill="#fae8ff" stroke="#c026d3" />
  <text x="1027" y="347" text-anchor="middle" class="body">정제된 local paths</text>
  <text x="1027" y="371" text-anchor="middle" class="small">MacroEvent → Subgraph</text>
  <text x="1027" y="389" text-anchor="middle" class="small">질문 관련 세부 증거 유지</text>
  <path d="M1027 404 L1027 431" class="arrow" />
  <rect x="922" y="433" width="210" height="70" rx="14" fill="#6d28d9" />
  <text x="1027" y="461" text-anchor="middle" class="pill">Answer Agent</text>
  <text x="1027" y="482" text-anchor="middle" class="pill">추가 검색 없이 답변</text>
  <text x="1027" y="529" text-anchor="middle" class="small">전역 맥락 + 세부 증거를 함께 제공</text>

  <rect x="46" y="574" width="1108" height="34" rx="10" fill="#e2e8f0" />
  <text x="600" y="596" text-anchor="middle" class="body">
    핵심 차이: 새 증거를 로그 끝에 붙이지 않고, 관련 메모리 노드를 다시 써서 원래 계층에 조립한다.
  </text>
</svg>
