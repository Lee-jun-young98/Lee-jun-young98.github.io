<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="700"
  viewBox="0 0 1200 700"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Reasoning-need routed decoding control 파이프라인</title>
  <desc id="desc">
    이미지와 질문이 동결된 LLaDA-V의 확산 궤적을 만들고 answer closure, visual-format closure,
    representation revision pressure를 계산한 뒤 Reason, Commit, Preserve 경로로 분기되는 추론 흐름
  </desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155" />
    </marker>
    <style>
      .h1 {
        font:
          700 28px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #0f172a;
      }
      .h2 {
        font:
          700 19px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #0f172a;
      }
      .body {
        font:
          15px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #334155;
      }
      .small {
        font:
          13px Arial,
          "Noto Sans KR",
          sans-serif;
        fill: #475569;
      }
      .box {
        stroke-width: 2;
        rx: 16;
      }
      .arrow {
        stroke: #334155;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrow);
      }
      .dash {
        stroke-dasharray: 7 6;
      }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc" />
  <text x="60" y="54" class="h1">Reasoning-need routed decoding control</text>
  <text x="60" y="82" class="small">
    논문 Figure 2 · Sections 3.1–3.6 · Equations (1)–(12) · Algorithm 1 기반 재구성
  </text>

  <rect x="55" y="128" width="190" height="150" class="box" fill="#dbeafe" stroke="#2563eb" />
  <text x="150" y="163" text-anchor="middle" class="h2">멀티모달 입력</text>
  <text x="80" y="200" class="body">• 이미지 xᵥ</text>
  <text x="80" y="228" class="body">• 질문 x_q / 보기 c</text>
  <text x="80" y="256" class="body">• 선택적 CoT 지시 I</text>

  <path d="M245 203 H305" class="arrow" />
  <rect x="305" y="122" width="260" height="162" class="box" fill="#ede9fe" stroke="#7c3aed" />
  <text x="435" y="158" text-anchor="middle" class="h2">동결된 LLaDA-V</text>
  <text x="330" y="194" class="body">기본 예산 B=(T,L,M)</text>
  <text x="330" y="222" class="body">128-step masked refinement</text>
  <text x="330" y="250" class="body">z_t=(y_t, H_t, P_t)</text>
  <text x="435" y="312" text-anchor="middle" class="small">
    가중치 업데이트 · verifier · 정답 라벨 없음
  </text>

  <path d="M565 203 H625" class="arrow" />
  <rect x="625" y="105" width="510" height="205" class="box" fill="#ffffff" stroke="#64748b" />
  <text x="880" y="140" text-anchor="middle" class="h2">관찰된 확산 궤적에서 3개 신호 추출</text>
  <rect x="650" y="164" width="142" height="112" rx="12" fill="#e0f2fe" stroke="#0284c7" />
  <text x="721" y="194" text-anchor="middle" class="h2">C_A</text>
  <text x="721" y="220" text-anchor="middle" class="body">Answer closure</text>
  <text x="721" y="248" text-anchor="middle" class="small">파싱 답 반복·안정성</text>
  <rect x="810" y="164" width="142" height="112" rx="12" fill="#dcfce7" stroke="#16a34a" />
  <text x="881" y="194" text-anchor="middle" class="h2">C_V</text>
  <text x="881" y="220" text-anchor="middle" class="body">Visual-format</text>
  <text x="881" y="248" text-anchor="middle" class="small">형식·시각 attention·위험</text>
  <rect x="970" y="164" width="142" height="112" rx="12" fill="#ffedd5" stroke="#ea580c" />
  <text x="1041" y="194" text-anchor="middle" class="h2">ρ</text>
  <text x="1041" y="220" text-anchor="middle" class="body">Revision pressure</text>
  <text x="1041" y="248" text-anchor="middle" class="small">초기/최종층 JS divergence</text>

  <path d="M880 310 V362" class="arrow" />
  <rect x="425" y="362" width="710" height="82" class="box" fill="#f1f5f9" stroke="#475569" />
  <text x="780" y="394" text-anchor="middle" class="h2">라우팅 정책 Π(x)</text>
  <text x="780" y="423" text-anchor="middle" class="body">
    CoT-sensitive guard 우선 → 안정적 commitment 검사 → 나머지는 preserve
  </text>

  <path d="M570 444 V493" class="arrow" />
  <path d="M780 444 V493" class="arrow" />
  <path d="M990 444 V493" class="arrow" />
  <rect x="440" y="493" width="260" height="120" class="box" fill="#fee2e2" stroke="#dc2626" />
  <text x="570" y="528" text-anchor="middle" class="h2">ReasonRoute</text>
  <text x="570" y="557" text-anchor="middle" class="body">미해결 또는 ρ가 높음</text>
  <text x="570" y="584" text-anchor="middle" class="small">λ_on으로 추론 지원 재디코딩</text>
  <rect x="715" y="493" width="260" height="120" class="box" fill="#fef3c7" stroke="#d97706" />
  <text x="845" y="528" text-anchor="middle" class="h2">CommitRoute</text>
  <text x="845" y="557" text-anchor="middle" class="body">C_A↑ · C_V↑ · ρ↓</text>
  <text x="845" y="584" text-anchor="middle" class="small">처음 안정된 파싱 답 확정</text>
  <rect x="990" y="493" width="160" height="120" class="box" fill="#dcfce7" stroke="#16a34a" />
  <text x="1070" y="528" text-anchor="middle" class="h2">Preserve</text>
  <text x="1070" y="557" text-anchor="middle" class="body">중간·불확실 상태</text>
  <text x="1070" y="584" text-anchor="middle" class="small">기본 출력 o_B 유지</text>

  <text x="60" y="655" class="small">
    출력: commit o_c / preserve o_p / reason o_r 중 하나 · 세 신호는 정답 점수가 아니라 안전한 추론
    행동을 고르는 근거
  </text>
  <text x="60" y="680" class="small">
    출처: https://arxiv.org/html/2609.11315 · 원문 내용을 바탕으로 직접 재구성
  </text>
</svg>
