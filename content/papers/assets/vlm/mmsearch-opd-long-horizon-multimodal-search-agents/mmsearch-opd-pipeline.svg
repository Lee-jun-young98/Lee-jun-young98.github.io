<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">MMSearch-OPD 데이터 정제와 joint RL-OPD 학습 파이프라인</title>
  <desc id="desc">
    쉬운 이미지 질문을 entity chain으로 바꾼 뒤 Expand, Blur, Visualize와 검증으로 장기 멀티모달
    검색 문제를 만들고, 27B 교사와 9B 학생을 이용해 SFT와 보상 조건부 on-policy distillation을
    수행하는 흐름
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eef2ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.16" />
    </filter>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M0,0 L10,5 L0,10 z" fill="#475569" />
    </marker>
    <style>
      .title {
        font:
          700 28px "Noto Sans KR",
          "Malgun Gothic",
          sans-serif;
        fill: #0f172a;
      }
      .section {
        font:
          700 18px "Noto Sans KR",
          "Malgun Gothic",
          sans-serif;
        fill: #312e81;
      }
      .label {
        font:
          700 15px "Noto Sans KR",
          "Malgun Gothic",
          sans-serif;
        fill: #0f172a;
      }
      .body {
        font:
          500 13px "Noto Sans KR",
          "Malgun Gothic",
          sans-serif;
        fill: #334155;
      }
      .small {
        font:
          500 12px "Noto Sans KR",
          "Malgun Gothic",
          sans-serif;
        fill: #475569;
      }
      .box {
        stroke-width: 1.5;
        rx: 14;
        filter: url(#shadow);
      }
      .arrow {
        fill: none;
        stroke: #475569;
        stroke-width: 2.2;
        marker-end: url(#arrow);
      }
      .dash {
        fill: none;
        stroke: #7c3aed;
        stroke-width: 2;
        stroke-dasharray: 7 6;
        marker-end: url(#arrow);
      }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <text x="600" y="42" text-anchor="middle" class="title">
    MMSearch-OPD: 쉬운 질문을 장기 멀티모달 탐색 학습으로
  </text>

  <rect
    x="28"
    y="67"
    width="565"
    height="526"
    rx="22"
    fill="#ffffff"
    stroke="#c7d2fe"
    stroke-width="2"
  />
  <text x="310" y="98" text-anchor="middle" class="section">
    ① Offline Refine 데이터 파이프라인
  </text>

  <rect x="52" y="122" width="150" height="86" class="box" fill="#e0f2fe" stroke="#38bdf8" />
  <text x="127" y="148" text-anchor="middle" class="label">쉬운 seed</text>
  <text x="127" y="171" text-anchor="middle" class="body">이미지 + 질문</text>
  <text x="127" y="191" text-anchor="middle" class="small">성공 reasoning trace</text>

  <rect x="246" y="122" width="150" height="86" class="box" fill="#ede9fe" stroke="#8b5cf6" />
  <text x="321" y="148" text-anchor="middle" class="label">BuildLink</text>
  <text x="321" y="171" text-anchor="middle" class="body">entity chain 추출</text>
  <text x="321" y="191" text-anchor="middle" class="small">E₀ → … → Eₜ</text>

  <rect x="440" y="122" width="125" height="86" class="box" fill="#fef3c7" stroke="#f59e0b" />
  <text x="502" y="148" text-anchor="middle" class="label">Expand</text>
  <text x="502" y="171" text-anchor="middle" class="body">검증 hop 추가</text>
  <text x="502" y="191" text-anchor="middle" class="small">탐색 깊이 ↑</text>
  <path d="M202 165 H238" class="arrow" />
  <path d="M396 165 H432" class="arrow" />

  <rect x="52" y="248" width="150" height="90" class="box" fill="#fee2e2" stroke="#fb7185" />
  <text x="127" y="275" text-anchor="middle" class="label">Blur</text>
  <text x="127" y="298" text-anchor="middle" class="body">이름 → 간접 단서</text>
  <text x="127" y="319" text-anchor="middle" class="small">entity 식별 난도 ↑</text>

  <rect x="246" y="248" width="150" height="90" class="box" fill="#dcfce7" stroke="#22c55e" />
  <text x="321" y="275" text-anchor="middle" class="label">Visualize</text>
  <text x="321" y="298" text-anchor="middle" class="body">검색 이미지 + fact</text>
  <text x="321" y="319" text-anchor="middle" class="small">시각 증거 필수화</text>

  <rect x="440" y="248" width="125" height="90" class="box" fill="#f1f5f9" stroke="#64748b" />
  <text x="502" y="275" text-anchor="middle" class="label">질문 합성</text>
  <text x="502" y="298" text-anchor="middle" class="body">chain 보존</text>
  <text x="502" y="319" text-anchor="middle" class="small">text↔image 탐색</text>
  <path d="M502 208 V229 H127 V240" class="arrow" />
  <path d="M202 293 H238" class="arrow" />
  <path d="M396 293 H432" class="arrow" />

  <rect x="85" y="386" width="205" height="92" class="box" fill="#fff7ed" stroke="#f97316" />
  <text x="187" y="413" text-anchor="middle" class="label">품질·shortcut 검증</text>
  <text x="187" y="436" text-anchor="middle" class="body">근거·유일답·image alignment</text>
  <text x="187" y="458" text-anchor="middle" class="small">direct-answer 정답은 제거</text>

  <rect x="340" y="386" width="190" height="92" class="box" fill="#ecfeff" stroke="#06b6d4" />
  <text x="435" y="413" text-anchor="middle" class="label">Expert Pass@k</text>
  <text x="435" y="436" text-anchor="middle" class="body">tool rollout 난도 측정</text>
  <text x="435" y="458" text-anchor="middle" class="small">SFT / harder RL split</text>
  <path d="M502 338 V362 H187 V378" class="arrow" />
  <path d="M290 432 H332" class="arrow" />

  <rect x="102" y="520" width="410" height="46" rx="12" fill="#312e81" />
  <text
    x="307"
    y="549"
    text-anchor="middle"
    style="
      font:
        700 14px &quot;Noto Sans KR&quot;,
        &quot;Malgun Gothic&quot;,
        sans-serif;
      fill: #fff;
    "
  >
    검증된 long-horizon text + image search trajectory
  </text>
  <path d="M435 478 V512" class="arrow" />

  <rect
    x="616"
    y="67"
    width="556"
    height="526"
    rx="22"
    fill="#ffffff"
    stroke="#bfdbfe"
    stroke-width="2"
  />
  <text x="894" y="98" text-anchor="middle" class="section">② SFT 이후 Joint RL–OPD</text>

  <rect x="648" y="122" width="190" height="82" class="box" fill="#ede9fe" stroke="#8b5cf6" />
  <text x="743" y="148" text-anchor="middle" class="label">Qwen3.5-27B Teacher</text>
  <text x="743" y="171" text-anchor="middle" class="body">전체 성공 trajectory SFT</text>
  <text x="743" y="190" text-anchor="middle" class="small">학습 중 frozen</text>

  <rect x="950" y="122" width="190" height="82" class="box" fill="#dbeafe" stroke="#3b82f6" />
  <text x="1045" y="148" text-anchor="middle" class="label">Qwen3.5-9B Student</text>
  <text x="1045" y="171" text-anchor="middle" class="body">쉬운 subset SFT 초기화</text>
  <text x="1045" y="190" text-anchor="middle" class="small">harder question rollout</text>

  <rect x="935" y="252" width="220" height="94" class="box" fill="#ecfccb" stroke="#84cc16" />
  <text x="1045" y="279" text-anchor="middle" class="label">On-policy trajectory</text>
  <text x="1045" y="302" text-anchor="middle" class="body">추론 ↔ TextSearch ↔ ImageSearch</text>
  <text x="1045" y="325" text-anchor="middle" class="small">최대 50 interaction turns</text>
  <path d="M1045 204 V244" class="arrow" />

  <rect x="648" y="390" width="205" height="102" class="box" fill="#fef2f2" stroke="#ef4444" />
  <text x="750" y="417" text-anchor="middle" class="label">Trajectory-level RL</text>
  <text x="750" y="442" text-anchor="middle" class="body">정답 reward + 행동 penalty</text>
  <text x="750" y="466" text-anchor="middle" class="small">group-relative advantage</text>

  <rect x="920" y="390" width="220" height="102" class="box" fill="#faf5ff" stroke="#a855f7" />
  <text x="1030" y="417" text-anchor="middle" class="label">실패 rollout Token OPD</text>
  <text x="1030" y="442" text-anchor="middle" class="body">teacher/student log-prob gap</text>
  <text x="1030" y="466" text-anchor="middle" class="small">reward gap 가중 · λ 빠른 감쇠</text>
  <path d="M1005 346 L805 382" class="arrow" />
  <path d="M1080 346 L1040 382" class="arrow" />
  <path d="M743 204 V360 H970 V382" class="dash" />

  <rect x="680" y="528" width="460" height="42" rx="12" fill="#0f766e" />
  <text
    x="910"
    y="554"
    text-anchor="middle"
    style="
      font:
        700 14px &quot;Noto Sans KR&quot;,
        &quot;Malgun Gothic&quot;,
        sans-serif;
      fill: #fff;
    "
  >
    추론: teacher 없는 9B 검색 에이전트
  </text>
  <path d="M750 492 V510 H900 V520" class="arrow" />
  <path d="M1030 492 V510 H920 V520" class="arrow" />

  <text x="600" y="616" text-anchor="middle" class="small">
    논문 Figure 2 및 Sections 3.2–3.4를 바탕으로 재구성 · 원문: arXiv:2610.22240 (CC BY 4.0)
  </text>
</svg>
