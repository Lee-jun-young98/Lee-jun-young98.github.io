<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Exemplar2VQA dual-track multi-agent data generation pipeline</title>
  <desc id="desc">
    A spatial question-answer exemplar is expanded through separate camera and QA code-generation
    tracks. Architect, Coder, Reviewer, and Refiner agents use simulator feedback and deterministic
    geometry APIs to create verified visual question-answer training data.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity="0.3" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)" />
  <text
    x="60"
    y="58"
    fill="#f8fafc"
    font-family="Arial, 'Noto Sans KR', sans-serif"
    font-size="30"
    font-weight="700"
  >
    Exemplar2VQA — 의미는 에이전트가, 공간 계산은 코드가
  </text>
  <text x="60" y="88" fill="#94a3b8" font-family="Arial, 'Noto Sans KR', sans-serif" font-size="16">
    논문 Figure 1·2와 Section 3을 바탕으로 재구성
  </text>

  <g filter="url(#shadow)">
    <rect
      x="55"
      y="180"
      width="190"
      height="220"
      rx="22"
      fill="#312e81"
      stroke="#818cf8"
      stroke-width="2"
    />
    <text
      x="150"
      y="220"
      text-anchor="middle"
      fill="#c7d2fe"
      font-family="Arial, 'Noto Sans KR', sans-serif"
      font-size="17"
      font-weight="700"
    >
      공간 QA exemplar
    </text>
    <text
      x="150"
      y="258"
      text-anchor="middle"
      fill="#f8fafc"
      font-family="Arial, 'Noto Sans KR', sans-serif"
      font-size="15"
    >
      “소파 기준으로
    </text>
    <text
      x="150"
      y="282"
      text-anchor="middle"
      fill="#f8fafc"
      font-family="Arial, 'Noto Sans KR', sans-serif"
      font-size="15"
    >
      의자는 어느 방향?”
    </text>
    <rect x="82" y="314" width="136" height="48" rx="12" fill="#4338ca" />
    <text
      x="150"
      y="344"
      text-anchor="middle"
      fill="#e0e7ff"
      font-family="Arial, 'Noto Sans KR', sans-serif"
      font-size="14"
    >
      질문 형식 + 의도
    </text>
  </g>

  <path d="M245 290 H302" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect
      x="315"
      y="125"
      width="525"
      height="180"
      rx="22"
