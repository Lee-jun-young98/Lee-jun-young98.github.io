      <text x="395" y="218" fill="#ecfeff">Architect</text>
      <rect x="465" y="186" width="100" height="52" rx="12" fill="#155e75" />
      <text x="515" y="218" fill="#ecfeff">Coder</text>
      <rect x="585" y="186" width="100" height="52" rx="12" fill="#155e75" />
      <text x="635" y="218" fill="#ecfeff">Reviewer</text>
      <rect x="705" y="186" width="100" height="52" rx="12" fill="#155e75" />
      <text x="755" y="218" fill="#ecfeff">Refiner</text>
    </g>
    <path
      d="M445 212 H465 M565 212 H585 M685 212 H705"
