      AI2-THOR 실행 피드백 → 유효한 camera pose와 multi-view 관측
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect
      x="315"
      y="330"
      width="525"
      height="180"
      rx="22"
      fill="#3f2b0a"
      stroke="#fbbf24"
      stroke-width="2"
    />
    <text
      x="345"
      y="364"
      fill="#fde68a"
      font-family="Arial, 'Noto Sans KR', sans-serif"
      font-size="18"
      font-weight="700"
    >
      Track 2 · QA Generation
    </text>
    <g font-family="Arial, 'Noto Sans KR', sans-serif" font-size="14" text-anchor="middle">
      <rect x="345" y="391" width="100" height="52" rx="12" fill="#92400e" />
      <text x="395" y="423" fill="#fffbeb">Architect</text>
      <rect x="465" y="391" width="100" height="52" rx="12" fill="#92400e" />
      <text x="515" y="423" fill="#fffbeb">Coder</text>
      <rect x="585" y="391" width="100" height="52" rx="12" fill="#92400e" />
      <text x="635" y="423" fill="#fffbeb">Reviewer</text>
      <rect x="705" y="391" width="100" height="52" rx="12" fill="#92400e" />
      <text x="755" y="423" fill="#fffbeb">Refiner</text>
    </g>
    <path
      d="M445 417 H465 M565 417 H585 M685 417 H705"
      stroke="#fcd34d"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <text
      x="575"
      y="475"
      text-anchor="middle"
      fill="#fef3c7"
      font-family="Arial, 'Noto Sans KR', sans-serif"
      font-size="14"
    >
      3D metadata + 기하 API → 실행 가능한 QA 생성 코드
    </text>
  </g>

  <path d="M840 215 H895" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M840 420 H895" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect
      x="910"
      y="180"
      width="235"
      height="250"
      rx="22"
      fill="#064e3b"
      stroke="#34d399"
      stroke-width="2"
    />
    <text
      x="1027"
      y="220"
      text-anchor="middle"
      fill="#a7f3d0"
      font-family="Arial, 'Noto Sans KR', sans-serif"
      font-size="18"
      font-weight="700"
    >
      검증된 VQA 데이터
    </text>
    <text
      x="1027"
      y="264"
      text-anchor="middle"
      fill="#ecfdf5"
      font-family="Arial, 'Noto Sans KR', sans-serif"
      font-size="15"
    >
      관측 이미지 / 영상
    </text>
    <text
      x="1027"
      y="296"
      text-anchor="middle"
      fill="#ecfdf5"
      font-family="Arial, 'Noto Sans KR', sans-serif"
      font-size="15"
    >
      인스턴스화된 질문
    </text>
    <text
      x="1027"
      y="328"
      text-anchor="middle"
      fill="#ecfdf5"
      font-family="Arial, 'Noto Sans KR', sans-serif"
      font-size="15"
    >
      결정론적 정답
    </text>
    <rect x="948" y="354" width="159" height="44" rx="12" fill="#047857" />
    <text
      x="1027"
      y="382"
      text-anchor="middle"
      fill="#d1fae5"
      font-family="Arial, 'Noto Sans KR', sans-serif"
      font-size="14"
    >
      대규모 반복 생성
    </text>
  </g>

  <rect x="315" y="540" width="830" height="52" rx="16" fill="#172554" stroke="#3b82f6" />
  <text
    x="730"
    y="572"
    text-anchor="middle"
    fill="#dbeafe"
    font-family="Arial, 'Noto Sans KR', sans-serif"
    font-size="15"
  >
    핵심 경계: LLM은 schema와 호출 순서를 작성하고, 거리·방향·가림의 정답은 Python 실행기가
    계산한다.
  </text>
</svg>
