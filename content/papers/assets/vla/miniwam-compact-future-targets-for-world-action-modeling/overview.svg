<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">MiniWAM의 PRISM 2단계 학습 구조</title>
  <desc id="desc">Stage 1은 현재와 미래 feature를 compact PRISM target으로 압축하고 Stage 2는 현재 관측에서 world target과 action을 공동 예측한다.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <text x="55" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">MiniWAM — 미래 전체 대신 compact transition target</text>
  <rect x="45" y="100" width="1110" height="225" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="137" font-family="sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Stage 1 · PRISM target 학습 (privileged future 사용)</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="80" y="170" width="200" height="95" rx="16" fill="#fff"/><text x="180" y="207" font-size="18" font-weight="700">Frozen encoder</text><text x="180" y="237" font-size="15">x(t), X(t+)</text><rect x="350" y="170" width="210" height="95" rx="16" fill="#dcfce7"/><text x="455" y="207" font-size="18" font-weight="700">PRISM encoder</text><text x="455" y="237" font-size="15">compact L(t)</text><rect x="650" y="158" width="215" height="55" rx="13" fill="#fef3c7"/><text x="757" y="191" font-size="16">inverse action loss</text><rect x="650" y="225" width="215" height="55" rx="13" fill="#fef3c7"/><text x="757" y="258" font-size="16">feature reconstruction</text><rect x="945" y="170" width="170" height="95" rx="16" fill="#ede9fe"/><text x="1030" y="207" font-size="18" font-weight="700">Freeze</text><text x="1030" y="237" font-size="15">target L*</text></g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#a)"><line x1="280" y1="218" x2="340" y2="218"/><line x1="560" y1="205" x2="640" y2="185"/><line x1="560" y1="230" x2="640" y2="250"/><line x1="865" y1="218" x2="935" y2="218"/></g>
  <rect x="45" y="365" width="1110" height="250" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="70" y="403" font-family="sans-serif" font-size="22" font-weight="700" fill="#15803d">Stage 2 · MiniWAM 공동 학습 / 추론</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="80" y="445" width="205" height="100" rx="16" fill="#fff"/><text x="182" y="479" font-size="18" font-weight="700">현재 관측</text><text x="182" y="507" font-size="15">language + proprioception</text><rect x="370" y="430" width="320" height="135" rx="18" fill="#dcfce7" stroke="#16a34a"/><text x="530" y="468" font-size="19" font-weight="700">Mixture-of-Transformers</text><text x="530" y="499" font-size="16">world ↔ action attention</text><text x="530" y="530" font-size="15">joint flow matching</text><rect x="790" y="425" width="300" height="60" rx="14" fill="#ede9fe"/><text x="940" y="462" font-size="17">compact world token L*</text><rect x="790" y="510" width="300" height="60" rx="14" fill="#fee2e2"/><text x="940" y="547" font-size="17">action chunk → robot</text></g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#a)"><line x1="285" y1="495" x2="360" y2="495"/><line x1="690" y1="470" x2="780" y2="455"/><line x1="690" y1="525" x2="780" y2="540"/></g>
  <text x="600" y="650" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">배포 시 미래 관측·PRISM encoder·reconstruction decoder 불필요</text>
</svg>
