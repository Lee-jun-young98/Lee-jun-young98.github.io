<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Noise Space Learning architecture</title><desc id="desc">A learned noise actor selects context-conditioned noise for a frozen VLA generator; rewards update only the actor.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker></defs><rect width="1200" height="420" rx="24" fill="#f8fafc"/><text x="600" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">Noise Space Learning — frozen VLA의 noise만 학습</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="40" y="120" width="190" height="130" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="135" y="157" font-size="18" font-weight="700">Context s</text><text x="135" y="190" font-size="14">RGB · proprioception</text><text x="135" y="216" font-size="14">언어 지시</text><rect x="300" y="75" width="210" height="120" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="405" y="112" font-size="18" font-weight="700">Noise actor</text><text x="405" y="141" font-size="15">πθ(z | s)</text><text x="405" y="170" font-size="13" fill="#7e22ce">학습됨: PPO / SAC / AWR</text><rect x="585" y="105" width="235" height="160" rx="16" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><text x="703" y="145" font-size="18" font-weight="700">Frozen VLA generator</text><text x="703" y="178" font-size="15">a = Gφ(s, z)</text><text x="703" y="210" font-size="14">flow-matching denoising</text><text x="703" y="239" font-size="13" fill="#475569">VLA weight update 없음</text><rect x="900" y="120" width="150" height="130" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="975" y="162" font-size="18" font-weight="700">Action chunk</text><text x="975" y="197" font-size="14">robot 실행</text><text x="975" y="224" font-size="14">환경 전이</text><rect x="920" y="310" width="115" height="60" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="978" y="347" font-size="17" font-weight="700">Reward R</text></g>
