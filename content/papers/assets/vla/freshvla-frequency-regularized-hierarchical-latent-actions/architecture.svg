<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">FreshVLA architecture</title>
  <desc id="desc">Action-free video에서 dynamics-sensitive transition과 hierarchical latent action을 학습하고 robot action과 joint flow matching하는 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
    <style>.h{font:700 24px sans-serif;fill:#0f172a}.t{font:700 18px sans-serif;fill:#0f172a}.s{font:15px sans-serif;fill:#334155}.b{rx:16;stroke-width:2}.a{stroke:#334155;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}</style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/><text x="40" y="44" class="h">FreshVLA — 논문 내용을 바탕으로 재구성</text>
  <rect x="30" y="70" width="1140" height="245" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="50" y="104" class="t">Stage I · action-free video pretraining</text>
  <rect class="b" x="55" y="135" width="170" height="110" fill="#dbeafe" stroke="#3b82f6"/><text x="140" y="174" text-anchor="middle" class="t">Video window</text><text x="140" y="202" text-anchor="middle" class="s">fixed third-person</text><text x="140" y="225" text-anchor="middle" class="s">36 frames</text>
  <rect class="b" x="285" y="125" width="210" height="130" fill="#e0f2fe" stroke="#0284c7"/><text x="390" y="162" text-anchor="middle" class="t">DINOv3 + Adapter</text><text x="390" y="192" text-anchor="middle" class="s">FFT high-pass prior</text><text x="390" y="217" text-anchor="middle" class="s">PAWKL: 동적 영역 강조</text>
  <rect class="b" x="560" y="112" width="250" height="156" fill="#ede9fe" stroke="#7c3aed"/><text x="685" y="150" text-anchor="middle" class="t">Hierarchical encoder</text><text x="685" y="181" text-anchor="middle" class="s">substage: 느린 task progress</text><text x="685" y="207" text-anchor="middle" class="s">execution: 빠른 local dynamics</text><text x="685" y="237" text-anchor="middle" class="s">DCT frequency regularization</text>
  <rect class="b" x="885" y="135" width="230" height="110" fill="#dcfce7" stroke="#16a34a"/><text x="1000" y="174" text-anchor="middle" class="t">Frozen target G</text><text x="1000" y="204" text-anchor="middle" class="s">hierarchical continuous</text><text x="1000" y="228" text-anchor="middle" class="s">latent action z⁺</text>
  <path class="a" d="M225 190 H285"/><path class="a" d="M495 190 H560"/><path class="a" d="M810 190 H885"/>
  <rect x="30" y="345" width="1140" height="285" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="50" y="381" class="t">Stage II · downstream policy / joint flow matching</text>
  <rect class="b" x="55" y="420" width="220" height="135" fill="#ffedd5" stroke="#f97316"/><text x="165" y="456" text-anchor="middle" class="t">현재 조건 cₜ</text><text x="165" y="486" text-anchor="middle" class="s">observation + language</text><text x="165" y="511" text-anchor="middle" class="s">robot state</text><text x="165" y="536" text-anchor="middle" class="s">+ Gaussian noise</text>
  <rect class="b" x="355" y="405" width="300" height="165" fill="#fef3c7" stroke="#d97706"/><text x="505" y="444" text-anchor="middle" class="t">Shared DiT action expert</text><text x="505" y="476" text-anchor="middle" class="s">latent velocity vᶻ + action velocity vᵃ</text><text x="505" y="506" text-anchor="middle" class="s">L = MSE(vᶻ) + MSE(vᵃ)</text><text x="505" y="537" text-anchor="middle" class="s">두 stream 공동 denoising</text>
  <rect class="b" x="740" y="405" width="180" height="165" fill="#ede9fe" stroke="#7c3aed"/><text x="830" y="448" text-anchor="middle" class="t">latent stream</text><text x="830" y="480" text-anchor="middle" class="s">internal prior</text><text x="830" y="512" text-anchor="middle" class="s">추론 시 실행 안 함</text>
  <rect class="b" x="970" y="405" width="170" height="165" fill="#dcfce7" stroke="#16a34a"/><text x="1055" y="448" text-anchor="middle" class="t">robot action</text><text x="1055" y="480" text-anchor="middle" class="s">7-D chunk</text><text x="1055" y="512" text-anchor="middle" class="s">로봇에 실행</text>
  <path class="a" d="M275 488 H355"/><path class="a" d="M655 470 H740"/><path class="a" d="M655 520 H970"/><path class="a dash" d="M1000 245 V300 H505 V405"/><text x="760" y="294" class="s">학습 시 latent target 제공 · 추론 시 제거</text>
  <text x="50" y="660" class="s">Source: FreshVLA Figure 2, §3.2–3.3, Eq. (10)–(12) · reconstructed, not an original paper figure</text>
</svg>
