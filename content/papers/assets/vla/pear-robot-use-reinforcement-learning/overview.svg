<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">PEAR robot-use reinforcement learning architecture</title>
  <desc id="desc">A reasoning model receives instruction, interaction history, camera frames and arm state, emits reasoning and an end-effector pose, and closes the loop through inverse kinematics and a controller. Simulation success trains all generated tokens with group-relative reinforcement learning; deployment uses the same interface on a real robot without further training.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="60" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">PEAR: reasoning model을 robot-use policy로 학습</text>
  <text x="60" y="88" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Figure 1–2와 §3을 바탕으로 재구성 · 학습과 배포가 동일한 pose-level loop를 공유</text>

  <rect x="45" y="120" width="1110" height="305" rx="22" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="70" y="153" fill="#93c5fd" font-family="Arial, sans-serif" font-size="18" font-weight="700">한 번의 robot-use round</text>

  <g filter="url(#shadow)">
    <rect x="75" y="185" width="220" height="175" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="185" y="220" text-anchor="middle" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="18" font-weight="700">입력 문맥 hₜ</text>
    <text x="98" y="255" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">• task instruction</text>
    <text x="98" y="284" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">• 이전 round 전체</text>
    <text x="98" y="313" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">• camera frames</text>
    <text x="98" y="342" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">• arm state (JSON)</text>

    <rect x="365" y="185" width="250" height="175" rx="18" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
    <text x="490" y="220" text-anchor="middle" fill="#ede9fe" font-family="Arial, sans-serif" font-size="18" font-weight="700">27B reasoning model</text>
    <text x="490" y="255" text-anchor="middle" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="15">chain-of-thought</text>
    <path d="M420 276 C455 248 525 248 560 276 C525 304 455 304 420 276 Z" fill="#4c1d95" stroke="#c4b5fd"/>
    <text x="490" y="320" text-anchor="middle" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="15">+ pose delta JSON</text>
    <text x="490" y="343" text-anchor="middle" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="13">cm / rad · action chunk 없음</text>

    <rect x="685" y="185" width="205" height="175" rx="18" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
    <text x="787" y="220" text-anchor="middle" fill="#cffafe" font-family="Arial, sans-serif" font-size="18" font-weight="700">robot-side 실행</text>
    <text x="787" y="261" text-anchor="middle" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="15">inverse kinematics</text>
    <text x="787" y="292" text-anchor="middle" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="15">+ controller</text>
    <text x="787" y="329" text-anchor="middle" fill="#67e8f9" font-family="Arial, sans-serif" font-size="14">pose → joint target</text>

    <rect x="955" y="185" width="165" height="175" rx="18" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="1037" y="220" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="18" font-weight="700">환경 / 로봇</text>
    <circle cx="1037" cy="276" r="35" fill="#166534" stroke="#86efac" stroke-width="2"/>
    <path d="M1018 290 L1030 267 L1042 279 L1057 250" fill="none" stroke="#bbf7d0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1037" y="337" text-anchor="middle" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="14">새 observation</text>
  </g>

  <path d="M295 272 L355 272" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M615 272 L675 272" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M890 272 L945 272" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1037 370 C1037 405 205 405 205 370" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="620" y="401" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="14">관측을 context에 누적해 다음 round 반복</text>

  <rect x="45" y="455" width="535" height="180" rx="22" fill="#422006" stroke="#f59e0b" stroke-width="2"/>
  <text x="70" y="490" fill="#fde68a" font-family="Arial, sans-serif" font-size="18" font-weight="700">학습: simulation 전용 PEAR / RURL</text>
  <text x="70" y="525" fill="#fef3c7" font-family="Arial, sans-serif" font-size="15">같은 task·초기 상태의 G개 episode</text>
  <text x="70" y="554" fill="#fef3c7" font-family="Arial, sans-serif" font-size="15">binary success → group-normalized Âᵢ</text>
  <text x="70" y="583" fill="#fef3c7" font-family="Arial, sans-serif" font-size="15">reasoning + action의 모든 token 업데이트</text>
  <text x="70" y="612" fill="#fbbf24" font-family="Arial, sans-serif" font-size="14">curriculum: LIBERO → LIBERO-Long → RoboDojo 2 tasks</text>
  <path d="M280 455 C300 415 385 390 455 360" fill="none" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrowGold)"/>

  <rect x="620" y="455" width="535" height="180" rx="22" fill="#052e2b" stroke="#2dd4bf" stroke-width="2"/>
  <text x="645" y="490" fill="#99f6e4" font-family="Arial, sans-serif" font-size="18" font-weight="700">배포: real robot zero-shot</text>
  <text x="645" y="525" fill="#ccfbf1" font-family="Arial, sans-serif" font-size="15">PEAR, reward, weight update 제거</text>
  <text x="645" y="554" fill="#ccfbf1" font-family="Arial, sans-serif" font-size="15">prompt에 새 robot frame·camera·arm part 기술</text>
  <text x="645" y="583" fill="#ccfbf1" font-family="Arial, sans-serif" font-size="15">동일 pose protocol + 새 robot의 IK/controller</text>
  <text x="645" y="612" fill="#5eead4" font-family="Arial, sans-serif" font-size="14">YAM 18/30 성공 · real-robot data 0</text>
</svg>
