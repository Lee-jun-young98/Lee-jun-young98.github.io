<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">UMI-WM 양손 손목 시점 세계모델</title><desc id="desc">왼팔과 오른팔 action을 각 wrist stream에 주입하고 sparse hub와 geometry conditioning으로 양손 영상을 생성한 뒤 IDM으로 action을 복원하는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker><style>.t{font:700 24px Arial,sans-serif;fill:#17324d}.s{font:16px Arial,sans-serif;fill:#29455f}.b{fill:#f5f9fc;stroke:#315b7d;stroke-width:2}.g{fill:#eef8f3;stroke:#2c7a5b;stroke-width:2}.o{fill:#fff5e8;stroke:#b76b18;stroke-width:2}.p{fill:#f6f0ff;stroke:#7651a8;stroke-width:2}.ln{fill:none;stroke:#315b7d;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="680" fill="#fff"/><text x="55" y="58" class="t">UMI-WM: paired-wrist interactive world modeling</text>
  <rect x="50" y="120" width="225" height="150" rx="16" class="b"/><text x="84" y="165" class="t">양손 입력</text><text x="78" y="202" class="s">wrist history L / R</text><text x="78" y="232" class="s">pose₍rel₎ + gripper</text>
  <rect x="340" y="90" width="250" height="150" rx="16" class="g"/><text x="385" y="135" class="t">Left stream</text><text x="375" y="172" class="s">left action injection</text><text x="375" y="202" class="s">video DiT tokens</text>
  <rect x="340" y="300" width="250" height="150" rx="16" class="g"/><text x="380" y="345" class="t">Right stream</text><text x="375" y="382" class="s">right action injection</text><text x="375" y="412" class="s">video DiT tokens</text>
  <rect x="670" y="175" width="220" height="190" rx="16" class="p"/><text x="718" y="220" class="t">공유 모듈</text><text x="704" y="257" class="s">Sparse Hub Attention</text><text x="704" y="287" class="s">SRAE · CamRay</text><text x="704" y="317" class="s">PRoPE · CameraNoise</text><text x="704" y="347" class="s">block-causal history</text>
  <rect x="965" y="110" width="190" height="145" rx="16" class="o"/><text x="1000" y="155" class="t">미래 영상</text><text x="1003" y="192" class="s">paired wrist L/R</text><text x="1003" y="222" class="s">4-step Student</text>
  <rect x="930" y="350" width="225" height="150" rx="16" class="b"/><text x="972" y="395" class="t">Frozen IDM</text><text x="956" y="432" class="s">action recovery → BAF</text><text x="956" y="462" class="s">IK → physical robot</text>
  <path d="M275 170 H340" class="ln"/><path d="M275 225 C305 260 305 375 340 375" class="ln"/><path d="M590 165 H670" class="ln"/><path d="M590 375 C625 375 625 330 670 330" class="ln"/><path d="M890 230 H965" class="ln"/><path d="M1060 255 V350" class="ln"/><path d="M670 270 C625 270 625 220 590 220" class="ln"/><path d="M670 300 C625 300 625 350 590 350" class="ln"/>
  <text x="55" y="620" class="s">논문 Figure 4를 바탕으로 재구성 · view별 control은 분리하고 hub에서 shared-scene context를 교환</text>
</svg>
