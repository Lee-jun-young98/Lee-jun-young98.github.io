<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">FocusVLA future-intent view routing 구조</title><desc id="desc">글로벌 및 손목 카메라, 언어, 상태, 행동 이력에서 미래 intent를 예측하고 step-wise routing weight와 chunk intent token으로 action backbone을 조절하는 구조</desc>
  <defs><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="1200" height="680" rx="28" fill="#f8fafc"/><text x="55" y="60" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">FocusVLA — 미래 intent로 시야를 단계별 routing</text><text x="55" y="96" font-family="sans-serif" font-size="17" fill="#475569">논문 Figure 1·3 · Sections 3.2–3.3 기반 재구성</text>
  <g font-family="sans-serif"><rect x="55" y="140" width="250" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="180" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">Global view</text><text x="180" y="215" text-anchor="middle" font-size="16" fill="#1e40af">탐색 · 운반 · 전역 계획</text><rect x="55" y="290" width="250" height="105" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="180" y="332" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">Local / wrist view</text><text x="180" y="365" text-anchor="middle" font-size="16" fill="#166534">정렬 · grasp · contact</text><rect x="55" y="440" width="250" height="105" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="180" y="482" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95">추가 context</text><text x="180" y="515" text-anchor="middle" font-size="16" fill="#5b21b6">언어 · state · recent actions</text>
  <rect x="420" y="220" width="310" height="220" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="575" y="270" text-anchor="middle" font-size="23" font-weight="700" fill="#9a3412">Future Intent Bridge</text><text x="575" y="310" text-anchor="middle" font-size="17" fill="#9a3412">temporal summary + cross-attention</text><text x="575" y="352" text-anchor="middle" font-size="19" fill="#9a3412">Iₜ = [iₜ¹ … iₜᴴ]</text><text x="575" y="395" text-anchor="middle" font-size="16" fill="#9a3412">trajectory weak labels로 BCE 감독</text>
  <rect x="830" y="135" width="300" height="130" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="980" y="177" text-anchor="middle" font-size="20" font-weight="700" fill="#164e63">Step-wise routing</text><text x="980" y="212" text-anchor="middle" font-size="17" fill="#155e75">αᵏ = [α_global, α_local]</text><text x="980" y="240" text-anchor="middle" font-size="15" fill="#155e75">action step마다 view 배분</text><rect x="830" y="315" width="300" height="105" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="980" y="357" text-anchor="middle" font-size="20" font-weight="700" fill="#78350f">Chunk intent token</text><text x="980" y="390" text-anchor="middle" font-size="16" fill="#92400e">horizon 전체 진행 요약</text><rect x="810" y="490" width="340" height="105" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="980" y="532" text-anchor="middle" font-size="21" font-weight="700" fill="#7f1d1d">기존 Action Backbone</text><text x="980" y="567" text-anchor="middle" font-size="17" fill="#991b1b">동적 visual context → action chunk</text></g>
  <g stroke="#334155" stroke-width="3" marker-end="url(#c)"><line x1="305" y1="192" x2="415" y2="275"/><line x1="305" y1="342" x2="415" y2="330"/><line x1="305" y1="492" x2="415" y2="390"/><line x1="730" y1="285" x2="825" y2="205"/><line x1="730" y1="365" x2="825" y2="365"/><line x1="980" y1="265" x2="980" y2="485"/><line x1="980" y1="420" x2="980" y2="485"/></g><text x="55" y="640" font-family="sans-serif" font-size="16" fill="#475569">planning: global 비중 ↑ · grasp/contact: local 비중 ↑ · stacking: 두 시야 균형</text>
</svg>
