<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">SkeleWAM 학습과 추론 구조</title><desc id="desc">RGB-D와 로봇 상태를 희소 3D skeleton으로 바꾸고 행동과 미래 skeleton을 공동 학습한 뒤 추론에서는 MAC으로 행동 후보를 선택한다.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/><text x="60" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">SkeleWAM — 희소 기하로 세계와 행동을 함께 학습</text>
  <rect x="55" y="115" width="230" height="150" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="170" y="155" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">입력</text><text x="170" y="190" text-anchor="middle" font-family="sans-serif" font-size="18">RGB-D · 로봇 상태</text><text x="170" y="220" text-anchor="middle" font-family="sans-serif" font-size="18">언어 지시</text>
  <rect x="360" y="105" width="270" height="170" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="495" y="145" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700">Frozen perception + FK</text><text x="495" y="182" text-anchor="middle" font-family="sans-serif" font-size="17">관절 · 물체 중심 · 상호작용점</text><text x="495" y="220" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">현재 3D skeleton</text>
  <rect x="710" y="105" width="420" height="170" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="920" y="145" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">Mixture-of-Transformers</text><text x="920" y="180" text-anchor="middle" font-family="sans-serif" font-size="17">공유 current-skeleton context</text><text x="820" y="225" text-anchor="middle" font-family="sans-serif" font-size="17">Action expert</text><text x="1025" y="225" text-anchor="middle" font-family="sans-serif" font-size="17">World expert</text>
  <path d="M285 190H355M630 190H705" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><text x="60" y="335" font-family="sans-serif" font-size="22" font-weight="700" fill="#475569">학습</text>
  <rect x="170" y="310" width="360" height="120" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="350" y="352" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Action flow matching</text><text x="350" y="388" text-anchor="middle" font-family="sans-serif" font-size="17">행동 chunk vector field</text>
  <rect x="670" y="310" width="360" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="850" y="352" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Future-skeleton flow matching</text><text x="850" y="388" text-anchor="middle" font-family="sans-serif" font-size="17">미래 기하 동역학 — 학습 전용</text>
  <path d="M820 275L410 305M1025 275L900 305" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><path d="M55 480H1145" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 8"/><text x="60" y="530" font-family="sans-serif" font-size="22" font-weight="700" fill="#475569">추론</text>
  <rect x="180" y="510" width="300" height="105" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="330" y="551" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">여러 action sample</text><text x="330" y="584" text-anchor="middle" font-family="sans-serif" font-size="16">독립 Gaussian noise</text>
  <rect x="560" y="510" width="260" height="105" rx="18" fill="#fae8ff" stroke="#a21caf" stroke-width="3"/><text x="690" y="551" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">MAC medoid 선택</text><text x="690" y="584" text-anchor="middle" font-family="sans-serif" font-size="16">평균 거리 최소 궤적</text>
  <rect x="900" y="510" width="240" height="105" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1020" y="551" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">16 step 실행</text><text x="1020" y="584" text-anchor="middle" font-family="sans-serif" font-size="16">재관찰 후 반복</text><path d="M480 562H555M820 562H895" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <text x="930" y="655" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">논문 Figure 2 및 Sections 3.2–3.5 기반 재구성</text>
</svg>
