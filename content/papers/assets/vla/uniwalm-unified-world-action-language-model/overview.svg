<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">UniWALM unified video action language architecture</title>
  <desc id="desc">Inputs enter three diffusion transformer streams with unified self attention. Action and language are emitted, and language memory is reused on the next control step.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">UniWALM: one shared representation for world, action, and language</text>
  <rect x="55" y="118" width="230" height="360" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="170" y="157" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">Inputs at step t</text>
  <text x="82" y="207" font-family="Arial" font-size="19">Multi-view RGB</text><text x="82" y="250" font-family="Arial" font-size="19">Robot state</text>
  <text x="82" y="293" font-family="Arial" font-size="19">Task instruction</text><text x="82" y="336" font-family="Arial" font-size="19">Anchor frame (optional)</text>
  <text x="82" y="379" font-family="Arial" font-size="19">Previous text memory</text><text x="82" y="438" font-family="Arial" font-size="16" fill="#0369a1">same input context for all streams</text>
  <path d="M285 298 H365" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect x="375" y="92" width="475" height="430" rx="22" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
  <text x="612" y="132" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700">Mixture of Transformers (30-layer aligned)</text>
  <rect x="410" y="165" width="405" height="78" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="612" y="213" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">Video DiT · pretrained</text>
  <rect x="410" y="275" width="405" height="78" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="612" y="323" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">Action DiT · flow matching + FMC</text>
  <rect x="410" y="385" width="405" height="78" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="612" y="433" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">Language DiT · discrete diffusion</text>
  <path d="M470 250 V270 M612 250 V270 M755 250 V270 M470 360 V380 M612 360 V380 M755 360 V380" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>
  <text x="612" y="492" text-anchor="middle" font-family="Arial" font-size="18" fill="#6d28d9">Unified self-attention shares features across modalities</text>
  <path d="M850 230 H925" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><path d="M850 382 H925" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect x="935" y="150" width="210" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1040" y="197" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Action chunk</text><text x="1040" y="232" text-anchor="middle" font-family="Arial" font-size="18">+ completion gate β</text>
  <rect x="935" y="330" width="210" height="130" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1040" y="374" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Subtask || memory</text><text x="1040" y="410" text-anchor="middle" font-family="Arial" font-size="17">re-consumed at t+1</text>
  <path d="M1040 460 V575 H170 V486" fill="none" stroke="#d97706" stroke-width="5" stroke-dasharray="11 8" marker-end="url(#a)"/>
  <text x="610" y="614" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#92400e">Language-as-memory recurrent loop</text>
  <text x="610" y="650" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Training: co-denoise video + action + language · Inference: video generation disabled</text>
</svg>
