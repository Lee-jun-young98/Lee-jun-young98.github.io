<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">PREM 예측-검증-메모리 갱신 아키텍처</title><desc id="desc">현재 관측과 이전 예측의 차이가 recurrent visual memory의 공간별 갱신량을 정하고, 갱신된 메모리가 action 생성과 다음 관측 예측에 다시 쓰이는 순환 구조</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><style>.t{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.h{font-size:24px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.box{rx:18;stroke-width:2}.a{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="680" fill="#f8fafc"/><text x="60" y="52" class="t h">PREM: 예측 → 검증 → 선택적 메모리 갱신</text><text x="60" y="82" class="t s">논문 Figure 2와 Eq. (3)–(9)를 바탕으로 재구성</text>
  <rect x="55" y="125" width="210" height="105" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="160" y="166" text-anchor="middle" class="t b">현재 관측 Oₜ</text><text x="160" y="197" text-anchor="middle" class="t s">이미지 · 언어 · 상태</text>
  <rect x="330" y="125" width="220" height="105" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="440" y="166" text-anchor="middle" class="t b">Visual encoder</text><text x="440" y="197" text-anchor="middle" class="t s">spatial feature Xₜ</text>
  <rect x="625" y="105" width="255" height="145" class="box" fill="#fef3c7" stroke="#d97706"/><text x="752" y="143" text-anchor="middle" class="t b">예측 검증</text><text x="752" y="174" text-anchor="middle" class="t s">cached X̂ₜ ↔ Xₜ</text><text x="752" y="202" text-anchor="middle" class="t s">patch discrepancy → βₜ</text><text x="752" y="228" text-anchor="middle" class="t s">median/MAD 공간 정규화</text>
  <rect x="940" y="125" width="205" height="105" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="1042" y="166" text-anchor="middle" class="t b">RVM 갱신</text><text x="1042" y="197" text-anchor="middle" class="t s">Mₜ₋₁ → Mₜ</text><path d="M265 177 H330" class="a"/><path d="M550 177 H625" class="a"/><path d="M880 177 H940" class="a"/>
  <rect x="890" y="335" width="255" height="125" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="1017" y="375" text-anchor="middle" class="t b">VLA action expert</text><text x="1017" y="405" text-anchor="middle" class="t s">Mₜ context + Oₜ + 언어</text><text x="1017" y="434" text-anchor="middle" class="t s">action chunk Aₜ / latent zᵃᶜᵗ</text><path d="M1042 230 V335" class="a"/>
  <rect x="500" y="325" width="300" height="145" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="650" y="365" text-anchor="middle" class="t b">Action-conditioned predictor</text><text x="650" y="396" text-anchor="middle" class="t s">Mₜ₋₁ + Xₜ + zᵃᶜᵗ</text><text x="650" y="426" text-anchor="middle" class="t s">다음 feature X̂ₜ₊₁ 예측</text><text x="650" y="453" text-anchor="middle" class="t s">학습: target Xₜ₊₁</text><path d="M890 397 H800" class="a"/><path d="M500 382 C400 382 400 210 625 210" class="a"/>
  <rect x="60" y="535" width="1085" height="95" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="85" y="571" class="t b">학습</text><text x="165" y="571" class="t s">action loss + future-feature prediction loss가 predictor와 memory 표현을 함께 학습</text><text x="85" y="606" class="t b">추론</text><text x="165" y="606" class="t s">X̂ₜ₊₁를 cache → 다음 관측 도착 시 검증 → 예측이 크게 빗나간 위치를 더 강하게 갱신</text>
</svg>
