<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Forward Dynamics Models action-to-future architecture</title>
  <desc id="desc">Current observations and language flow through context and action experts to actions. During training only, action features condition a future generation expert, whose loss backpropagates into the action features.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#6b7280"/></marker><style>text{font-family:Arial,sans-serif;fill:#111827}.h{font-size:26px;font-weight:700}.b{font-size:20px}.s{font-size:17px}.box{rx:18;stroke-width:3}.blue{fill:#eff6ff;stroke:#2563eb}.amber{fill:#fffbeb;stroke:#d97706}.gray{fill:#f3f4f6;stroke:#6b7280}.green{fill:#ecfdf5;stroke:#059669}</style></defs>
  <rect width="1200" height="620" fill="#ffffff"/><text x="50" y="48" class="h">Forward Dynamics Models — action → future</text>
  <rect x="45" y="115" width="210" height="120" class="box blue"/><text x="150" y="158" text-anchor="middle" class="b">Current context C</text><text x="150" y="192" text-anchor="middle" class="s">images Oₜ + language L</text>
  <rect x="330" y="115" width="220" height="120" class="box blue"/><text x="440" y="158" text-anchor="middle" class="b">Context expert</text><text x="440" y="192" text-anchor="middle" class="s">semantic features</text>
  <rect x="625" y="115" width="220" height="120" class="box amber"/><text x="735" y="155" text-anchor="middle" class="b">Action expert</text><text x="735" y="188" text-anchor="middle" class="s">hidden states Hₐ</text><text x="735" y="214" text-anchor="middle" class="s">flow-matching denoising</text>
  <rect x="930" y="115" width="220" height="120" class="box green"/><text x="1040" y="158" text-anchor="middle" class="b">Action chunk A</text><text x="1040" y="192" text-anchor="middle" class="s">deployment output</text>
  <path d="M255 175 H320" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M550 175 H615" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M845 175 H920" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <rect x="475" y="350" width="300" height="140" class="box gray" stroke-dasharray="10 7"/><text x="625" y="388" text-anchor="middle" class="b">Generation expert</text><text x="625" y="422" text-anchor="middle" class="s">p(V | C, Hₐ)</text><text x="625" y="452" text-anchor="middle" class="s">future image / video latent</text><text x="625" y="478" text-anchor="middle" class="s">TRAINING ONLY</text>
  <path d="M735 245 C735 300 700 320 670 342" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><path d="M440 245 C440 305 510 320 555 342" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
  <path d="M585 350 C540 300 610 265 690 240" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#g)"/><text x="410" y="310" class="s">future-loss gradient shapes Hₐ</text>
  <line x1="55" y1="540" x2="1145" y2="540" stroke="#d1d5db" stroke-width="2"/><text x="55" y="578" class="s">Inference: C → context → action → A only. Future generation is skipped and cannot inject prediction errors into actions.</text>
</svg>
