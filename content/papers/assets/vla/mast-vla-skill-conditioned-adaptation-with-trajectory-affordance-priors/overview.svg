<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">MAST-VLA dual-conditioning architecture</title>
  <desc id="desc">Inputs pass through a shared VLA backbone. Primitive skill conditions route LoRA experts, while a predicted trajectory-affordance heatmap biases visual patches for action decoding.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.t{font-size:20px;font-weight:700}.s{font-size:16px}.box{rx:18;stroke-width:2}</style></defs>
  <rect width="1200" height="680" fill="#f8fafc"/><text x="60" y="58" class="h">MAST-VLA: skill specialization + spatial grounding</text>
  <rect class="box" x="55" y="120" width="220" height="170" fill="#e0f2fe" stroke="#0284c7"/><text x="85" y="162" class="t">입력</text><text x="85" y="202" class="s">RGB 관측 · proprioception</text><text x="85" y="232" class="s">language instruction</text><text x="85" y="262" class="s">primitive skill condition</text>
  <rect class="box" x="370" y="105" width="360" height="200" fill="#ede9fe" stroke="#7c3aed"/><text x="410" y="148" class="t">Shared VLA / LLM backbone</text><text x="410" y="188" class="s">skill query + routing bias</text><text x="410" y="222" class="s">Top-k skill-conditioned LoRA-MoE</text><text x="410" y="256" class="s">shared knowledge, expert specialization</text>
  <rect class="box" x="370" y="385" width="360" height="170" fill="#dcfce7" stroke="#16a34a"/><text x="410" y="428" class="t">Trajectory-affordance path</text><text x="410" y="468" class="s">학습: future gripper trajectory → target</text><text x="410" y="502" class="s">추론: predicted heatmap → patch bias</text>
  <rect class="box" x="825" y="225" width="300" height="205" fill="#ffedd5" stroke="#ea580c"/><text x="875" y="270" class="t">Action head</text><text x="875" y="310" class="s">LLM features</text><text x="875" y="344" class="s">+ affordance-biased attention</text><text x="875" y="385" class="t">H-step action chunk</text>
  <path d="M275 205 H365" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M730 205 H815 V275" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M275 250 C330 250 320 465 365 465" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M730 470 C790 470 790 370 820 370" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <text x="55" y="625" class="s">논문 Figure 1 및 Sections 3.1–3.3을 바탕으로 재구성 · 원문: arXiv:2610.32312</text>
</svg>
