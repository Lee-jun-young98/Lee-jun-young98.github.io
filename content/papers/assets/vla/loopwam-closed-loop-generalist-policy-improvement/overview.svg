<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">LoopWAM 혼합 품질 rollout 학습과 배포 루프</title>
  <desc id="desc">전문가 시연과 다양한 품질의 배포 rollout이 품질 조건, noise sampling, 가중 supervision을 거쳐 공동 video-action denoising 모델을 학습하고 다시 배포되는 흐름</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.t{font-size:20px;font-weight:700}.s{font-size:16px}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb}.amber{fill:#fef3c7;stroke:#d97706}.green{fill:#dcfce7;stroke:#16a34a}.pink{fill:#fce7f3;stroke:#db2777}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="660" fill="#ffffff"/><text x="50" y="52" class="h">LoopWAM: 실패의 결과는 배우고, 실패 행동은 모방하지 않는다</text>
  <rect x="50" y="105" width="250" height="105" rx="16" class="box blue"/><text x="175" y="140" text-anchor="middle" class="t">Expert 시연</text><text x="175" y="173" text-anchor="middle" class="s">video + action · λ=1</text>
  <rect x="50" y="245" width="250" height="145" rx="16" class="box amber"/><text x="175" y="282" text-anchor="middle" class="t">배포 Rollout</text><text x="175" y="315" text-anchor="middle" class="s">성공 · 불완전 · 실패</text><text x="175" y="346" text-anchor="middle" class="s">video supervision 유지</text><text x="175" y="374" text-anchor="middle" class="s">action λ(q): 1 → 0</text>
  <path d="M300 158 H385" class="arrow"/><path d="M300 318 H385" class="arrow"/>
  <rect x="390" y="110" width="330" height="280" rx="18" class="box pink"/><text x="555" y="148" text-anchor="middle" class="t">품질 인지 공동 학습</text><text x="555" y="185" text-anchor="middle" class="s">instruction + Quality: q</text><text x="555" y="220" text-anchor="middle" class="s">source-dependent σvideo, σaction</text><rect x="425" y="250" width="125" height="92" rx="12" class="box blue"/><text x="488" y="286" text-anchor="middle" class="t">Video</text><text x="488" y="316" text-anchor="middle" class="s">future</text><rect x="565" y="250" width="125" height="92" rx="12" class="box green"/><text x="628" y="286" text-anchor="middle" class="t">Action</text><text x="628" y="316" text-anchor="middle" class="s">chunk</text><path d="M550 294 H565" class="arrow"/><path d="M565 320 H550" class="arrow"/><text x="555" y="372" text-anchor="middle" class="s">bidirectional joint attention</text>
  <path d="M720 250 H805" class="arrow"/><rect x="810" y="175" width="330" height="150" rx="18" class="box green"/><text x="975" y="214" text-anchor="middle" class="t">Expert mode 배포</text><text x="975" y="249" text-anchor="middle" class="s">q = q★ · joint denoising</text><text x="975" y="282" text-anchor="middle" class="s">action marginal 실행</text>
  <path d="M975 325 V475 H175 V400" class="arrow"/><text x="575" y="511" text-anchor="middle" class="t">수집 → 품질 평가 → 누적 재학습 → 재배포</text><text x="575" y="545" text-anchor="middle" class="s">학습 흐름(위)과 반복 self-improvement 흐름(아래)을 분리해 표시</text>
  <rect x="50" y="580" width="1090" height="45" rx="10" fill="#f1f5f9"/><text x="595" y="609" text-anchor="middle" class="s">논문 Figure 2를 바탕으로 재구성 · arXiv:2610.18873</text>
</svg>
