<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">FRED 미래 표현 self-distillation 구조</title>
  <desc id="desc">관측 이력과 명령을 공유하는 student VDM과 EMA teacher VDM이 미래 표현을 정렬하고 student 표현이 action decoder로 전달되는 흐름</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/><text x="60" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">FRED — 미래 표현을 action용으로 self-distillation</text><text x="60" y="98" font-family="sans-serif" font-size="17" fill="#475569">논문 Figure 2 · Section 3 기반 재구성</text>
  <g font-family="sans-serif"><rect x="55" y="160" width="235" height="105" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="172" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">공통 조건</text><text x="172" y="232" text-anchor="middle" font-size="17" fill="#1e40af">관측 이력 · 언어 지시</text>
  <rect x="385" y="125" width="300" height="145" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="535" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#4c1d95">Student / online VDM</text><text x="535" y="205" text-anchor="middle" font-size="17" fill="#5b21b6">noise ε → 미래 표현 h</text><text x="535" y="235" text-anchor="middle" font-size="16" fill="#5b21b6">video flow + L_SD로 학습</text>
  <rect x="385" y="390" width="300" height="145" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="535" y="432" text-anchor="middle" font-size="21" font-weight="700" fill="#14532d">EMA momentum teacher</text><text x="535" y="468" text-anchor="middle" font-size="17" fill="#166534">noisy future o(t+1)^τ</text><text x="535" y="500" text-anchor="middle" font-size="16" fill="#166534">target h^τ · stop-gradient</text>
  <rect x="765" y="245" width="205" height="150" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="868" y="285" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3412">표현 정렬</text><text x="868" y="322" text-anchor="middle" font-size="17" fill="#9a3412">projection + softmax</text><text x="868" y="356" text-anchor="middle" font-size="18" fill="#9a3412">patch-wise KL</text>
  <rect x="790" y="505" width="330" height="105" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="955" y="547" text-anchor="middle" font-size="21" font-weight="700" fill="#7f1d1d">Action diffusion decoder</text><text x="955" y="582" text-anchor="middle" font-size="17" fill="#991b1b">q + student h → action chunk</text></g>
  <g stroke="#334155" stroke-width="3" marker-end="url(#a)"><line x1="290" y1="205" x2="380" y2="195"/><line x1="290" y1="230" x2="380" y2="445"/><line x1="685" y1="200" x2="760" y2="280"/><line x1="685" y1="460" x2="760" y2="355"/><line x1="685" y1="235" x2="835" y2="500"/></g><path d="M790 560C690 630 510 625 510 540" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="590" y="650" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#166534">학습: teacher ← EMA(student) · 추론: teacher와 future frame 제거</text>
</svg>
