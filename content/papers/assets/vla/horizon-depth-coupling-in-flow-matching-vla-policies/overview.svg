<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Execution horizon and sampling depth coupling</title><desc id="desc">A flow VLA integrates for N solver steps, executes s actions open loop, and replans. Deep sampling helps short horizons while shallow sampling contracts drift for long horizons.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.t{font-size:20px;font-weight:700}.s{font-size:16px}.box{rx:18;stroke-width:2}</style></defs>
  <rect width="1200" height="680" fill="#f8fafc"/><text x="55" y="58" class="h">Flow-VLA: sampling depth N × execution horizon s</text>
  <rect class="box" x="55" y="150" width="205" height="135" fill="#e0f2fe" stroke="#0284c7"/><text x="95" y="195" class="t">관측 oₜ</text><text x="85" y="235" class="s">vision · language · state</text>
  <rect class="box" x="335" y="120" width="285" height="195" fill="#ede9fe" stroke="#7c3aed"/><text x="390" y="165" class="t">Frozen flow VLA</text><text x="380" y="208" class="s">x⁽⁰⁾ ~ N(0,I)</text><text x="380" y="244" class="s">Forward Euler × N</text><text x="380" y="280" class="s">action chunk âₜ</text>
  <rect class="box" x="700" y="150" width="250" height="135" fill="#ffedd5" stroke="#ea580c"/><text x="745" y="195" class="t">Robot 실행</text><text x="745" y="235" class="s">앞 s actions commit</text>
  <path d="M260 217 H330" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M620 217 H695" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M950 217 C1060 217 1050 370 825 370 C530 370 150 380 150 290" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="830" y="350" class="s">t+s에서 재관측·재계획</text>
  <rect class="box" x="95" y="455" width="440" height="145" fill="#dcfce7" stroke="#16a34a"/><text x="135" y="498" class="t">짧은 horizon: small s</text><text x="135" y="536" class="s">자주 feedback → deep N의 diversity 활용</text><text x="135" y="570" class="s">coarse solver는 precision 손실 가능</text>
  <rect class="box" x="650" y="455" width="455" height="145" fill="#fee2e2" stroke="#dc2626"/><text x="690" y="498" class="t">긴 horizon: large s</text><text x="690" y="536" class="s">open-loop drift 누적 → shallow N이 분산 수축</text><text x="690" y="570" class="s">centroid 유지 + lateral spread 억제</text>
  <text x="55" y="645" class="s">논문 Figures 1–2 및 Section III-C를 바탕으로 재구성 · 원문: arXiv:2610.32102</text>
</svg>
