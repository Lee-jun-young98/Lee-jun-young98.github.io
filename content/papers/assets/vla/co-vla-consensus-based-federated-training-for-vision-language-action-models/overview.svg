<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Co-VLA의 ADMM 기반 연합 VLA 학습 구조</title>
  <desc id="desc">세 로봇 클라이언트가 로컬 데이터로 VLA를 학습하고 dual correction과 consensus aggregation을 거쳐 공통 global VLA를 반복 갱신한 뒤 추론에 사용하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.h{font:700 28px Arial,sans-serif;fill:#0f172a}.t{font:600 18px Arial,sans-serif;fill:#0f172a}.s{font:15px Arial,sans-serif;fill:#334155}.eq{font:italic 15px Georgia,serif;fill:#334155}.box{stroke:#334155;stroke-width:2;rx:16}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="60" y="52" class="h">Co-VLA: 로컬 로봇 데이터 → ADMM consensus → 공통 VLA</text>
  <text x="65" y="100" class="t">분산된 입력과 client update</text>
  <rect x="60" y="125" width="255" height="120" class="box" fill="#dbeafe"/><text x="82" y="158" class="t">Client 1 · WidowX</text><text x="82" y="187" class="s">로컬 궤적 D₁ · task/scene 1</text><text x="82" y="218" class="eq">x₁ ← local loss + consensus penalty</text>
  <rect x="60" y="270" width="255" height="120" class="box" fill="#dcfce7"/><text x="82" y="303" class="t">Client 2 · Franka</text><text x="82" y="332" class="s">로컬 궤적 D₂ · task/scene 2</text><text x="82" y="363" class="eq">x₂ ← local loss + consensus penalty</text>
  <rect x="60" y="415" width="255" height="120" class="box" fill="#fef3c7"/><text x="82" y="448" class="t">Client N · 다른 로봇</text><text x="82" y="477" class="s">로컬 궤적 Dₙ · non-i.i.d.</text><text x="82" y="508" class="eq">xₙ ← local loss + consensus penalty</text>
  <rect x="390" y="180" width="290" height="300" class="box" fill="#ede9fe"/><text x="425" y="220" class="t">각 client의 ADMM 단계</text><text x="420" y="265" class="s">1. dual gap 누적</text><text x="440" y="293" class="eq">uᵢᵏ ← uᵢᵏ⁻¹ + x̂ᵢᵏ − zᵏ</text><text x="420" y="338" class="s">2. proximity-regularized local update</text><text x="440" y="366" class="eq">fᵢ(xᵢ) + ρ/2 ‖xᵢ − zᵏ + uᵢᵏ‖²</text><text x="420" y="411" class="s">3. over-relaxation</text><text x="440" y="439" class="eq">x̂ᵢᵏ⁺¹ ← αxᵢᵏ⁺¹ + (1−α)zᵏ</text>
  <path d="M315 185 C350 185 355 235 390 235" class="line"/><path d="M315 330 L390 330" class="line"/><path d="M315 475 C350 475 355 425 390 425" class="line"/>
  <rect x="755" y="170" width="370" height="320" class="box" fill="#fee2e2"/><text x="800" y="212" class="t">중앙 server · global consensus</text><text x="790" y="258" class="s">client의 (x̂ᵢᵏ⁺¹, uᵢᵏ) 수집</text><text x="790" y="302" class="eq">zᵏ⁺¹ = 1/N Σᵢ (x̂ᵢᵏ⁺¹ + uᵢᵏ)</text><line x1="790" y1="328" x2="1090" y2="328" stroke="#f87171" stroke-width="2"/><text x="790" y="365" class="s">Full VLA: 전체 parameter에 합의</text><text x="790" y="399" class="s">LoRA: A, B factor에 직접 합의</text><text x="790" y="433" class="s">SoRA: gate g soft-threshold → rank pruning</text><text x="790" y="465" class="s">갱신된 zᵏ⁺¹을 모든 client에 방송</text>
  <path d="M680 330 L755 330" class="line"/><path d="M755 205 C710 110 370 88 300 125" class="dash"/><text x="565" y="104" class="s">다음 round: global model z 방송</text>
  <rect x="390" y="565" width="735" height="70" class="box" fill="#cffafe"/><text x="420" y="596" class="t">추론: 합의된 global VLA 하나만 사용</text><text x="420" y="622" class="s">관측 이미지 + 언어 지시 + robot state → flow-matching action expert → action chunk</text><path d="M940 490 L940 565" class="line"/>
  <text x="60" y="655" class="s">논문 Figure 1, Algorithm 1, 식 (1)–(4)를 바탕으로 재구성 · 원문: arXiv:2609.19923v1</text>
</svg>