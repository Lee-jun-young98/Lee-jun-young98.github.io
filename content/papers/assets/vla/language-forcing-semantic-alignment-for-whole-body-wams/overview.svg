<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Language-Forcing 학습과 추론 구조</title><desc id="desc">현재와 미래 프레임 및 지시를 frozen VLM과 text encoder로 처리해 WAM future visual feature에 정렬하고 추론 때 보조 branch를 제거하는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker><style>.t{font:700 24px Arial,sans-serif;fill:#17324d}.s{font:16px Arial,sans-serif;fill:#29455f}.b{fill:#f5f9fc;stroke:#315b7d;stroke-width:2}.g{fill:#eef8f3;stroke:#2c7a5b;stroke-width:2}.o{fill:#fff5e8;stroke:#b76b18;stroke-width:2}.p{fill:#f6f0ff;stroke:#7651a8;stroke-width:2}.ln{fill:none;stroke:#315b7d;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#7651a8;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="680" fill="#fff"/><text x="55" y="58" class="t">Language-Forcing: task-progress semantics for whole-body WAM</text><text x="55" y="96" class="s">학습 전용 semantic branch</text>
  <rect x="55" y="125" width="230" height="145" rx="16" class="b"/><text x="84" y="170" class="t">관측 쌍</text><text x="84" y="205" class="s">현재 Iₜ + 미래 Iₜ₊₄₈</text><text x="84" y="235" class="s">task instruction</text>
  <rect x="355" y="125" width="220" height="145" rx="16" class="p"/><text x="397" y="170" class="t">Frozen VLM</text><text x="385" y="205" class="s">진행 상태 평가</text><text x="385" y="235" class="s">다음 상태 설명 yₜ</text>
  <rect x="645" y="125" width="220" height="145" rx="16" class="p"/><text x="678" y="170" class="t">Text encoder</text><text x="684" y="205" class="s">offline cache</text><text x="684" y="235" class="s">language target eₜ</text>
  <rect x="350" y="380" width="300" height="150" rx="16" class="g"/><text x="405" y="425" class="t">Whole-body WAM</text><text x="390" y="460" class="s">image · state · action tokens</text><text x="390" y="490" class="s">future-visual features Fₜ⁽ˡ⁾</text>
  <rect x="745" y="380" width="210" height="150" rx="16" class="o"/><text x="782" y="425" class="t">학습 loss</text><text x="780" y="461" class="s">action flow</text><text x="780" y="490" class="s">visual + alignment</text>
  <rect x="985" y="380" width="170" height="150" rx="16" class="g"/><text x="1020" y="425" class="t">추론</text><text x="1015" y="462" class="s">action expert</text><text x="1015" y="491" class="s">추가 비용 없음</text>
  <path d="M285 198 H355" class="ln"/><path d="M575 198 H645" class="ln"/><path d="M755 270 C755 330 830 330 830 380" class="dash"/><path d="M285 240 C310 300 410 330 455 380" class="ln"/><path d="M650 455 H745" class="ln"/><path d="M955 455 H985" class="ln"/>
  <text x="55" y="622" class="s">논문 Figure 2를 바탕으로 재구성 · 보라색 branch는 training에서만 사용하고 inference에서 제거</text>
</svg>
