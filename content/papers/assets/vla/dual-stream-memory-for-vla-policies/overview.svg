<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Dual-stream memory architecture for VLA policies</title><desc id="desc">Visual history splits into a recurrent temporal stream and task-conditioned spatial retrieval stream. Both memory readouts modulate the VLA action expert.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#0f766e"/></marker><style>text{font-family:Arial,sans-serif;fill:#111827}.h{font-size:26px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:17px}.box{rx:18;stroke-width:3}.blue{fill:#eff6ff;stroke:#2563eb}.teal{fill:#f0fdfa;stroke:#0f766e}.amber{fill:#fffbeb;stroke:#d97706}.green{fill:#ecfdf5;stroke:#059669}.gray{fill:#f3f4f6;stroke:#6b7280}</style></defs>
  <rect width="1200" height="650" fill="white"/><text x="50" y="45" class="h">Dual-Stream Memory — execution context + visual evidence</text>
  <rect x="45" y="235" width="210" height="120" class="box blue"/><text x="150" y="278" text-anchor="middle" class="b">Visual history O₀:ₜ</text><text x="150" y="312" text-anchor="middle" class="s">causal front-view prefix</text>
  <rect x="335" y="95" width="255" height="150" class="box teal"/><text x="463" y="135" text-anchor="middle" class="b">Temporal stream</text><text x="463" y="170" text-anchor="middle" class="s">DINOv3 → 6-layer GDN</text><text x="463" y="202" text-anchor="middle" class="s">one context token cₜ</text><text x="463" y="230" text-anchor="middle" class="s">progress + history losses</text>
  <rect x="335" y="365" width="255" height="160" class="box amber"/><text x="463" y="405" text-anchor="middle" class="b">Spatial stream</text><text x="463" y="440" text-anchor="middle" class="s">task-conditioned threshold</text><text x="463" y="472" text-anchor="middle" class="s">retain mₜ frames</text><text x="463" y="504" text-anchor="middle" class="s">16 tokens / frame</text>
  <path d="M255 275 C290 245 305 190 325 175" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#a)"/><path d="M255 315 C290 350 305 420 325 445" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#a)"/>
  <rect x="680" y="215" width="220" height="160" class="box gray"/><text x="790" y="255" text-anchor="middle" class="b">Memory readout</text><text x="790" y="292" text-anchor="middle" class="s">action-expert queries</text><text x="790" y="324" text-anchor="middle" class="s">gated sum</text><text x="790" y="354" text-anchor="middle" class="s">temporal + spatial</text>
  <path d="M590 170 C650 180 645 245 670 265" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#a)"/><path d="M590 445 C650 430 645 350 670 325" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#a)"/>
  <rect x="980" y="215" width="175" height="160" class="box green"/><text x="1068" y="258" text-anchor="middle" class="b">VLA action</text><text x="1068" y="291" text-anchor="middle" class="b">expert</text><text x="1068" y="328" text-anchor="middle" class="s">current views</text><text x="1068" y="356" text-anchor="middle" class="s">state + instruction</text>
  <path d="M900 295 H970" stroke="#0f766e" stroke-width="4" marker-end="url(#a)"/>
  <text x="45" y="585" class="s">Stage 1: pretrain GDN with progress and action-conditioned reconstruction, then freeze it.</text><text x="45" y="618" class="s">Stage 2: jointly optimize task-conditioned retrieval and policy learning; inference reads both streams causally.</text>
</svg>
