<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Splat2Act real-to-sim-to-real pipeline</title><desc id="desc">Scene and object captures flow through reconstruction, task generation, oracle demonstrations, two-stage VLA adaptation, and real robot deployment.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="1200" height="420" rx="24" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">Splat2Act — 캡처에서 개인화 VLA까지</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="35" y="105" width="165" height="170" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="118" y="140" font-size="18" font-weight="700">입력 캡처</text><text x="118" y="174" font-size="15">장면 RGB-D</text><text x="118" y="200" font-size="15">물체 사진 + 크기</text><text x="118" y="235" font-size="13" fill="#475569">20–30분 / 사용자 1회</text><rect x="245" y="85" width="190" height="210" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="340" y="122" font-size="18" font-weight="700">디지털 트윈</text><text x="340" y="158" font-size="15">3DGS 외관</text><text x="340" y="184" font-size="15">collision mesh</text><text x="340" y="210" font-size="15">SAM3D 물체 asset</text><text x="340" y="254" font-size="13" fill="#475569">DN-Splatter · SuGaR</text><rect x="480" y="85" width="205" height="210" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="583" y="122" font-size="18" font-weight="700">자동 task 생성</text><text x="583" y="158" font-size="15">receptacle 탐색</text><text x="583" y="184" font-size="15">navmesh + reachability</text><text x="583" y="210" font-size="15">grasp / 배치 검사</text><text x="583" y="254" font-size="13" fill="#475569">101 scenes · 852 supports</text><rect x="730" y="85" width="190" height="210" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="825" y="122" font-size="18" font-weight="700">Oracle 데이터</text><text x="825" y="158" font-size="15">계획 · 실행 · 재시도</text><text x="825" y="184" font-size="15">성공 rollout 기록</text><text x="825" y="224" font-size="15" font-weight="700">68,021 demos</text><text x="825" y="254" font-size="13" fill="#475569">teleoperation 없음</text><rect x="965" y="72" width="200" height="236" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><text x="1065" y="110" font-size="18" font-weight="700">2단계 VLA 적응</text><text x="1065" y="148" font-size="15">Stage 1: broad</text><text x="1065" y="174" font-size="13">embodiment + pickup</text><text x="1065" y="211" font-size="15">Stage 2: personalized</text><text x="1065" y="237" font-size="13">장면 + 사용자 물체</text><text x="1065" y="278" font-size="14" font-weight="700">실제 Stretch 3</text></g>
