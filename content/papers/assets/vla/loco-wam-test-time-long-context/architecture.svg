<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">LoCo-WAM 테스트 타임 학습 아키텍처</title>
  <desc id="desc">고정 길이 관측 이력으로 video expert가 미래를 상상하고 frozen action expert가 action chunk를 만든다. 실행 후 관측된 프레임의 video loss가 episode 안에서 누적되는 LoRA를 갱신하고 다음 의사결정에 반영된다.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker><style>text{font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif;fill:#0f172a}.h{font-size:25px;font-weight:700}.t{font-size:18px}.s{font-size:15px}.box{stroke-width:2;rx:16}.a{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.u{stroke:#7c3aed;stroke-width:3;fill:none;stroke-dasharray:9 7;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="680" fill="#f8fafc"/><text x="50" y="48" class="h">LoCo-WAM: 짧은 입력 창을 유지하면서 episode 경험을 LoRA에 누적</text>
  <rect x="45" y="105" width="220" height="150" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="155" y="140" text-anchor="middle" class="h">현재 입력 Hₜ</text><text x="155" y="177" text-anchor="middle" class="t">최근 P개 관측</text><text x="155" y="207" text-anchor="middle" class="s">언어 instruction + proprioception</text><text x="155" y="234" text-anchor="middle" class="s">입력 길이는 항상 고정</text>
  <rect x="330" y="90" width="260" height="180" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="460" y="126" text-anchor="middle" class="h">Video expert</text><text x="460" y="161" text-anchor="middle" class="t">Φᵥ + Θₜ (LoRA)</text><text x="460" y="194" text-anchor="middle" class="s">Rollout(εᵥ | Hₜ)</text><text x="460" y="221" text-anchor="middle" class="s">미래 latent ẑₜ 예측</text><text x="460" y="247" text-anchor="middle" class="s">episode 중 adapter만 변화</text>
  <rect x="655" y="90" width="250" height="180" class="box" fill="#fef3c7" stroke="#d97706"/><text x="780" y="126" text-anchor="middle" class="h">Action expert</text><text x="780" y="161" text-anchor="middle" class="t">고정 Φₐ</text><text x="780" y="194" text-anchor="middle" class="s">Denoise(εᵃ | Hₜ, ẑₜ)</text><text x="780" y="221" text-anchor="middle" class="s">video feature도 함께 읽음</text><text x="780" y="247" text-anchor="middle" class="s">다음 action chunk aₜ</text>
  <rect x="970" y="105" width="185" height="150" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="1062" y="140" text-anchor="middle" class="h">환경</text><text x="1062" y="177" text-anchor="middle" class="t">aₜ 실행</text><text x="1062" y="207" text-anchor="middle" class="s">새 실제 프레임</text><text x="1062" y="234" text-anchor="middle" class="s">history 갱신</text>
  <path d="M265 180 H325" class="a"/><path d="M590 180 H650" class="a"/><path d="M905 180 H965" class="a"/>
  <rect x="170" y="375" width="300" height="175" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="320" y="413" text-anchor="middle" class="h">완료된 과거 window</text><text x="320" y="450" text-anchor="middle" class="t">그때의 history H</text><text x="320" y="480" text-anchor="middle" class="s">실제로 관측된 미래 frame latent z</text><text x="320" y="510" text-anchor="middle" class="s">expert action label·추가 데이터 불필요</text>
  <rect x="575" y="375" width="300" height="175" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="725" y="413" text-anchor="middle" class="h">test-time video update</text><text x="725" y="450" text-anchor="middle" class="t">Lvideo(Φᵥ + Θᵥ)</text><text x="725" y="480" text-anchor="middle" class="s">gradient clip · LoRA만 update</text><text x="725" y="510" text-anchor="middle" class="s">매 decision 누적 / episode 시작 때 reset</text>
  <path d="M1062 255 V320 H320 V370" class="a"/><path d="M470 463 H570" class="a"/><path d="M725 375 V310 H460 V275" class="u"/>
  <text x="50" y="612" class="t" font-weight="700">추론 흐름:</text><text x="160" y="612" class="t">Hₜ → 적응된 video expert의 imagined future → 고정 action expert → aₜ → 환경.</text>
  <text x="50" y="648" class="t" font-weight="700">적응 흐름:</text><text x="160" y="648" class="t">결과 프레임이 모두 도착한 과거 window로 Θᵥ를 갱신하며, 비동기형은 이전 adapter를 써 latency를 숨긴다.</text>
</svg>
