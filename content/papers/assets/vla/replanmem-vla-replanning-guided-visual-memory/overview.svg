<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">RePlanMem-VLA architecture</title>
  <desc id="desc">Current observation and memory produce a pre-write action chunk. Its overlap with the previous plan yields a surprise score, which gates redundancy-aware FIFO memory updates and an optional second VLA pass.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:16}.blue{fill:#dbeafe;stroke:#2563eb}.green{fill:#dcfce7;stroke:#16a34a}.amber{fill:#fef3c7;stroke:#d97706}.purple{fill:#ede9fe;stroke:#7c3aed}.t{font:700 24px sans-serif;fill:#0f172a}.s{font:17px sans-serif;fill:#334155}.a{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}</style>
  </defs>
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="60" y="54" class="t">RePlanMem-VLA: 계획 수정으로 시각 메모리를 쓰는 흐름</text>
  <rect x="55" y="105" width="220" height="125" class="box blue"/><text x="165" y="145" text-anchor="middle" class="t">입력</text><text x="165" y="180" text-anchor="middle" class="s">현재 관측 · instruction</text><text x="165" y="207" text-anchor="middle" class="s">기존 FIFO memory</text>
  <rect x="360" y="105" width="230" height="125" class="box purple"/><text x="475" y="151" text-anchor="middle" class="t">VLA 1차 추론</text><text x="475" y="188" text-anchor="middle" class="s">pre-write chunk C⁻q</text>
  <rect x="670" y="85" width="250" height="165" class="box amber"/><text x="795" y="128" text-anchor="middle" class="t">계획 불일치</text><text x="795" y="163" text-anchor="middle" class="s">이전 chunk의 뒤쪽</text><text x="795" y="190" text-anchor="middle" class="s">vs 새 chunk의 앞쪽</text><text x="795" y="220" text-anchor="middle" class="s">task별 surprise percentile</text>
  <path d="M275 167 H360" class="a"/><path d="M590 167 H670" class="a"/>
  <rect x="670" y="330" width="250" height="150" class="box green"/><text x="795" y="371" text-anchor="middle" class="t">선택적 memory write</text><text x="795" y="406" text-anchor="middle" class="s">직전 3 frame clustering</text><text x="795" y="433" text-anchor="middle" class="s">robot-masked 중복 제거</text><text x="795" y="460" text-anchor="middle" class="s">새 상태만 FIFO append</text>
  <path d="M795 250 V330" class="a"/><text x="813" y="294" class="s">p &gt; τ</text>
  <rect x="360" y="350" width="230" height="125" class="box purple"/><text x="475" y="392" text-anchor="middle" class="t">VLA 2차 추론</text><text x="475" y="428" text-anchor="middle" class="s">갱신 memory 조건부</text><text x="475" y="454" text-anchor="middle" class="s">final action chunk</text>
  <path d="M670 405 H590" class="a"/>
  <rect x="55" y="350" width="220" height="125" class="box blue"/><text x="165" y="394" text-anchor="middle" class="t">로봇 실행</text><text x="165" y="431" text-anchor="middle" class="s">앞 H action 실행</text><text x="165" y="457" text-anchor="middle" class="s">다음 관측에서 재계획</text>
  <path d="M360 412 H275" class="a"/>
  <path d="M795 250 C795 560 475 560 475 475" class="a dash"/><text x="650" y="550" text-anchor="middle" class="s">write 없으면 2차 추론 없이 C⁻q 실행</text>
  <rect x="955" y="105" width="190" height="370" class="box"/><text x="1050" y="148" text-anchor="middle" class="t">핵심 차이</text><text x="1050" y="192" text-anchor="middle" class="s">별도 VLM judge 없이</text><text x="1050" y="220" text-anchor="middle" class="s">정책 자신의 계획 수정이</text><text x="1050" y="248" text-anchor="middle" class="s">memory-write 신호</text><line x1="980" y1="280" x2="1120" y2="280" stroke="#cbd5e1"/><text x="1050" y="320" text-anchor="middle" class="s">학습: final chunk에만</text><text x="1050" y="348" text-anchor="middle" class="s">action SFT loss</text><text x="1050" y="392" text-anchor="middle" class="s">추론: 실제 write 때만</text><text x="1050" y="420" text-anchor="middle" class="s">추가 forward pass</text>
  <text x="60" y="635" class="s">논문 Figure 4 및 Algorithm 1을 바탕으로 재구성 · arXiv:2610.22556</text>
</svg>
