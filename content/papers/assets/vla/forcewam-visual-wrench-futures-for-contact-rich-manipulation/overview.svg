<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">ForceWAM 학습과 slow-fast 배포 구조</title>
  <desc id="desc">성공 task demonstration은 visual-wrench future generator를 학습하고 task와 play data는 inverse dynamics를 학습하며 배포 시 미래 기준과 실시간 wrench feedback으로 행동을 생성한다</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.t{font-size:20px;font-weight:700}.s{font-size:16px}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb}.amber{fill:#fef3c7;stroke:#d97706}.green{fill:#dcfce7;stroke:#16a34a}.violet{fill:#ede9fe;stroke:#7c3aed}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="660" fill="#fff"/><text x="50" y="52" class="h">ForceWAM: 목표 future와 접촉 response를 분리해 학습</text>
  <text x="52" y="95" class="t">학습</text><rect x="50" y="120" width="245" height="100" rx="15" class="box blue"/><text x="173" y="157" text-anchor="middle" class="t">성공 Task Demo</text><text x="173" y="188" text-anchor="middle" class="s">image · wrench · language</text>
  <rect x="50" y="250" width="245" height="100" rx="15" class="box amber"/><text x="173" y="287" text-anchor="middle" class="t">Task + Play</text><text x="173" y="318" text-anchor="middle" class="s">local action-contact pairs</text>
  <path d="M295 170 H390" class="arrow"/><rect x="395" y="115" width="280" height="115" rx="15" class="box violet"/><text x="535" y="153" text-anchor="middle" class="t">ForceWM (느림)</text><text x="535" y="184" text-anchor="middle" class="s">future video + 6D wrench</text><text x="535" y="210" text-anchor="middle" class="s">task-compatible outcome</text>
  <path d="M295 300 H390" class="arrow"/><rect x="395" y="245" width="280" height="115" rx="15" class="box green"/><text x="535" y="283" text-anchor="middle" class="t">Causal IDM (빠름)</text><text x="535" y="314" text-anchor="middle" class="s">future → action diffusion</text><text x="535" y="340" text-anchor="middle" class="s">play로 response 확장</text>
  <text x="52" y="420" class="t">배포</text><rect x="50" y="445" width="250" height="105" rx="15" class="box blue"/><text x="175" y="481" text-anchor="middle" class="t">현재 관측</text><text x="175" y="513" text-anchor="middle" class="s">wrist RGB · wrench · 언어</text>
  <path d="M300 480 H390" class="arrow"/><rect x="395" y="420" width="280" height="100" rx="15" class="box violet"/><text x="535" y="458" text-anchor="middle" class="t">Visual-Wrench Future</text><text x="535" y="490" text-anchor="middle" class="s">주기적으로 갱신되는 목표</text>
  <path d="M675 470 H760" class="arrow"/><path d="M300 525 H760" class="arrow"/><rect x="765" y="420" width="190" height="130" rx="15" class="box green"/><text x="860" y="460" text-anchor="middle" class="t">Streaming IDM</text><text x="860" y="493" text-anchor="middle" class="s">새 wrench prefix로</text><text x="860" y="522" text-anchor="middle" class="s">action 즉시 보정</text><path d="M955 485 H1040" class="arrow"/><rect x="1045" y="442" width="110" height="85" rx="15" class="box amber"/><text x="1100" y="480" text-anchor="middle" class="t">Robot</text><text x="1100" y="509" text-anchor="middle" class="s">action</text>
  <rect x="50" y="590" width="1105" height="42" rx="10" fill="#f1f5f9"/><text x="603" y="617" text-anchor="middle" class="s">논문 Figure 2를 바탕으로 재구성 · arXiv:2610.18852</text>
</svg>
