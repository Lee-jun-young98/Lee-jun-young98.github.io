<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">SWAP offline 학습과 온라인 VLA 정책 라우팅</title>
  <desc id="desc">여러 VLA의 성공과 실패 실행을 chunk transition으로 만들고 IQL routing critic을 학습해 실행 중 가장 높은 Q값의 정책을 반복 선택하는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.t{font-size:18px;font-weight:600}.s{font-size:15px;fill:#475569}.box{rx:18;stroke-width:2}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:8 7}</style></defs>
  <rect width="1200" height="690" fill="#f8fafc"/><text x="600" y="44" text-anchor="middle" class="h">SWAP: VLA를 action chunk마다 다시 선택하는 상위 정책</text>
  <text x="290" y="86" text-anchor="middle" class="t">Offline routing critic 학습</text><text x="900" y="86" text-anchor="middle" class="t">Online stepwise routing</text>
  <rect x="45" y="115" width="225" height="130" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="157" y="153" text-anchor="middle" class="t">후보 VLA rollout</text><text x="157" y="185" text-anchor="middle" class="s">π₀ · π₀.₅ · π₀-FAST</text><text x="157" y="216" text-anchor="middle" class="s">성공 + 실패 trajectory</text>
  <rect x="335" y="115" width="245" height="130" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="457" y="151" text-anchor="middle" class="t">Chunk transition</text><text x="457" y="183" text-anchor="middle" class="s">(oₜ, policy ID, rₜ,</text><text x="457" y="211" text-anchor="middle" class="s">oₜ₊c, done)</text><path d="M270 180 H335" class="arrow"/>
  <rect x="80" y="315" width="230" height="110" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="195" y="354" text-anchor="middle" class="t">Frozen Qwen2.5-VL</text><text x="195" y="386" text-anchor="middle" class="s">image + instruction</text><text x="195" y="411" text-anchor="middle" class="s">→ 2,048-d feature</text>
  <rect x="365" y="315" width="230" height="110" class="box" fill="#fef3c7" stroke="#d97706"/><text x="480" y="356" text-anchor="middle" class="t">Policy ID embedding</text><text x="480" y="390" text-anchor="middle" class="s">후보 controller identity</text>
  <rect x="185" y="500" width="330" height="120" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="350" y="537" text-anchor="middle" class="t">IQL routing critic</text><text x="350" y="569" text-anchor="middle" class="s">Double Q₁,Q₂ + value V</text><text x="350" y="597" text-anchor="middle" class="s">sparse terminal reward</text>
  <path d="M195 425 L280 500" class="arrow"/><path d="M480 425 L420 500" class="arrow"/><path d="M457 245 L420 500" class="arrow dash"/>
  <rect x="700" y="115" width="260" height="105" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="830" y="151" text-anchor="middle" class="t">현재 관찰 + 지시</text><text x="830" y="184" text-anchor="middle" class="s">frozen VLM feature hₜ</text>
  <rect x="670" y="285" width="320" height="120" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="830" y="323" text-anchor="middle" class="t">모든 후보의 보수적 가치</text><text x="830" y="356" text-anchor="middle" class="s">min(Q₁(hₜ,k), Q₂(hₜ,k))</text><text x="830" y="382" text-anchor="middle" class="s">argmax policy ID</text><path d="M830 220 V285" class="arrow"/>
  <rect x="675" y="485" width="310" height="110" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="830" y="522" text-anchor="middle" class="t">선택 VLA가 c actions 실행</text><text x="830" y="555" text-anchor="middle" class="s">환경 변화 → 새 관찰</text><text x="830" y="580" text-anchor="middle" class="s">다음 chunk에서 다시 routing</text><path d="M830 405 V485" class="arrow"/>
  <path d="M985 540 C1120 540 1120 165 960 165" class="arrow dash"/><path d="M515 560 C605 560 610 345 670 345" class="arrow dash"/>
  <text x="600" y="660" text-anchor="middle" class="s">논문 Figure 2를 바탕으로 재구성 · arXiv:2610.06926</text>
</svg>
