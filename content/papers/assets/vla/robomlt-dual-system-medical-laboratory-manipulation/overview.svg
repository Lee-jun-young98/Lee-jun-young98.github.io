<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Robo-MLT 장기 의료 실험실 조작 구조 재구성</title>
  <desc id="desc">프로토콜과 초기 관측을 VLM planner가 skill plan으로 바꾸고, System 2가 다중 프레임으로 stay advance recover를 판단하며, System 1 flow-matching VLA가 action chunk를 비동기로 실행한다.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><style>.t{font-family:'Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:19px;font-weight:700}.s{font-size:15px}.box{rx:16;ry:16;stroke-width:2}.arr{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}.plan{fill:#fff7ed;stroke:#ea580c}.slow{fill:#eff6ff;stroke:#2563eb}.fast{fill:#ecfdf5;stroke:#059669}.robot{fill:#f5f3ff;stroke:#7c3aed}.train{fill:#fff1f2;stroke:#e11d48}.note{fill:#f8fafc;stroke:#94a3b8}</style></defs>
  <rect width="1200" height="680" fill="#fff"/><text x="45" y="46" class="t h">Robo-MLT: 명시적 workflow state + skill-conditioned VLA</text><text x="45" y="74" class="t s">Figure 1–2와 §III를 바탕으로 재구성 · 점선은 저주파 결정/복구 경로</text>
  <rect x="35" y="120" width="180" height="85" class="box note"/><text x="125" y="153" text-anchor="middle" class="t m">Protocol</text><text x="125" y="181" text-anchor="middle" class="t s">+ 초기 workspace RGB</text>
  <rect x="270" y="105" width="220" height="115" class="box plan"/><text x="380" y="143" text-anchor="middle" class="t m">Frozen VLM Planner</text><text x="380" y="174" text-anchor="middle" class="t s">atomic-skill sequence</text><text x="380" y="198" text-anchor="middle" class="t s">P = [s₁, s₂, …]</text>
  <rect x="550" y="100" width="245" height="125" class="box plan"/><text x="672" y="139" text-anchor="middle" class="t m">Plan + Skill Pointer</text><text x="672" y="172" text-anchor="middle" class="t s">active instruction lₜ</text><text x="672" y="198" text-anchor="middle" class="t s">완료 시 ptr ← ptr + 1</text>
  <rect x="35" y="310" width="180" height="105" class="box note"/><text x="125" y="346" text-anchor="middle" class="t m">실행 관측</text><text x="125" y="375" text-anchor="middle" class="t s">global + 2 wrist RGB</text><text x="125" y="399" text-anchor="middle" class="t s">proprioception</text>
  <rect x="270" y="270" width="300" height="185" class="box slow"/><text x="420" y="307" text-anchor="middle" class="t m">System 2 · 1.33 Hz</text><text x="420" y="338" text-anchor="middle" class="t s">Frozen SigLIP2 image/text encoder</text><text x="420" y="365" text-anchor="middle" class="t s">causal temporal encoder (M frames)</text><text x="420" y="392" text-anchor="middle" class="t s">skill-text cross-attention</text><text x="420" y="426" text-anchor="middle" class="t m">stay · advance · recover</text>
  <rect x="650" y="300" width="265" height="155" class="box fast"/><text x="782" y="338" text-anchor="middle" class="t m">System 1 · Flow VLA</text><text x="782" y="369" text-anchor="middle" class="t s">RGB + state + active skill</text><text x="782" y="396" text-anchor="middle" class="t s">flow-matching action head</text><text x="782" y="427" text-anchor="middle" class="t s">prefetch + chunk blending</text>
  <rect x="985" y="305" width="180" height="145" class="box robot"/><text x="1075" y="343" text-anchor="middle" class="t m">Dual-arm Robot</text><text x="1075" y="375" text-anchor="middle" class="t s">20 Hz action stream</text><text x="1075" y="403" text-anchor="middle" class="t s">lab workflow 실행</text><text x="1075" y="430" text-anchor="middle" class="t s">새 관측 반환</text>
  <rect x="270" y="525" width="300" height="95" class="box train"/><text x="420" y="560" text-anchor="middle" class="t m">학습 supervision</text><text x="420" y="589" text-anchor="middle" class="t s">skill boundary · completion · recovery</text>
  <path d="M215 162H270" class="arr"/><path d="M490 162H550" class="arr"/><path d="M215 362H270" class="arr"/><path d="M570 362H650" class="arr"/><path d="M795 225V300" class="arr"/><path d="M915 378H985" class="arr"/><path d="M985 430C900 500 260 500 215 400" class="arr"/><path d="M550 170C510 210 495 245 500 270" class="arr dash"/><path d="M570 320C610 270 625 230 650 210" class="arr dash"/><path d="M270 330C235 260 335 220 550 185" class="arr dash"/><path d="M420 525V455" class="arr dash" style="stroke:#e11d48"/>
  <rect x="640" y="520" width="525" height="100" rx="14" fill="#f1f5f9"/><text x="902" y="554" text-anchor="middle" class="t m">결정별 폐루프</text><text x="902" y="582" text-anchor="middle" class="t s">stay: action 계속 · advance: 다음 skill · recover: chunk 폐기 + 남은 plan 재작성</text><text x="902" y="606" text-anchor="middle" class="t s">미세 trajectory 보정과 workflow-level 복구를 서로 다른 시간 규모에서 처리</text>
</svg>
