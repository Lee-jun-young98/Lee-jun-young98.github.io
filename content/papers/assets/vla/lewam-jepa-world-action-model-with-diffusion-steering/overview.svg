<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">LeWAM 학습과 diffusion steering 구조</title>
  <desc id="desc">영상 프레임을 JEPA latent로 바꾸고 네 masking mode로 dynamics와 policy를 학습한 뒤 noise-space MPC가 goal latent에 가까운 action을 선택한다.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <text x="55" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">LeWAM — decoder-free JEPA + noise-space MPC</text>
  <rect x="55" y="105" width="205" height="105" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="157" y="145" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Frame window</text><text x="157" y="177" text-anchor="middle" font-family="sans-serif" font-size="16">o(t-2:t+1)</text>
  <rect x="315" y="105" width="210" height="105" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="420" y="145" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">ViT-tiny + SIGReg</text><text x="420" y="177" text-anchor="middle" font-family="sans-serif" font-size="16">384-D JEPA latent</text>
  <line x1="260" y1="158" x2="305" y2="158" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <rect x="585" y="90" width="560" height="250" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="865" y="127" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">Shared bidirectional transformer</text>
  <g font-family="sans-serif" font-size="17" text-anchor="middle"><rect x="620" y="155" width="215" height="65" rx="13" fill="#fff"/><text x="727" y="183">Forward / Backward</text><text x="727" y="205">latent MSE</text><rect x="895" y="155" width="215" height="65" rx="13" fill="#fff"/><text x="1002" y="183">Inverse / Policy</text><text x="1002" y="205">rectified-flow action</text><rect x="730" y="250" width="270" height="58" rx="13" fill="#fef3c7"/><text x="865" y="285">mask가 mode를 결정</text></g>
  <line x1="525" y1="158" x2="575" y2="158" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <text x="55" y="400" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">추론: Diffusion Steering</text>
  <rect x="55" y="440" width="210" height="110" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="160" y="479" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">Noise candidates ε</text><text x="160" y="510" text-anchor="middle" font-family="sans-serif" font-size="16">√A sphere projection</text>
  <rect x="330" y="440" width="210" height="110" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="435" y="479" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">Policy sampler</text><text x="435" y="510" text-anchor="middle" font-family="sans-serif" font-size="16">a = g(ε; z)</text>
  <rect x="605" y="440" width="220" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="715" y="479" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">Forward rollout</text><text x="715" y="510" text-anchor="middle" font-family="sans-serif" font-size="16">ẑ(h) = f(z, a)</text>
  <rect x="890" y="440" width="255" height="110" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1017" y="479" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">Goal latent score</text><text x="1017" y="510" text-anchor="middle" font-family="sans-serif" font-size="16">min ||ẑ(H) − z(g)||₂</text>
  <g stroke="#475569" stroke-width="3" marker-end="url(#a)"><line x1="265" y1="495" x2="320" y2="495"/><line x1="540" y1="495" x2="595" y2="495"/><line x1="825" y1="495" x2="880" y2="495"/></g>
  <path d="M1017 560 C1017 625,160 625,160 560" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a)"/><text x="590" y="645" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6d28d9">CEM / MPPI / CMA-ES가 noise distribution을 반복 갱신</text>
</svg>
