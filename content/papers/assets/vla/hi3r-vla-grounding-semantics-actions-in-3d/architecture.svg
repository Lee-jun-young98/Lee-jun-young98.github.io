<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Hi3R-VLA 재구성 아키텍처</title>
  <desc id="desc">다중 시점 RGB-D와 언어가 SigLIP2 및 계층적 PTv3를 지나고, spatial anchor가 있는 flow-matching action expert가 multi-scale 3D 특징을 읽어 action chunk를 출력한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>.h{font:700 25px Arial,sans-serif;fill:#0f172a}.t{font:600 18px Arial,sans-serif;fill:#0f172a}.s{font:15px Arial,sans-serif;fill:#334155}.box{stroke:#334155;stroke-width:2;rx:16}.a{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="60" y="48" class="h">Hi3R-VLA — semantics와 action을 같은 3D 좌표계에 grounding</text>
  <text x="60" y="76" class="s">논문 Figure 2와 §3을 바탕으로 재구성 · 실선: 추론 흐름 · 점선: 학습 조건/감독</text>
  <rect x="55" y="130" width="190" height="105" class="box" fill="#dbeafe"/><text x="150" y="165" text-anchor="middle" class="t">다중 시점 RGB-D</text><text x="150" y="194" text-anchor="middle" class="s">보정된 image + depth</text><text x="150" y="217" text-anchor="middle" class="s">metric point cloud</text>
  <rect x="55" y="305" width="190" height="90" class="box" fill="#ede9fe"/><text x="150" y="340" text-anchor="middle" class="t">자연어 instruction</text><text x="150" y="368" text-anchor="middle" class="s">task semantics</text>
  <rect x="310" y="130" width="200" height="105" class="box" fill="#bfdbfe"/><text x="410" y="165" text-anchor="middle" class="t">Frozen SigLIP2</text><text x="410" y="194" text-anchor="middle" class="s">spatial visual token</text><text x="410" y="217" text-anchor="middle" class="s">multi-view pixel ↔ point</text>
  <rect x="310" y="305" width="200" height="90" class="box" fill="#ddd6fe"/><text x="410" y="340" text-anchor="middle" class="t">Text encoder</text><text x="410" y="368" text-anchor="middle" class="s">language embedding</text>
  <rect x="585" y="155" width="245" height="265" class="box" fill="#dcfce7"/><text x="708" y="192" text-anchor="middle" class="t">Multimodal PTv3</text><text x="708" y="222" text-anchor="middle" class="s">visual feature를 3D point에 정렬</text><text x="708" y="250" text-anchor="middle" class="s">language-conditioned AdaLN</text><rect x="625" y="278" width="165" height="42" rx="10" fill="#bbf7d0" stroke="#16a34a"/><text x="708" y="305" text-anchor="middle" class="s">coarse geometry</text><rect x="625" y="333" width="165" height="42" rx="10" fill="#86efac" stroke="#16a34a"/><text x="708" y="360" text-anchor="middle" class="s">fine geometry</text><text x="708" y="402" text-anchor="middle" class="s">multi-scale {M¹ … Mᴸ}</text>
  <rect x="585" y="500" width="245" height="100" class="box" fill="#ffedd5"/><text x="708" y="535" text-anchor="middle" class="t">Proprioception + noise</text><text x="708" y="563" text-anchor="middle" class="s">action token마다 현재</text><text x="708" y="585" text-anchor="middle" class="s">end-effector 3D anchor</text>
  <rect x="900" y="205" width="245" height="245" class="box" fill="#fee2e2"/><text x="1023" y="242" text-anchor="middle" class="t">Action expert</text><text x="1023" y="274" text-anchor="middle" class="s">conditional flow matching</text><text x="1023" y="304" text-anchor="middle" class="s">coarse → fine cross-attention</text><text x="1023" y="334" text-anchor="middle" class="s">spatial anchor + 3D RoPE</text><rect x="943" y="370" width="160" height="48" rx="12" fill="#fecaca" stroke="#dc2626"/><text x="1023" y="401" text-anchor="middle" class="t">action chunk</text>
  <path d="M245 182 H310" class="a"/><path d="M245 350 H310" class="a"/><path d="M510 182 H585" class="a"/><path d="M510 350 H585" class="a"/><path d="M830 288 H900" class="a"/><path d="M830 550 C875 550 870 410 900 380" class="a"/><path d="M510 182 C760 90 925 115 965 205" class="dash"/><path d="M510 350 C760 470 860 460 920 425" class="dash"/>
  <text x="60" y="650" class="s">학습: 정답 action velocity로 flow loss 최적화 · 추론: noise를 적분해 H-step action chunk 생성</text>
</svg>
