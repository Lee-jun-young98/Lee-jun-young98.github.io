<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Completion Aware Guidance 추론 구조</title><desc id="desc">짧은 WAM chunk에서 완료 전이가 미뤄지는 실패를 cross-attention으로 관련 instruction token을 찾아 강화해 줄인다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs><rect width="1200" height="680" rx="28" fill="#f8fafc"/><text x="60" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">Completion Aware Guidance — “그럴듯함”에서 “완료”로</text>
  <rect x="55" y="115" width="490" height="220" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="300" y="158" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">Task-incomplete imagination</text><text x="300" y="205" text-anchor="middle" font-family="sans-serif" font-size="18">짧은 video-action chunk</text><text x="300" y="242" text-anchor="middle" font-family="sans-serif" font-size="17">접근 → 잡고 유지 → 다시 유지 …</text><text x="300" y="285" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#b91c1c">release / placement 전이를 계속 미룸</text>
  <rect x="655" y="115" width="490" height="220" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="900" y="158" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">CAG sampling</text><text x="900" y="205" text-anchor="middle" font-family="sans-serif" font-size="18">cross-attention affinity 집계</text><text x="900" y="242" text-anchor="middle" font-family="sans-serif" font-size="17">관련 instruction token sparse gate</text><text x="900" y="285" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#15803d">key / value × (1 + α)</text><path d="M545 225H650" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><text x="598" y="205" text-anchor="middle" font-family="sans-serif" font-size="15">추론 개입</text>
  <rect x="75" y="415" width="245" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="198" y="455" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">Observation history</text><text x="198" y="490" text-anchor="middle" font-family="sans-serif" font-size="16">+ proprioception</text><rect x="390" y="415" width="250" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="515" y="455" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">Instruction tokens</text><text x="515" y="490" text-anchor="middle" font-family="sans-serif" font-size="16">“place … into …”</text><rect x="710" y="400" width="250" height="150" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="835" y="442" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">기존 WAM</text><text x="835" y="478" text-anchor="middle" font-family="sans-serif" font-size="16">동일 weight</text><text x="835" y="510" text-anchor="middle" font-family="sans-serif" font-size="16">동일 generator</text><rect x="1010" y="415" width="150" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1085" y="455" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700">완료 전이</text><text x="1085" y="488" text-anchor="middle" font-family="sans-serif" font-size="15">video + action</text><path d="M320 475L705 455M640 475L705 490M960 475H1005" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><text x="600" y="602" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#475569">재학습 · reward model · completion classifier 없음</text><text x="930" y="655" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">논문 Figure 1–2 및 Equation 4–8 기반 재구성</text>
</svg>
