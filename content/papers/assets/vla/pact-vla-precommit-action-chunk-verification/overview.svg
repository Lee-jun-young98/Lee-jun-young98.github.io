<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">PACT-VLA pre-commit candidate verification</title><desc id="desc">Candidates are generated from the initial observation while the robot continues executing. A newer pre-commit observation is used with FlowRes to select one complete chunk before switching.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
  <rect width="1200" height="680" fill="#f8fafc"/><text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">PACT-VLA: turn inference delay into decision time</text>
  <line x1="80" y1="590" x2="1120" y2="590" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><text x="78" y="625" font-family="Arial" font-size="18">t</text><text x="1080" y="625" font-family="Arial" font-size="18">t + d</text>
  <rect x="65" y="105" width="230" height="145" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="180" y="150" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Start observation oₜ</text><text x="180" y="190" text-anchor="middle" font-family="Arial" font-size="18">Frozen flow VLA</text><text x="180" y="222" text-anchor="middle" font-family="Arial" font-size="17">speculative generation</text>
  <path d="M295 180 H390" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect x="400" y="82" width="290" height="200" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="545" y="126" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Fixed candidate pool</text>
  <rect x="445" y="151" width="200" height="35" rx="8" fill="#ddd6fe"/><text x="545" y="175" text-anchor="middle" font-family="Arial" font-size="17">Action chunk A¹</text><rect x="445" y="195" width="200" height="35" rx="8" fill="#ddd6fe"/><text x="545" y="219" text-anchor="middle" font-family="Arial" font-size="17">A² ... Aᴺ</text><text x="545" y="259" text-anchor="middle" font-family="Arial" font-size="15" fill="#6d28d9">pool does not change</text>
  <rect x="390" y="360" width="310" height="120" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/><text x="545" y="405" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Robot keeps executing</text><text x="545" y="440" text-anchor="middle" font-family="Arial" font-size="17">previous chunk during inference</text>
  <path d="M700 420 H770" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="780" y="350" width="330" height="140" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="945" y="394" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Pre-commit observation</text><text x="945" y="429" text-anchor="middle" font-family="Arial" font-size="19">oₜ₊d₋₁ · fresher scene state</text><text x="945" y="461" text-anchor="middle" font-family="Arial" font-size="16">encoding overlaps generation</text>
  <path d="M690 180 H860 V300" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><path d="M945 350 V305" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect x="790" y="245" width="310" height="75" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="945" y="277" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Batched FlowRes scoring</text><text x="945" y="303" text-anchor="middle" font-family="Arial" font-size="16">choose minimum residual</text>
  <path d="M945 245 V175" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="830" y="90" width="230" height="85" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="945" y="125" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Commit one chunk</text><text x="945" y="153" text-anchor="middle" font-family="Arial" font-size="16">continuous switch at t+d</text>
  <path d="M180 250 V590 M545 480 V590 M945 490 V590" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="600" y="660" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Training-free · same checkpoint · no separate verifier · one complete chunk selected before execution</text>
</svg>
