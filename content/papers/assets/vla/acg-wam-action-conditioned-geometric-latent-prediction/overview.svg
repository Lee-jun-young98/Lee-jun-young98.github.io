<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ACG-WAM 행동 조건부 기하 latent 예측</title>
  <desc id="desc">현재 영상 특징과 행동 prefix가 미래 영상 쌍에서 frozen VGGT가 만든 기하 목표를 예측하고 학습 뒤 보조 모듈은 제거되는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.t{font-size:18px;font-weight:600}.s{font-size:15px;fill:#475569}.box{rx:18;stroke-width:2}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:8 7}</style></defs>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="43" text-anchor="middle" class="h">ACG-WAM: action이 만든 미래의 기하 endpoint를 학습</text>
  <text x="325" y="82" text-anchor="middle" class="t">Student / deployed policy</text><text x="895" y="82" text-anchor="middle" class="t">Training-only geometric teacher</text>
  <rect x="45" y="115" width="220" height="120" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="155" y="151" text-anchor="middle" class="t">현재 RGB Iₜ</text><text x="155" y="184" text-anchor="middle" class="s">head + two wrists</text><text x="155" y="211" text-anchor="middle" class="s">미래 frame은 보지 않음</text>
  <rect x="330" y="115" width="255" height="120" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="457" y="151" text-anchor="middle" class="t">VAE + shared patch</text><text x="457" y="183" text-anchor="middle" class="s">temporal mixing 이전</text><text x="457" y="210" text-anchor="middle" class="s">현재 특징 Zₜ</text><path d="M265 175 H330" class="arrow"/>
  <rect x="45" y="300" width="220" height="110" class="box" fill="#ffedd5" stroke="#ea580c"/><text x="155" y="338" text-anchor="middle" class="t">Action prefix Aₜ,ₖ</text><text x="155" y="370" text-anchor="middle" class="s">horizon k ∈ {1,2,4,8}</text><text x="155" y="396" text-anchor="middle" class="s">endpoint까지 kr actions</text>
  <rect x="330" y="300" width="255" height="110" class="box" fill="#fef3c7" stroke="#d97706"/><text x="457" y="338" text-anchor="middle" class="t">Adapter + predictor</text><text x="457" y="371" text-anchor="middle" class="s">(Zₜ, Aₜ,ₖ, k) → Ĵₜ,ₖ</text><path d="M457 235 V300" class="arrow"/><path d="M265 355 H330" class="arrow"/>
  <rect x="695" y="115" width="210" height="120" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="800" y="150" text-anchor="middle" class="t">현재·미래 image pair</text><text x="800" y="182" text-anchor="middle" class="s">각 camera별 [Iₜ,Iₜ₊ₖ]</text><text x="800" y="210" text-anchor="middle" class="s">학습 때만 사용</text>
  <rect x="965" y="115" width="190" height="120" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="1060" y="151" text-anchor="middle" class="t">Frozen VGGT</text><text x="1060" y="183" text-anchor="middle" class="s">future slot 선택</text><text x="1060" y="210" text-anchor="middle" class="s">joint pair attention</text><path d="M905 175 H965" class="arrow"/>
  <rect x="790" y="300" width="270" height="110" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="925" y="337" text-anchor="middle" class="t">Geometric target Jₜ,ₖ</text><text x="925" y="369" text-anchor="middle" class="s">center → pool → concatenate</text><text x="925" y="396" text-anchor="middle" class="s">3 views = 96×768 slots</text><path d="M1060 235 L970 300" class="arrow"/>
  <rect x="420" y="485" width="360" height="115" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="600" y="521" text-anchor="middle" class="t">L = Lvideo + Laction + λgeo Lgeo</text><text x="600" y="554" text-anchor="middle" class="s">예측 Ĵ와 stop-gradient J 정렬</text><text x="600" y="582" text-anchor="middle" class="s">gradient → shared patch embedding</text><path d="M457 410 L540 485" class="arrow"/><path d="M925 410 L665 485" class="arrow"/>
  <rect x="70" y="510" width="255" height="90" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="197" y="546" text-anchor="middle" class="t">Motus backbone</text><text x="197" y="576" text-anchor="middle" class="s">video + 16-action 생성</text><path d="M457 235 L260 510" class="arrow dash"/>
  <rect x="875" y="500" width="260" height="105" class="box" fill="#f1f5f9" stroke="#64748b"/><text x="1005" y="536" text-anchor="middle" class="t">추론 시 제거</text><text x="1005" y="568" text-anchor="middle" class="s">VGGT · target cache</text><text x="1005" y="592" text-anchor="middle" class="s">adapter · predictor</text><path d="M925 410 L1005 500" class="arrow dash"/>
  <text x="600" y="668" text-anchor="middle" class="s">논문 Figure 2–3을 바탕으로 재구성 · arXiv:2610.06965</text>
</svg>
