<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">TacDyn-WAM 이질적 world-action 구조 재구성</title><desc id="desc">시각 latent 미래와 촉각 dynamics 미래를 각 expert가 예측하고 현재 촉각 memory와 함께 action expert로 결합하는 구조</desc>
  <rect width="1200" height="540" fill="#f8fafc"/><style>.b{fill:#fff;stroke:#334155;stroke-width:2}.v{fill:#dbeafe;stroke:#2563eb}.tac{fill:#fae8ff;stroke:#c026d3}.mem{fill:#fef3c7;stroke:#d97706}.out{fill:#dcfce7;stroke:#16a34a}.h{font:700 25px system-ui;fill:#0f172a}.s{font:18px system-ui;fill:#334155}.a{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)}</style>
