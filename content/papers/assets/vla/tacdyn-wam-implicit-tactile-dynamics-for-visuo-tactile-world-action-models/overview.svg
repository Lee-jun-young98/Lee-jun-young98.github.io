  <rect x="390" y="300" width="335" height="145" rx="18" class="b mem"/><text x="425" y="347" class="h">Read-only memory</text><text x="425" y="387" class="s">현재 tactile state 보존</text><text x="425" y="417" class="s">key/value로만 제공</text>
