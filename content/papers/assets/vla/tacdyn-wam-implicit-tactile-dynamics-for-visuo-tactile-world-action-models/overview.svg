  <text x="45" y="55" class="h">TacDyn-WAM — modality별 미래 예측 공간 + joint attention</text>
  <rect x="45" y="115" width="250" height="125" rx="18" class="b v"/><text x="78" y="162" class="h">Visual expert</text><text x="78" y="202" class="s">미래 visual latent</text>
  <rect x="45" y="280" width="250" height="125" rx="18" class="b tac"/><text x="78" y="327" class="h">Tactile expert</text><text x="78" y="367" class="s">TacRep dynamics · multi-horizon</text>
