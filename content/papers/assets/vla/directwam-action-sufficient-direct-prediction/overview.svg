<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">DirectWAM action-sufficient distillation</title><desc id="desc">A two-stage training process learns a one-step action model and then trains a one-step future predictor through downstream action error. Deployment runs each module once.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs>
  <rect width="1200" height="680" fill="#f8fafc"/><text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">DirectWAM: preserve the future that control needs</text>
  <rect x="55" y="95" width="1090" height="205" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="85" y="135" font-family="Arial" font-size="23" font-weight="700" fill="#1d4ed8">Stage 1 · learn one-step action readout</text>
  <rect x="105" y="170" width="220" height="80" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="215" y="218" text-anchor="middle" font-family="Arial" font-size="20">Demonstrated future</text>
  <path d="M325 210 H455" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="465" y="160" width="270" height="100" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="600" y="200" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">1-step action model Gψ</text><text x="600" y="233" text-anchor="middle" font-family="Arial" font-size="17">teacher-forced future input</text>
  <path d="M735 210 H865" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="875" y="170" width="210" height="80" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="980" y="202" text-anchor="middle" font-family="Arial" font-size="19">Action loss</text><text x="980" y="230" text-anchor="middle" font-family="Arial" font-size="17">then freeze Gψ</text>
  <rect x="55" y="335" width="1090" height="240" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="85" y="375" font-family="Arial" font-size="23" font-weight="700" fill="#15803d">Stage 2 · action-sufficient future learning</text>
  <rect x="85" y="420" width="180" height="90" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="175" y="454" text-anchor="middle" font-family="Arial" font-size="19">Observation</text><text x="175" y="484" text-anchor="middle" font-family="Arial" font-size="17">instruction + state</text>
  <path d="M265 465 H355" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="365" y="410" width="220" height="110" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="475" y="451" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">1-step future Fθ</text><text x="475" y="484" text-anchor="middle" font-family="Arial" font-size="17">student latent</text>
  <path d="M585 465 H675" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="685" y="410" width="220" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="795" y="451" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Frozen Gψ</text><text x="795" y="484" text-anchor="middle" font-family="Arial" font-size="17">one evaluation</text>
  <path d="M905 465 H990" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><rect x="1000" y="420" width="110" height="90" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1055" y="454" text-anchor="middle" font-family="Arial" font-size="18">Action</text><text x="1055" y="481" text-anchor="middle" font-family="Arial" font-size="18">error</text>
  <path d="M1055 510 V548 H475 V525" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#a)"/><text x="765" y="568" text-anchor="middle" font-family="Arial" font-size="16" fill="#b91c1c">Backpropagate control consequence into future predictor</text>
  <text x="600" y="626" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0f172a">Deployment: observation → one future evaluation → one action evaluation → action chunk</text>
  <text x="600" y="657" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Optional future reconstruction anchors visual decodability</text>
</svg>
