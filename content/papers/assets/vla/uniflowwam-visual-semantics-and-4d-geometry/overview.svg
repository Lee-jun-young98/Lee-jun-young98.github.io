<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">UniFlowWAM three-expert 구조</title><desc id="desc">미래 visual feature, 3D scene flow, action의 세 expert가 joint attention으로 교류하며 역할 조건 objective를 학습하고 배포 시 action만 출력하는 구조</desc>
  <defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker></defs><rect width="1200" height="680" rx="28" fill="#f8fafc"/><text x="55" y="60" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">UniFlowWAM — visual semantics + 4D geometry + action</text><text x="55" y="96" font-family="sans-serif" font-size="17" fill="#475569">논문 Figure 1 · Sections 3.3–3.5 기반 재구성</text>
  <g font-family="sans-serif"><rect x="55" y="250" width="230" height="120" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170" y="295" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">현재 context</text><text x="170" y="330" text-anchor="middle" font-size="17" fill="#1e40af">관측 · 언어 · 상태</text>
  <rect x="380" y="120" width="255" height="120" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="507" y="162" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95">Visual expert</text><text x="507" y="198" text-anchor="middle" font-size="17" fill="#5b21b6">future DINO semantics</text>
  <rect x="380" y="280" width="255" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="507" y="322" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">3D Flow expert</text><text x="507" y="358" text-anchor="middle" font-size="17" fill="#166534">scene displacement latent</text>
  <rect x="380" y="440" width="255" height="120" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="507" y="482" text-anchor="middle" font-size="20" font-weight="700" fill="#7f1d1d">Action expert</text><text x="507" y="518" text-anchor="middle" font-size="17" fill="#991b1b">robot action latent</text>
  <rect x="750" y="200" width="320" height="220" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="910" y="252" text-anchor="middle" font-size="23" font-weight="700" fill="#9a3412">Joint Attention DiT</text><text x="910" y="295" text-anchor="middle" font-size="17" fill="#9a3412">세 expert token이 정보 교환</text><text x="910" y="335" text-anchor="middle" font-size="17" fill="#9a3412">10개 role-conditioned objective</text><text x="910" y="375" text-anchor="middle" font-size="16" fill="#9a3412">target · condition · absent</text>
  <rect x="770" y="495" width="320" height="100" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="930" y="535" text-anchor="middle" font-size="20" font-weight="700" fill="#075985">배포: direct policy</text><text x="930" y="570" text-anchor="middle" font-size="17" fill="#075985">flow 입력 없이 context → action</text></g>
  <g stroke="#334155" stroke-width="3" marker-end="url(#b)"><line x1="285" y1="310" x2="375" y2="180"/><line x1="285" y1="310" x2="375" y2="340"/><line x1="285" y1="310" x2="375" y2="500"/><line x1="635" y1="180" x2="745" y2="250"/><line x1="635" y1="340" x2="745" y2="310"/><line x1="635" y1="500" x2="745" y2="370"/><line x1="910" y1="420" x2="930" y2="490"/></g><text x="55" y="640" font-family="sans-serif" font-size="16" fill="#475569">학습: 실제 flow/future/action을 역할별로 공동 denoise · 추론: flow와 future slot은 learned placeholder</text>
