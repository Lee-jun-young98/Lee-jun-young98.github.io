<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">VLA-ZO 고정 prefix 상태 재사용 구조</title><desc id="desc">demonstration 입력을 frozen vision-language prefix로 한 번 인코딩하고 conditioning state를 ZO probe와 update 사이에 재사용하며 다음 batch를 prefetch하는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.t{font-size:18px}.s{font-size:15px;fill:#475569}.box{rx:18;stroke-width:2}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="680" fill="#f8fafc"/><text x="600" y="50" text-anchor="middle" class="h">VLA-ZO: frozen conditioning을 재사용하는 forward-only 적응</text>
  <rect x="45" y="115" width="225" height="120" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="157" y="154" text-anchor="middle" class="t">1-shot target data</text><text x="157" y="186" text-anchor="middle" class="s">image · proprioception</text><text x="157" y="212" text-anchor="middle" class="s">language · action</text>
  <rect x="335" y="105" width="265" height="140" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="468" y="150" text-anchor="middle" class="t">Frozen V-L Prefix fφ</text><text x="468" y="184" text-anchor="middle" class="s">각 observation당 1회 계산</text><text x="468" y="213" text-anchor="middle" class="s">hᵢ = KV / hidden state</text><path d="M270 175H335" class="arrow"/>
  <rect x="675" y="85" width="245" height="180" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="797" y="127" text-anchor="middle" class="t">Persistent state cache</text><text x="797" y="160" text-anchor="middle" class="s">within-step: 2q probe 공유</text><text x="797" y="191" text-anchor="middle" class="s">across-step: 재방문 공유</text><text x="797" y="222" text-anchor="middle" class="s">disk → host → device</text><path d="M600 175H675" class="arrow"/>
  <rect x="960" y="105" width="200" height="140" class="box" fill="#fef3c7" stroke="#d97706"/><text x="1060" y="148" text-anchor="middle" class="t">Schedule-aware</text><text x="1060" y="178" text-anchor="middle" class="t">prefetch</text><text x="1060" y="212" text-anchor="middle" class="s">다음 minibatch 준비</text><path d="M920 175H960" class="arrow"/>
  <rect x="270" y="365" width="650" height="175" class="box" fill="#ffedd5" stroke="#ea580c"/><text x="595" y="405" text-anchor="middle" class="t">Action-side Zeroth-Order update</text><text x="595" y="438" text-anchor="middle" class="s">LoRA λ에 q개 방향 zⱼ · 각 방향 ±εzⱼ forward</text><text x="595" y="470" text-anchor="middle" class="s">고정 hᵢ + perturbed action expert gψ(λ±εzⱼ)</text><text x="595" y="504" text-anchor="middle" class="s">finite difference 평균 → λ 갱신 (backward graph 없음)</text>
  <path d="M797 265V365" class="arrow"/><path d="M1060 245 C1060 330 940 330 850 365" class="arrow"/>
  <rect x="970" y="390" width="190" height="125" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="1065" y="428" text-anchor="middle" class="t">Adapted action</text><text x="1065" y="458" text-anchor="middle" class="t">module</text><text x="1065" y="488" text-anchor="middle" class="s">현장 추론에 사용</text><path d="M920 452H970" class="arrow"/>
  <text x="595" y="585" text-anchor="middle" class="s">제거되는 중복: prefix 2qBT회 → 고유 observation N회</text><text x="595" y="615" text-anchor="middle" class="s">유지되는 계산: action expert의 2qBT probe</text><text x="600" y="660" text-anchor="middle" class="s">논문 Figure 3을 바탕으로 재구성 · arXiv:2610.06271</text>
</svg>
