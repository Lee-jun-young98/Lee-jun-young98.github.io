<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">RAVEL asynchronous inference reconstruction</title>
  <desc id="desc">Slow VLM context encoding runs asynchronously while a fast observation path and rolling denoising buffer continuously produce actions.</desc>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">RAVEL: overlap slow semantics with fast control</text>
  <g font-family="Arial, sans-serif">
    <text x="70" y="125" font-size="18" font-weight="700" fill="#334155">Slow context lane</text>
    <rect x="230" y="92" width="270" height="78" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="365" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">VLM encoding worker</text>
    <rect x="610" y="92" width="250" height="78" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="735" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">Latest context + age</text>
    <text x="70" y="270" font-size="18" font-weight="700" fill="#334155">Fast control lane</text>
    <rect x="230" y="225" width="270" height="90" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="365" y="262" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">Fast Observation Path</text>
    <text x="365" y="292" text-anchor="middle" font-size="16" fill="#166534">current visual + proprioception</text>
    <rect x="610" y="225" width="300" height="90" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="760" y="262" text-anchor="middle" font-size="20" font-weight="700" fill="#78350f">Rolling action buffer</text>
    <text x="760" y="292" text-anchor="middle" font-size="16" fill="#92400e">one denoise step per control tick</text>
    <rect x="995" y="225" width="145" height="90" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="1067" y="262" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95">Robot</text>
    <text x="1067" y="292" text-anchor="middle" font-size="16" fill="#5b21b6">next action</text>
    <g stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)">
      <path d="M500 131 H595"/><path d="M735 170 V208"/><path d="M500 270 H595"/><path d="M910 270 H980"/>
    </g>
    <rect x="230" y="405" width="680" height="80" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="570" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">future slots are refined progressively</text>
    <text x="570" y="468" text-anchor="middle" font-size="16" fill="#475569">release nearest action · shift buffer · append noisy future action</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
</svg>
