<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">TempoBridge 구조 재구성</title><desc id="desc">언어 tempo prototype, 시각 상태 causal phase router, action translation modulation으로 이어지는 흐름</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect width="1200" height="560" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">TempoBridge: 언어의 속도 지시를 frozen VLA 실행에 연결</text>
  <rect x="40" y="110" width="250" height="310" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="165" y="148" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Tempo readout</text><rect x="75" y="185" width="180" height="70" rx="10" fill="white" stroke="#38bdf8"/><text x="165" y="212" text-anchor="middle" font-family="sans-serif" font-size="15">instruction residual</text><text x="165" y="235" text-anchor="middle" font-family="sans-serif" font-size="14">FAST / SLOW prototype</text><path d="M165 255 V300" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><rect x="75" y="310" width="180" height="66" rx="10" fill="#bae6fd" stroke="#0284c7"/><text x="165" y="337" text-anchor="middle" font-family="sans-serif" font-size="15">cached sequence</text><text x="165" y="359" text-anchor="middle" font-family="sans-serif" font-size="14">[Fast → Slow]</text>
  <path d="M290 265 H360" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect x="375" y="110" width="250" height="310" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="500" y="148" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Causal phase router</text><rect x="410" y="185" width="180" height="70" rx="10" fill="white" stroke="#a78bfa"/><text x="500" y="212" text-anchor="middle" font-family="sans-serif" font-size="15">재사용 visual feature</text><text x="500" y="235" text-anchor="middle" font-family="sans-serif" font-size="14">+ robot-state history</text><path d="M500 255 V300" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><rect x="410" y="310" width="180" height="66" rx="10" fill="#ddd6fe" stroke="#7c3aed"/><text x="500" y="337" text-anchor="middle" font-family="sans-serif" font-size="15">GRU hazard → Fᵣ</text><text x="500" y="359" text-anchor="middle" font-family="sans-serif" font-size="14">Event 1 → Event 2</text>
  <path d="M625 265 H695" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect x="710" y="110" width="250" height="310" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="835" y="148" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Action modulation</text><rect x="745" y="185" width="180" height="70" rx="10" fill="white" stroke="#4ade80"/><text x="835" y="212" text-anchor="middle" font-family="sans-serif" font-size="15">frozen π0.5</text><text x="835" y="235" text-anchor="middle" font-family="sans-serif" font-size="14">nominal action chunk</text><path d="M835 255 V300" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><rect x="745" y="310" width="180" height="66" rx="10" fill="#bbf7d0" stroke="#16a34a"/><text x="835" y="337" text-anchor="middle" font-family="sans-serif" font-size="15">translation × α</text><text x="835" y="359" text-anchor="middle" font-family="sans-serif" font-size="14">1.3 / 1.0 / 0.7</text>
  <path d="M960 265 H1030" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect x="1045" y="175" width="120" height="180" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1105" y="220" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">Robot</text><text x="1105" y="262" text-anchor="middle" font-family="sans-serif" font-size="15">빠르게 집고</text><text x="1105" y="290" text-anchor="middle" font-family="sans-serif" font-size="15">천천히 놓기</text><text x="1105" y="325" text-anchor="middle" font-family="sans-serif" font-size="13">closed-loop replan</text>
  <text x="600" y="485" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">언어 readout은 instruction당 1회, phase router와 action modulation은 매 replan마다 실행된다.</text>
</svg>
