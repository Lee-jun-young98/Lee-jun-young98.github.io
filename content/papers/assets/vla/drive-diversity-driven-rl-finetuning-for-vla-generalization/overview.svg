<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">DRIVE 성공 조건 다양성 보상 구조 재구성</title><desc id="desc">같은 조건의 rollout을 feature trajectory로 바꾸고 시간 정렬한 뒤 성공한 행동 다양성만 보상해 PPO를 갱신하는 흐름</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect width="1200" height="560" rx="24" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">DRIVE: 성공 영역 안의 여러 해법을 보상</text>
  <rect x="40" y="105" width="240" height="310" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="160" y="142" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Matched rollout group</text>
  <path d="M75 205 C120 155 170 245 235 180" fill="none" stroke="#16a34a" stroke-width="6"/><path d="M75 275 C130 335 175 220 235 315" fill="none" stroke="#22c55e" stroke-width="6"/><path d="M75 355 C130 300 180 400 235 345" fill="none" stroke="#ef4444" stroke-width="6"/><text x="160" y="390" text-anchor="middle" font-family="sans-serif" font-size="14">같은 task · initial state</text>
  <path d="M280 260 H350" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect x="365" y="105" width="240" height="310" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="485" y="142" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Feature trajectories</text><rect x="400" y="180" width="170" height="62" rx="10" fill="white" stroke="#a78bfa"/><text x="485" y="208" text-anchor="middle" font-family="sans-serif" font-size="16">VLM feature</text><text x="485" y="230" text-anchor="middle" font-family="sans-serif" font-size="14">per decision</text><path d="M485 242 V290" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><rect x="400" y="300" width="170" height="62" rx="10" fill="#ddd6fe" stroke="#7c3aed"/><text x="485" y="326" text-anchor="middle" font-family="sans-serif" font-size="16">GAK alignment</text><text x="485" y="348" text-anchor="middle" font-family="sans-serif" font-size="14">실행 속도 차이 정렬</text>
  <path d="M605 260 H675" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect x="690" y="105" width="240" height="310" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="810" y="142" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Diversity potential</text><text x="810" y="205" text-anchor="middle" font-family="sans-serif" font-size="17">성공 y=1</text><text x="810" y="232" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#15803d">다른 유효 전략 → bonus</text><line x1="735" y1="262" x2="885" y2="262" stroke="#86efac" stroke-width="2"/><text x="810" y="310" text-anchor="middle" font-family="sans-serif" font-size="17">실패 y=0</text><text x="810" y="337" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#b91c1c">다양해도 bonus 없음</text>
  <path d="M930 260 H1000" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect x="1015" y="150" width="150" height="220" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1090" y="194" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">PPO / RFT</text><text x="1090" y="245" text-anchor="middle" font-family="sans-serif" font-size="15">환경 reward</text><text x="1090" y="273" text-anchor="middle" font-family="sans-serif" font-size="22">+</text><text x="1090" y="305" text-anchor="middle" font-family="sans-serif" font-size="15">성공 다양성</text><text x="1090" y="333" text-anchor="middle" font-family="sans-serif" font-size="15">reward</text>
  <text x="600" y="485" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">학습 때만 pairwise 비교하며, 배포 추론에는 추가 모듈이 필요 없다.</text>
</svg>
