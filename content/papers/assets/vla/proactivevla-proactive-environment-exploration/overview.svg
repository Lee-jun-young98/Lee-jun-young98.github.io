<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ProactiveVLA 능동 탐색과 전역 기억 파이프라인</title>
  <desc id="desc">초기 과제 뒤 남은 예산으로 세 단계 환경 탐색을 하고 독립 검증과 증거 심사를 거쳐 전역 기억을 만든 후 frozen VLA 실행을 안내하는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.t{font-size:18px;font-weight:600}.s{font-size:15px;fill:#475569}.box{rx:18;stroke-width:2}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:8 7}</style></defs>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="44" text-anchor="middle" class="h">ProactiveVLA: 남은 상호작용 예산을 재사용 가능한 환경 지식으로</text>
  <rect x="45" y="105" width="230" height="120" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="160" y="143" text-anchor="middle" class="t">Reference scene</text><text x="160" y="175" text-anchor="middle" class="s">주어진 초기 과제 시도</text><text x="160" y="202" text-anchor="middle" class="s">전체 execution 보존</text>
  <rect x="335" y="85" width="290" height="160" class="box" fill="#ffedd5" stroke="#ea580c"/><text x="480" y="121" text-anchor="middle" class="t">남은 예산: 3-level 탐색</text><text x="480" y="154" text-anchor="middle" class="s">L1 물체 affordance</text><text x="480" y="182" text-anchor="middle" class="s">L2 상태 변화 interaction</text><text x="480" y="210" text-anchor="middle" class="s">L3 검증된 interaction 조합</text><path d="M275 165 H335" class="arrow"/>
  <rect x="690" y="105" width="230" height="120" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="805" y="143" text-anchor="middle" class="t">독립 visual checker</text><text x="805" y="176" text-anchor="middle" class="s">before/after evidence</text><text x="805" y="203" text-anchor="middle" class="s">성공 · 실패 · 불확실</text><path d="M625 165 H690" class="arrow"/>
  <rect x="970" y="105" width="190" height="120" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="1065" y="143" text-anchor="middle" class="t">계속 탐색·복구</text><text x="1065" y="176" text-anchor="middle" class="s">feedback로 전략 변경</text><text x="1065" y="203" text-anchor="middle" class="s">reset은 예외적</text><path d="M920 165 H970" class="arrow"/><path d="M1065 225 C1065 275 480 280 480 245" class="arrow dash"/>
  <rect x="85" y="340" width="230" height="115" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="200" y="376" text-anchor="middle" class="t">Lossless archive</text><text x="200" y="408" text-anchor="middle" class="s">action evidence + 판정</text><text x="200" y="435" text-anchor="middle" class="s">실패·recovery도 유지</text><path d="M805 225 L300 340" class="arrow"/>
  <rect x="365" y="340" width="245" height="115" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="487" y="376" text-anchor="middle" class="t">Memory induction</text><text x="487" y="408" text-anchor="middle" class="s">experience atomization</text><text x="487" y="435" text-anchor="middle" class="s">scene 내부 → scene 간 종합</text><path d="M315 397 H365" class="arrow"/>
  <rect x="660" y="340" width="235" height="115" class="box" fill="#fef3c7" stroke="#d97706"/><text x="777" y="376" text-anchor="middle" class="t">Evidence review</text><text x="777" y="408" text-anchor="middle" class="s">후보 규칙과 기록 대조</text><text x="777" y="435" text-anchor="middle" class="s">지원된 규칙만 승인</text><path d="M610 397 H660" class="arrow"/>
  <rect x="945" y="340" width="215" height="115" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="1052" y="376" text-anchor="middle" class="t">Frozen global memory</text><text x="1052" y="408" text-anchor="middle" class="s">조건 · evidence</text><text x="1052" y="435" text-anchor="middle" class="s">실패 모드 · recovery</text><path d="M895 397 H945" class="arrow"/>
  <rect x="235" y="545" width="260" height="100" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="365" y="580" text-anchor="middle" class="t">새 평가 과제 + 관찰</text><text x="365" y="613" text-anchor="middle" class="s">LIBERO-Pro / RoboCasa365</text>
  <rect x="600" y="525" width="350" height="120" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="775" y="562" text-anchor="middle" class="t">High-level agent + frozen VLA</text><text x="775" y="595" text-anchor="middle" class="s">memory로 action-level 지시 구성</text><text x="775" y="622" text-anchor="middle" class="s">robot primitives로 실행</text><path d="M495 595 H600" class="arrow"/><path d="M1052 455 L865 525" class="arrow"/>
  <text x="600" y="678" text-anchor="middle" class="s">논문 Figure 1을 바탕으로 재구성 · arXiv:2610.06999</text>
</svg>
