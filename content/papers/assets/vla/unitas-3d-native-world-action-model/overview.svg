<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">UNITAS 3D-native world-action 구조</title>
  <desc id="desc">다중 시점 관측과 로봇 또는 손, 장면 궤적을 공통 metric 3D frame과 physical time으로 표현하고 두 transformer expert가 행동과 scene flow를 생성한다.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker></defs>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <text x="55" y="58" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">UNITAS — 하나의 metric 3D frame에서 action과 world를 모델링</text>
  <rect x="45" y="105" width="235" height="230" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="162" y="142" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Inputs</text><g font-family="sans-serif" font-size="16" fill="#1e3a8a"><text x="75" y="184">• multi-view RGB(/D)</text><text x="75" y="217">• camera calibration</text><text x="75" y="250">• language instruction</text><text x="75" y="283">• proprioception/history</text></g>
  <rect x="345" y="105" width="245" height="230" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="467" y="142" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">3D-native tokens</text><g font-family="sans-serif" font-size="16" fill="#14532d"><text x="375" y="184">world-aligned visual</text><text x="375" y="217">action flow: hand/gripper</text><text x="375" y="250">scene flow: environment</text><text x="375" y="283">physical time (seconds)</text></g>
  <rect x="655" y="90" width="500" height="260" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="905" y="128" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700">Layer-coupled Mixture-of-Transformers</text>
  <rect x="700" y="165" width="185" height="115" rx="16" fill="#fff"/><text x="792" y="200" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">Point dynamics</text><text x="792" y="230" text-anchor="middle" font-family="sans-serif" font-size="15">action flow A</text><text x="792" y="255" text-anchor="middle" font-family="sans-serif" font-size="15">scene flow S</text>
  <rect x="930" y="165" width="180" height="115" rx="16" fill="#fff"/><text x="1020" y="200" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">Action expert</text><text x="1020" y="230" text-anchor="middle" font-family="sans-serif" font-size="15">end-effector</text><text x="1020" y="255" text-anchor="middle" font-family="sans-serif" font-size="15">chunk u</text>
  <line x1="280" y1="220" x2="335" y2="220" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><line x1="590" y1="220" x2="645" y2="220" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><line x1="885" y1="223" x2="920" y2="223" stroke="#7c3aed" stroke-width="3" marker-end="url(#a)"/><line x1="930" y1="245" x2="895" y2="245" stroke="#7c3aed" stroke-width="3" marker-end="url(#a)"/>
  <text x="55" y="410" font-family="sans-serif" font-size="24" font-weight="700" fill="#0f172a">두 가지 추론 모드</text>
  <rect x="100" y="455" width="430" height="135" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="315" y="495" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700">Policy mode</text><text x="315" y="530" text-anchor="middle" font-family="sans-serif" font-size="16">action expert만 실행 → executable u</text><text x="315" y="558" text-anchor="middle" font-family="sans-serif" font-size="15">future flow token 생략</text>
  <rect x="670" y="455" width="430" height="135" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="885" y="495" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700">Simulator mode</text><text x="885" y="530" text-anchor="middle" font-family="sans-serif" font-size="16">generated / external A → scene flow S</text><text x="885" y="558" text-anchor="middle" font-family="sans-serif" font-size="15">action-conditioned 3D world prediction</text>
  <path d="M1020 350 C1020 400,315 400,315 445" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M792 350 C792 405,885 405,885 445" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <text x="600" y="640" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">같은 world-coordinate anchor와 second-based tokenizer가 embodiment·dataset 간 표현을 통일</text>
</svg>
