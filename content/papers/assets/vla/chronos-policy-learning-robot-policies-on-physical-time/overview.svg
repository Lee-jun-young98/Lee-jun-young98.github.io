<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Chronos Policy physical-time architecture</title><desc id="desc">Asynchronous sensor and future action tokens carry physical timestamps into time-aware rotary attention and a diffusion transformer.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><rect width="1200" height="420" rx="24" fill="#f8fafc"/><text x="600" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">Chronos Policy — sequence index 대신 physical time</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="35" y="80" width="235" height="225" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="153" y="116" font-size="18" font-weight="700">비동기 입력 token</text><text x="153" y="154" font-size="14">RGB @ -120 ms</text><text x="153" y="182" font-size="14">pose @ -35 ms</text><text x="153" y="210" font-size="14">force @ -8 ms</text><text x="153" y="250" font-size="14">noisy action @ +dₜ+jΔt</text><text x="153" y="280" font-size="12" fill="#475569">각 token이 실제 시각을 보존</text><rect x="345" y="95" width="230" height="195" rx="16" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/><text x="460" y="136" font-size="18" font-weight="700">Time-aware RoPE</text><text x="460" y="174" font-size="15">q̃ᵢ = R(tᵢ)qᵢ</text><text x="460" y="204" font-size="15">k̃ⱼ = R(tⱼ)kⱼ</text><text x="460" y="244" font-size="13">attention ∝ elapsed time</text><text x="460" y="268" font-size="13">tⱼ − tᵢ</text><rect x="650" y="95" width="220" height="195" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="760" y="136" font-size="18" font-weight="700">Diffusion Transformer</text><text x="760" y="175" font-size="14">내용 embedding과</text><text x="760" y="201" font-size="14">시간 좌표를 분리</text><text x="760" y="240" font-size="14">clean-action prediction</text><text x="760" y="266" font-size="13">L1 diffusion objective</text><rect x="950" y="120" width="200" height="145" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1050" y="160" font-size="18" font-weight="700">출력 action chunk</text><text x="1050" y="198" font-size="14">요청 execution time</text><text x="1050" y="226" font-size="14">t+dₜ+jΔt</text></g>
  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M270 192H337"/><path d="M575 192H642"/><path d="M870 192H942"/></g><rect x="275" y="335" width="650" height="48" rx="12" fill="#fff" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/><text x="600" y="365" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#92400e">학습: modality별 rate·delay와 action start delay를 randomize하되 timestamp 유지</text><text x="1160" y="400" text-anchor="end" font-family="sans-serif" font-size="12" fill="#64748b">논문 Figure 2 기반 재구성</text>
</svg>
