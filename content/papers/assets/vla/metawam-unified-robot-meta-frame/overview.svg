<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">MetaWAM DCT meta-frame 구조 재구성</title><desc id="desc">현재 proprioception과 task type은 input meta-frame에, action과 미래 proprioception과 value는 output meta-frame의 분리된 DCT 주파수 대역에 배치되며, Cosmos video diffusion denoiser가 카메라 latent와 함께 처리한다.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><style>.t{font-family:'Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:19px;font-weight:700}.s{font-size:15px}.box{rx:16;ry:16;stroke-width:2}.arr{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}.input{fill:#eff6ff;stroke:#2563eb}.freq{fill:#f5f3ff;stroke:#7c3aed}.vdm{fill:#ecfdf5;stroke:#059669}.out{fill:#fff7ed;stroke:#ea580c}.train{fill:#fff1f2;stroke:#e11d48}.note{fill:#f8fafc;stroke:#94a3b8}</style></defs>
  <rect width="1200" height="680" fill="#fff"/><text x="45" y="46" class="t h">MetaWAM: robot signal을 주파수 대역으로 multiplexing</text><text x="80" y="74" class="t s">Figure 3와 Equations (1)–(6)을 바탕으로 재구성 · 11 frame → 8 frame</text>
  <rect x="35" y="120" width="190" height="125" class="box input"/><text x="130" y="155" text-anchor="middle" class="t m">현재 입력</text><text x="130" y="184" text-anchor="middle" class="t s">task type + proprio</text><text x="130" y="211" text-anchor="middle" class="t s">language instruction</text><text x="130" y="232" text-anchor="middle" class="t s">3-camera video</text>
  <rect x="285" y="105" width="255" height="160" class="box freq"/><text x="412" y="141" text-anchor="middle" class="t m">Input Meta-Frame</text><text x="412" y="171" text-anchor="middle" class="t s">정규화 signal → 고정 DCT slot</text><text x="412" y="197" text-anchor="middle" class="t s">서로 겹치지 않는 channel band</text><text x="412" y="227" text-anchor="middle" class="t s">2D inverse DCT → smooth latent</text><text x="412" y="250" text-anchor="middle" class="t s">분석적 encoding, learned encoder 없음</text>
  <rect x="605" y="110" width="315" height="155" class="box vdm"/><text x="762" y="148" text-anchor="middle" class="t m">8-frame Cosmos VDM</text><text x="762" y="180" text-anchor="middle" class="t s">input meta + 현재 camera 3</text><text x="762" y="206" text-anchor="middle" class="t s">output meta + 미래 camera 3</text><text x="762" y="235" text-anchor="middle" class="t s">slot-aware mask + diffusion denoising</text>
  <rect x="980" y="105" width="185" height="160" class="box freq"/><text x="1072" y="141" text-anchor="middle" class="t" style="font-size:17px;font-weight:700">Output Meta-Frame</text><text x="1072" y="174" text-anchor="middle" class="t s">Action band</text><text x="1072" y="199" text-anchor="middle" class="t s">Future proprio band</text><text x="1072" y="224" text-anchor="middle" class="t s">Value band</text><text x="1072" y="249" text-anchor="middle" class="t s">DCT로 직접 readout</text>
  <rect x="905" y="355" width="260" height="150" class="box out"/><text x="1035" y="392" text-anchor="middle" class="t m">Policy / World / Value</text><text x="1035" y="424" text-anchor="middle" class="t s">action chunk 출력</text><text x="1035" y="451" text-anchor="middle" class="t s">미래 video·state 예측</text><text x="1035" y="478" text-anchor="middle" class="t s">value 예측</text>
  <rect x="285" y="350" width="255" height="155" class="box train"/><text x="412" y="387" text-anchor="middle" class="t m">학습 objective</text><text x="412" y="419" text-anchor="middle" class="t s">diffusion denoising loss</text><text x="412" y="446" text-anchor="middle" class="t s">action + proprio + value Huber</text><text x="412" y="473" text-anchor="middle" class="t s">off-band coefficient penalty</text>
  <rect x="605" y="350" width="245" height="155" class="box note"/><text x="727" y="387" text-anchor="middle" class="t m">왜 DCT인가?</text><text x="727" y="419" text-anchor="middle" class="t s">frozen VDM이 덜 수정하는</text><text x="727" y="446" text-anchor="middle" class="t s">natural-video-compatible latent</text><text x="727" y="473" text-anchor="middle" class="t s">decoder 없이 signal 보존</text>
  <path d="M225 182H285" class="arr"/><path d="M540 185H605" class="arr"/><path d="M920 185H980" class="arr"/><path d="M1072 265V355" class="arr"/><path d="M412 350V265" class="arr dash" style="stroke:#e11d48"/><path d="M540 425H605" class="arr dash"/><path d="M850 425H905" class="arr dash"/>
  <rect x="35" y="565" width="1130" height="75" rx="14" fill="#f1f5f9"/><text x="600" y="596" text-anchor="middle" class="t m">기존 방식과의 차이</text><text x="600" y="624" text-anchor="middle" class="t s">signal마다 image-sized frame을 복제하지 않고, 두 meta-frame의 고정 주파수 slot으로 통합 → attention pair 약 47% 감소</text>
</svg>
