<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Backtrack recovery control loop</title><desc id="desc">A frozen VLA produces actions and internal features. A failure head chooses normal execution or reverse replay from a motion buffer, then returns control to the same policy.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.t{font-size:20px;font-weight:700}.s{font-size:16px}.box{rx:18;stroke-width:2}</style></defs>
  <rect width="1200" height="680" fill="#f8fafc"/><text x="60" y="58" class="h">Backtrack: detect → retreat → retry</text>
  <rect class="box" x="55" y="200" width="215" height="140" fill="#e0f2fe" stroke="#0284c7"/><text x="95" y="245" class="t">관측</text><text x="95" y="282" class="s">image · instruction</text><text x="95" y="312" class="s">robot state</text>
  <rect class="box" x="345" y="160" width="265" height="210" fill="#ede9fe" stroke="#7c3aed"/><text x="400" y="205" class="t">Frozen VLA</text><text x="390" y="250" class="s">policy action proposal</text><text x="390" y="290" class="s">internal post feature</text><text x="390" y="332" class="s">weight update 없음</text>
  <rect class="box" x="690" y="95" width="250" height="135" fill="#fef3c7" stroke="#d97706"/><text x="730" y="138" class="t">Failure head</text><text x="730" y="177" class="s">p(failure) &gt; threshold?</text>
  <rect class="box" x="690" y="305" width="250" height="135" fill="#dcfce7" stroke="#16a34a"/><text x="735" y="348" class="t">정상 실행</text><text x="725" y="387" class="s">action 실행 + motion 저장</text>
  <rect class="box" x="690" y="505" width="250" height="120" fill="#fee2e2" stroke="#dc2626"/><text x="735" y="548" class="t">Backtrack</text><text x="725" y="586" class="s">buffer 역재생 → retry</text>
  <rect class="box" x="1010" y="330" width="140" height="120" fill="#fff" stroke="#64748b"/><text x="1030" y="375" class="t">Motion</text><text x="1035" y="407" class="s">buffer</text>
  <path d="M270 270 H340" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M610 245 C650 245 650 165 685 165" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M610 315 H685" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M815 230 V300" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/><text x="830" y="270" class="s">아니오</text><path d="M940 165 C990 165 980 565 945 565" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#a)"/><text x="995" y="225" class="s">예</text><path d="M940 372 H1005" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M1010 420 C975 450 970 535 945 555" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M690 585 C525 650 180 615 160 345" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a)"/>
  <text x="55" y="650" class="s">논문 Figure 1 및 Sections 3.1–3.2를 바탕으로 재구성 · 원문: arXiv:2610.32941</text>
