<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Divide-and-Remember 재구성 구조도</title>
  <desc id="desc">긴 과거 token을 동일한 선택기가 반복적으로 2K에서 K로 줄여 고정 크기 행동 관련 기억을 만드는 재귀 구조</desc>
