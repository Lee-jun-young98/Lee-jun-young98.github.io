<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AFCE two-stage effect learning architecture</title><desc id="desc">Stage one constructs effect targets from actions, robot responses, and visual transitions. Stage two predicts effects from current observations and decodes them into actions.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7c3aed"/></marker><style>text{font-family:Arial,sans-serif;fill:#111827}.h{font-size:26px;font-weight:700}.b{font-size:20px;font-weight:700}.s{font-size:17px}.box{rx:18;stroke-width:3}.violet{fill:#f5f3ff;stroke:#7c3aed}.blue{fill:#eff6ff;stroke:#2563eb}.green{fill:#ecfdf5;stroke:#059669}.gray{fill:#f3f4f6;stroke:#6b7280}</style></defs>
  <rect width="1200" height="650" fill="white"/><text x="50" y="45" class="h">AFCE — learn a future-grounded Effect, then act</text>
  <text x="50" y="92" class="b">Stage I · offline target construction</text>
  <rect x="45" y="120" width="205" height="115" class="box blue"/><text x="148" y="154" text-anchor="middle" class="s">Actions Aₜ</text><text x="148" y="184" text-anchor="middle" class="s">Robot response ΔSₜ</text><text x="148" y="214" text-anchor="middle" class="s">Visual change Vₜ</text>
  <rect x="330" y="120" width="235" height="115" class="box violet"/><text x="448" y="164" text-anchor="middle" class="b">Effect tokenizer</text><text x="448" y="198" text-anchor="middle" class="s">Tφ(A, ΔS, V)</text>
  <rect x="645" y="120" width="235" height="115" class="box green"/><text x="763" y="162" text-anchor="middle" class="b">Effect target E*</text><text x="763" y="195" text-anchor="middle" class="s">30 × 256 ordered tokens</text>
  <rect x="960" y="120" width="195" height="115" class="box gray"/><text x="1058" y="158" text-anchor="middle" class="s">reconstruct action</text><text x="1058" y="187" text-anchor="middle" class="s">state + visual change</text><text x="1058" y="215" text-anchor="middle" class="s">freeze &amp; cache</text>
  <path d="M250 178 H320" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/><path d="M565 178 H635" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/><path d="M880 178 H950" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>
  <line x1="45" y1="285" x2="1155" y2="285" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="50" y="332" class="b">Stage II · policy learning and deployment</text>
  <rect x="45" y="365" width="230" height="120" class="box blue"/><text x="160" y="404" text-anchor="middle" class="s">Current images Iₜ</text><text x="160" y="434" text-anchor="middle" class="s">instruction ℓ</text><text x="160" y="464" text-anchor="middle" class="s">robot state sₜ</text>
  <rect x="355" y="365" width="240" height="120" class="box violet"/><text x="475" y="407" text-anchor="middle" class="b">Flow-matching VLA</text><text x="475" y="443" text-anchor="middle" class="s">predict normalized Effect Z</text>
  <rect x="675" y="365" width="220" height="120" class="box violet"/><text x="785" y="407" text-anchor="middle" class="b">Action decoder</text><text x="785" y="443" text-anchor="middle" class="s">Dψ(E, sₜ)</text>
  <rect x="975" y="365" width="180" height="120" class="box green"/><text x="1065" y="410" text-anchor="middle" class="b">Action chunk</text><text x="1065" y="445" text-anchor="middle" class="s">closed-loop control</text>
  <path d="M275 425 H345" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/><path d="M595 425 H665" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/><path d="M895 425 H965" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>
  <path d="M763 245 C763 310 555 315 505 355" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="650" y="320" class="s">fixed training target only</text>
  <text x="50" y="555" class="s">Deployment uses only current observations. Future evidence is used to define what the policy should predict, not as an online input.</text><text x="50" y="590" class="s">Embodiment-specific interfaces surround a shared Effect space for single-arm and bimanual control.</text>
</svg>
