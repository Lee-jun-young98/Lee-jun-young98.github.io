<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">UniW(A)M 다중 world-action interface와 adaptive routing</title>
  <desc id="desc">공유 diffusion Transformer와 역할별 experts가 AC-WM 및 네 WAM interface를 공동 학습하고 PAIR가 배포 시 chunk마다 action interface를 선택한다</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.t{font-size:19px;font-weight:700}.s{font-size:15px}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb}.green{fill:#dcfce7;stroke:#16a34a}.amber{fill:#fef3c7;stroke:#d97706}.violet{fill:#ede9fe;stroke:#7c3aed}.pink{fill:#fce7f3;stroke:#db2777}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="680" fill="#fff"/><text x="45" y="48" class="h">UniW(A)M: 하나의 dynamics backbone, 다섯 interface, chunk별 선택</text>
  <rect x="45" y="90" width="235" height="125" rx="16" class="box blue"/><text x="163" y="127" text-anchor="middle" class="t">공유 Trajectory</text><text x="163" y="158" text-anchor="middle" class="s">history video · state · language</text><text x="163" y="185" text-anchor="middle" class="s">future video · future action</text><path d="M280 153 H350" class="arrow"/>
  <rect x="355" y="80" width="480" height="300" rx="18" class="box violet"/><text x="595" y="118" text-anchor="middle" class="t">Shared Diffusion Transformer + CATR</text><text x="595" y="147" text-anchor="middle" class="s">visibility mask가 조건 방향을, token role이 expert 집합을 결정</text>
  <rect x="385" y="185" width="88" height="72" rx="12" class="box blue"/><text x="429" y="215" text-anchor="middle" class="t">Shared</text><text x="429" y="239" text-anchor="middle" class="s">dynamics</text>
  <rect x="486" y="185" width="72" height="72" rx="12" class="box green"/><text x="522" y="228" text-anchor="middle" class="t">VGM</text><rect x="571" y="185" width="72" height="72" rx="12" class="box amber"/><text x="607" y="228" text-anchor="middle" class="t">VLA</text><rect x="656" y="185" width="72" height="72" rx="12" class="box pink"/><text x="692" y="228" text-anchor="middle" class="t">WM</text><rect x="741" y="185" width="72" height="72" rx="12" class="box violet"/><text x="777" y="228" text-anchor="middle" class="t">IDM</text>
  <text x="595" y="294" text-anchor="middle" class="s">AC-WM · Joint-WAM · IDM-WAM</text><text x="595" y="325" text-anchor="middle" class="s">Action-Centric-WAM · Action-Only-WAM</text><text x="595" y="354" text-anchor="middle" class="s">다섯 interface를 균등 공동 학습</text>
  <path d="M835 230 H905" class="arrow"/><rect x="910" y="115" width="245" height="210" rx="16" class="box green"/><text x="1033" y="153" text-anchor="middle" class="t">PAIR Router</text><text x="1033" y="184" text-anchor="middle" class="s">backbone 고정</text><text x="1033" y="212" text-anchor="middle" class="s">chunk context + MAE target</text><text x="1033" y="246" text-anchor="middle" class="s">속도 우선 ↔ foresight 우선</text><text x="1033" y="282" text-anchor="middle" class="s">매 chunk interface 선택</text>
  <path d="M1033 325 V410" class="arrow"/><text x="60" y="435" class="t">배포 시 선택 가능한 action 경로</text>
  <rect x="55" y="470" width="245" height="100" rx="14" class="box violet"/><text x="178" y="507" text-anchor="middle" class="t">Joint-WAM</text><text x="178" y="538" text-anchor="middle" class="s">video + action 동시 생성</text><rect x="330" y="470" width="245" height="100" rx="14" class="box blue"/><text x="453" y="507" text-anchor="middle" class="t">IDM-WAM</text><text x="453" y="538" text-anchor="middle" class="s">video → action</text><rect x="605" y="470" width="245" height="100" rx="14" class="box amber"/><text x="728" y="507" text-anchor="middle" class="t">Action-Centric</text><text x="728" y="538" text-anchor="middle" class="s">빠른 action 중심</text><rect x="880" y="470" width="245" height="100" rx="14" class="box green"/><text x="1003" y="507" text-anchor="middle" class="t">Action-Only</text><text x="1003" y="538" text-anchor="middle" class="s">aux video 없이 실행</text>
  <rect x="45" y="615" width="1110" height="42" rx="10" fill="#f1f5f9"/><text x="600" y="642" text-anchor="middle" class="s">논문 Figure 1·11을 바탕으로 재구성 · arXiv:2610.18697</text>
</svg>
