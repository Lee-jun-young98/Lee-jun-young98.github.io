<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">UniWAM 재구성 구조도</title>
  <desc id="desc">VQA, 인간 비디오, 로봇 데이터가 물리 추론기, 세계 생성기, 행동 예측기를 서로 다르게 감독하고 세 expert가 joint attention으로 연결되는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a2b"/>
      <stop offset="1" stop-color="#142b46"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d9e8ff"/></marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700">UniWAM · semantic understanding + world dynamics + action</text>
  <text x="60" y="96" fill="#9fc2e8" font-family="Arial, sans-serif" font-size="18">Paper Figure 3 / Sections 3–4 기반 재구성</text>
  <g font-family="Arial, sans-serif">
    <rect x="55" y="150" width="205" height="82" rx="16" fill="#203c58" stroke="#70b8ff" stroke-width="2"/>
    <text x="157" y="184" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">VQA / EQA</text>
    <text x="157" y="211" text-anchor="middle" fill="#bcd9f5" font-size="15">8.293M QA pairs</text>
    <rect x="55" y="286" width="205" height="82" rx="16" fill="#203c58" stroke="#63d5b0" stroke-width="2"/>
    <text x="157" y="320" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Human video</text>
    <text x="157" y="347" text-anchor="middle" fill="#bcebdc" font-size="15">≈5,072 h</text>
    <rect x="55" y="422" width="205" height="82" rx="16" fill="#203c58" stroke="#ffbf69" stroke-width="2"/>
    <text x="157" y="456" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Robot data</text>
    <text x="157" y="483" text-anchor="middle" fill="#ffe0ad" font-size="15">≈4,958 h · precise actions</text>
    <rect x="374" y="138" width="285" height="105" rx="18" fill="#173e5f" stroke="#70b8ff" stroke-width="3"/>
    <text x="516" y="179" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Physical reasoner</text>
    <text x="516" y="210" text-anchor="middle" fill="#cde5ff" font-size="16">Qwen3-VL · physical language</text>
    <rect x="374" y="286" width="285" height="105" rx="18" fill="#174f4b" stroke="#63d5b0" stroke-width="3"/>
    <text x="516" y="327" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">World generator</text>
    <text x="516" y="358" text-anchor="middle" fill="#c9f2e6" font-size="16">Wan2.2 · future visual flow</text>
    <rect x="374" y="434" width="285" height="105" rx="18" fill="#5a3e22" stroke="#ffbf69" stroke-width="3"/>
    <text x="516" y="475" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Action predictor</text>
    <text x="516" y="506" text-anchor="middle" fill="#ffe5bc" font-size="16">history-conditioned flow</text>
    <rect x="760" y="245" width="370" height="190" rx="24" fill="#302c5f" stroke="#b6a6ff" stroke-width="3"/>
    <text x="945" y="294" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">Joint multimodal attention</text>
    <text x="945" y="332" text-anchor="middle" fill="#d8d0ff" font-size="17">understanding ↔ video ↔ action</text>
    <text x="945" y="372" text-anchor="middle" fill="#fff" font-size="18">outputs</text>
    <text x="945" y="402" text-anchor="middle" fill="#d8d0ff" font-size="16">language · future latent · action chunk</text>
    <path d="M260 191 H362" stroke="#d9e8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M260 327 H362" stroke="#d9e8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M260 463 H362" stroke="#d9e8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M659 190 C720 190 708 280 748 300" stroke="#d9e8ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M659 338 H748" stroke="#d9e8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M659 486 C720 486 708 400 748 380" stroke="#d9e8ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="620" text-anchor="middle" fill="#9fc2e8" font-size="17">역할별 supervision을 유지하면서 각 layer의 attention에서 세 expert가 상호작용</text>
  </g>
</svg>
