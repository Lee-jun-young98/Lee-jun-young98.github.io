<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Aegis-VLA architecture</title><desc id="desc">Frozen VLA의 base action에 trajectory forecast 기반 residual을 reliability gate가 선택적으로 적용하는 구조</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker><style>.h{font:700 24px sans-serif;fill:#0f172a}.t{font:700 18px sans-serif;fill:#0f172a}.s{font:15px sans-serif;fill:#334155}.b{rx:16;stroke-width:2}.a{stroke:#334155;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}</style></defs>
  <rect width="1200" height="680" fill="#f8fafc"/><text x="40" y="44" class="h">Aegis-VLA — 논문 내용을 바탕으로 재구성</text>
  <rect class="b" x="45" y="105" width="190" height="125" fill="#dbeafe" stroke="#3b82f6"/><text x="140" y="145" text-anchor="middle" class="t">관측 history</text><text x="140" y="177" text-anchor="middle" class="s">images · robot state</text><text x="140" y="204" text-anchor="middle" class="s">moving target</text>
  <rect class="b" x="45" y="390" width="190" height="125" fill="#e0f2fe" stroke="#0284c7"/><text x="140" y="430" text-anchor="middle" class="t">Frozen VLA</text><text x="140" y="462" text-anchor="middle" class="s">base arm chunk uᵇ</text><text x="140" y="490" text-anchor="middle" class="s">gripper action</text>
  <rect class="b" x="315" y="80" width="255" height="180" fill="#ede9fe" stroke="#7c3aed"/><text x="442" y="121" text-anchor="middle" class="t">Trajectory World Model</text><text x="442" y="154" text-anchor="middle" class="s">kinematic extrapolation</text><text x="442" y="181" text-anchor="middle" class="s">+ learned residual dynamics</text><text x="442" y="213" text-anchor="middle" class="s">target trajectory · uncertainty σ</text><text x="442" y="239" text-anchor="middle" class="s">object proximity</text>
  <rect class="b" x="315" y="345" width="255" height="190" fill="#fef3c7" stroke="#d97706"/><text x="442" y="386" text-anchor="middle" class="t">Dual EE forecasts</text><text x="442" y="419" text-anchor="middle" class="s">history-only pose</text><text x="442" y="446" text-anchor="middle" class="s">vs base-action-conditioned pose</text><text x="442" y="480" text-anchor="middle" class="s">discrepancy d = wrap(eʰ-eᶜ)</text><text x="442" y="510" text-anchor="middle" class="s">action index에 정렬</text>
  <rect class="b" x="650" y="345" width="220" height="190" fill="#ffedd5" stroke="#f97316"/><text x="760" y="389" text-anchor="middle" class="t">Bounded Refiner</text><text x="760" y="423" text-anchor="middle" class="s">context + base + discrepancy</text><text x="760" y="461" text-anchor="middle" class="s">Δu = ζₘₐₓ tanh(MLP)</text><text x="760" y="498" text-anchor="middle" class="s">correction 제안</text>
  <rect class="b" x="650" y="80" width="220" height="190" fill="#fee2e2" stroke="#dc2626"/><text x="760" y="120" text-anchor="middle" class="t">Reliability Gate</text><text x="760" y="154" text-anchor="middle" class="s">learned admission q ≥ τ</text><text x="760" y="181" text-anchor="middle" class="s">history validity</text><text x="760" y="208" text-anchor="middle" class="s">uncertainty veto/attenuation</text><text x="760" y="235" text-anchor="middle" class="s">proximity suppression → α</text>
  <rect class="b" x="960" y="245" width="200" height="190" fill="#dcfce7" stroke="#16a34a"/><text x="1060" y="288" text-anchor="middle" class="t">최종 action</text><text x="1060" y="327" text-anchor="middle" class="s">uᵒᵘᵗ = uᵇ + αΔu</text><text x="1060" y="363" text-anchor="middle" class="s">거절 시 α = 0</text><text x="1060" y="397" text-anchor="middle" class="s">gripper는 base 유지</text>
  <path class="a" d="M235 165 H315"/><path class="a" d="M235 452 H315"/><path class="a" d="M570 440 H650"/><path class="a" d="M870 440 H930 V385 H960"/><path class="a" d="M870 175 H930 V295 H960"/><path class="a dash" d="M570 165 H650"/><path class="a dash" d="M442 260 V345"/><path class="a" d="M235 452 H275 V590 H920 V405 H960"/><text x="520" y="614" class="s">base action 보존 경로</text>
  <text x="45" y="652" class="s">Source: Aegis-VLA Figure 2–3, §III-B–D, Eq. (3)–(7) · reconstructed, not an original paper figure</text>
</svg>
