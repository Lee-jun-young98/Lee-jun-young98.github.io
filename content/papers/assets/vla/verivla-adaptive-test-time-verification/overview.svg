<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">VeriVLA adaptive test time verification pipeline</title>
  <desc id="desc">두 action sample의 시간 변화와 표본 간 분산으로 검증 여부를 정하고 latent world model이 후보의 미래 진척도를 순위화하는 흐름</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#334155"/></marker><style>.b{rx:16;stroke-width:2}.h{font:700 23px sans-serif;fill:#0f172a}.t{font:17px sans-serif;fill:#334155}.s{font:15px sans-serif;fill:#475569}.p{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="560" fill="#f8fafc"/><text x="45" y="48" class="h">VeriVLA — 위험한 순간에만 latent 미래로 행동 후보 검증</text>
  <rect class="b" x="42" y="110" width="195" height="120" fill="#dbeafe" stroke="#2563eb"/><text x="67" y="150" class="h">현재 입력</text><text x="67" y="184" class="t">관측 + 언어 + state</text>
  <path class="p" d="M237 170 H300"/><rect class="b" x="300" y="98" width="230" height="145" fill="#ede9fe" stroke="#7c3aed"/><text x="345" y="138" class="h">Frozen flow VLA</text><text x="340" y="174" class="t">서로 다른 seed 2개</text><text x="350" y="205" class="s">action chunk a¹, a²</text>
  <path class="p" d="M530 170 H595"/><rect class="b" x="595" y="98" width="245" height="145" fill="#fef3c7" stroke="#d97706"/><text x="630" y="138" class="h">Two-Axis Trigger</text><text x="625" y="174" class="t">시간 변화 + 표본 분산</text><text x="644" y="205" class="s">학습 없이 위험 상태 판정</text>
  <path class="p" d="M840 145 H1040"/><text x="875" y="125" class="s">안정적</text><rect class="b" x="1028" y="98" width="135" height="100" fill="#cffafe" stroke="#0891b2"/><text x="1052" y="140" class="h">즉시 실행</text><text x="1065" y="172" class="s">a¹</text>
  <path class="p" d="M715 243 V315"/><text x="735" y="286" class="s">불확실</text><rect class="b" x="385" y="315" width="260" height="130" fill="#fee2e2" stroke="#dc2626"/><text x="423" y="355" class="h">후보 K=10 생성</text><text x="420" y="390" class="t">VLA sampling 병렬화</text><text x="423" y="420" class="s">정책 parameter는 고정</text>
  <path class="p" d="M645 380 H720"/><rect class="b" x="720" y="300" width="300" height="160" fill="#dcfce7" stroke="#16a34a"/><text x="755" y="340" class="h">Latent World Verifier</text><text x="753" y="375" class="t">action-conditioned 미래 latent</text><text x="753" y="405" class="t">Δp̂ = p̂<tspan baseline-shift="sub">t+H</tspan> − p<tspan baseline-shift="sub">t</tspan></text><text x="756" y="435" class="s">가장 큰 진척도의 chunk 선택</text>
  <path class="p" d="M1020 380 H1090 V198"/><text x="45" y="515" class="s">빠른 경로: 추가 sampling 없음 · 검증 경로: KV cache + 병렬 생성 + latent encoding overlap, trigger 1회당 추가 326 ms</text>
</svg>
