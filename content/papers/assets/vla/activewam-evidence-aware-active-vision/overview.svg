<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ActiveWAM 학습과 배포 구조</title><desc id="desc">원본과 task-guided inversion history를 같은 목표로 학습하고 배포에서는 원본 history만으로 head와 arm 행동을 공동 생성한다.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6Z" fill="#334155"/></marker></defs><rect width="1200" height="680" rx="28" fill="#f8fafc"/><text x="60" y="62" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">ActiveWAM — 증거 보존과 새 시점 획득의 공동 제어</text><text x="60" y="112" font-family="sans-serif" font-size="22" font-weight="700" fill="#475569">학습: paired evidence paths</text>
  <rect x="60" y="145" width="240" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="180" y="188" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700">Raw view-aware history</text><text x="180" y="220" text-anchor="middle" font-family="sans-serif" font-size="16">RGB · camera pose · age</text><rect x="60" y="300" width="240" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="180" y="342" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">Task-guided inversion</text><text x="180" y="374" text-anchor="middle" font-family="sans-serif" font-size="16">task evidence + dynamics 보존</text><path d="M180 255V295" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect x="405" y="175" width="360" height="205" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="585" y="218" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">Unified World–Action Model</text><text x="585" y="260" text-anchor="middle" font-family="sans-serif" font-size="17">raw / transformed 조건 공유</text><text x="500" y="315" text-anchor="middle" font-family="sans-serif" font-size="17">Future-video branch</text><text x="675" y="315" text-anchor="middle" font-family="sans-serif" font-size="17">Action branch</text><text x="585" y="350" text-anchor="middle" font-family="sans-serif" font-size="15">paired flow matching + consistency</text><path d="M300 200L400 230M300 360L400 325" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <rect x="870" y="175" width="270" height="205" rx="20" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="1005" y="220" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">동일한 target</text><text x="1005" y="265" text-anchor="middle" font-family="sans-serif" font-size="17">미래 video</text><text x="1005" y="300" text-anchor="middle" font-family="sans-serif" font-size="17">양팔 action</text><text x="1005" y="335" text-anchor="middle" font-family="sans-serif" font-size="17">pan / tilt / stay</text><path d="M765 278H865" stroke="#334155" stroke-width="4" marker-end="url(#a)"/>
  <path d="M55 470H1145" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 8"/><text x="60" y="520" font-family="sans-serif" font-size="22" font-weight="700" fill="#475569">배포: raw-history 단일 경로</text><rect x="170" y="540" width="250" height="90" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="295" y="578" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">실측 RGB history</text><text x="295" y="606" text-anchor="middle" font-family="sans-serif" font-size="15">inversion 없음</text><rect x="500" y="540" width="260" height="90" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="630" y="578" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">한 번의 action 생성</text><text x="630" y="606" text-anchor="middle" font-family="sans-serif" font-size="15">video decoding 없음</text><rect x="840" y="540" width="260" height="90" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="970" y="578" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700">head + arm 실행</text><text x="970" y="606" text-anchor="middle" font-family="sans-serif" font-size="15">새 관찰로 context 갱신</text><path d="M420 585H495M760 585H835" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><text x="930" y="658" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#64748b">논문 Figure 2 및 Sections 3.3–3.4 기반 재구성</text>
</svg>
