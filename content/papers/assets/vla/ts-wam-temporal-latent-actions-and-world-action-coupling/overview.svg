<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">TS-WAM teacher student world action architecture</title>
  <desc id="desc">현재 관측을 보는 student와 미래까지 보는 EMA teacher가 latent action을 학습하고 미래 특징 변화 예측을 행동 head에 전달하는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#334155"/></marker><style>.b{rx:16;stroke-width:2}.h{font:700 23px sans-serif;fill:#0f172a}.t{font:17px sans-serif;fill:#334155}.s{font:15px sans-serif;fill:#475569}.p{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#9333ea;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="600" fill="#f8fafc"/><text x="42" y="46" class="h">TS-WAM — action-free video의 시간 변화를 행동 조건으로 연결</text>
  <rect class="b" x="42" y="92" width="200" height="120" fill="#dbeafe" stroke="#2563eb"/><text x="65" y="132" class="h">현재 입력</text><text x="65" y="166" class="t">관측 o<tspan baseline-shift="sub">t</tspan> + 언어</text><text x="65" y="194" class="s">추론 시 유일한 시각 입력</text>
  <path class="p" d="M242 152 H305"/><rect class="b" x="305" y="92" width="210" height="120" fill="#ede9fe" stroke="#7c3aed"/><text x="348" y="132" class="h">Online X-VLM</text><text x="340" y="168" class="t">latent predictor</text><text x="370" y="194" class="s">ẑ<tspan baseline-shift="sub">t</tspan></text>
  <path class="p" d="M515 152 H585"/><rect class="b" x="585" y="92" width="235" height="120" fill="#dcfce7" stroke="#16a34a"/><text x="628" y="132" class="h">delta-LWM</text><text x="615" y="168" class="t">ΔF̂<tspan baseline-shift="sub">t</tspan> = D(F<tspan baseline-shift="sub">t</tspan>, ẑ<tspan baseline-shift="sub">t</tspan>)</text><text x="615" y="194" class="s">미래 특징 변화 예측</text>
  <path class="p" d="M820 152 H885"/><rect class="b" x="885" y="92" width="220" height="120" fill="#fee2e2" stroke="#dc2626"/><text x="927" y="132" class="h">DiT flow head</text><text x="920" y="168" class="t">F<tspan baseline-shift="sub">t</tspan> + F̂<tspan baseline-shift="sub">t+1</tspan> + state</text><text x="937" y="194" class="s">행동 chunk 생성</text>
  <rect class="b" x="305" y="330" width="260" height="125" fill="#f3e8ff" stroke="#9333ea"/><text x="345" y="370" class="h">EMA Teacher</text><text x="335" y="405" class="t">현재 + 미래 관측</text><text x="342" y="433" class="s">target latent z<tspan baseline-shift="sub">t</tspan><tspan baseline-shift="super">Y</tspan> · stop-gradient</text>
  <rect class="b" x="650" y="330" width="245" height="125" fill="#fff7ed" stroke="#ea580c"/><text x="689" y="370" class="h">DINOv3 target</text><text x="682" y="405" class="t">ΔF<tspan baseline-shift="sub">t</tspan> = F<tspan baseline-shift="sub">t+1</tspan> − F<tspan baseline-shift="sub">t</tspan></text><text x="686" y="433" class="s">world loss supervision</text>
  <path class="d" d="M435 330 V235 H410 V212"/><text x="318" y="280" class="s">temporal L1 (학습 전용)</text><path class="d" d="M650 392 H600 V212 H700"/>
  <text x="42" y="520" class="h">학습</text><text x="115" y="520" class="t">미래 프레임 → EMA target + ΔF supervision, temporal/world/flow loss를 한 번에 최적화</text>
  <text x="42" y="557" class="h">추론</text><text x="115" y="557" class="t">teacher와 실제 미래 프레임 제거 → 현재 관측만으로 ẑ<tspan baseline-shift="sub">t</tspan> → ΔF̂<tspan baseline-shift="sub">t</tspan> → 행동</text>
</svg>
