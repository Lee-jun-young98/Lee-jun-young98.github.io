<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AE-VLA 양팔 조합 일반화 구조</title><desc id="desc">global과 양쪽 local 입력을 받아 left right action token group으로 나누고 각 팔의 SkillLoRA와 arm-wise attention을 거쳐 joint action chunk를 생성하는 구조</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#334155"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.t{font-size:18px}.s{font-size:15px;fill:#475569}.box{rx:18;stroke-width:2}.arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="680" fill="#f8fafc"/><text x="600" y="50" text-anchor="middle" class="h">AE-VLA: 공유 장면 문맥 + 팔별 skill/action 경로</text>
  <rect x="65" y="90" width="260" height="105" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="195" y="128" text-anchor="middle" class="t">Global context G</text><text x="195" y="160" text-anchor="middle" class="s">공유 RGB 장면</text>
  <rect x="65" y="225" width="260" height="125" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="195" y="265" text-anchor="middle" class="t">Left local Cᴸ</text><text x="195" y="296" text-anchor="middle" class="s">wrist · state · prompt</text><text x="195" y="324" text-anchor="middle" class="s">예: Pick(bowl)</text>
  <rect x="65" y="380" width="260" height="125" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="195" y="420" text-anchor="middle" class="t">Right local Cᴿ</text><text x="195" y="451" text-anchor="middle" class="s">wrist · state · prompt</text><text x="195" y="479" text-anchor="middle" class="s">예: Wait / Place</text>
  <rect x="415" y="90" width="310" height="415" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="570" y="132" text-anchor="middle" class="t">Shared π₀.₅ action expert</text><rect x="455" y="175" width="230" height="105" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="570" y="214" text-anchor="middle" class="t">Left tokens Aᴸ (H=50)</text><text x="570" y="246" text-anchor="middle" class="s">Left SkillLoRA router</text><rect x="455" y="340" width="230" height="105" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="570" y="379" text-anchor="middle" class="t">Right tokens Aᴿ (H=50)</text><text x="570" y="411" text-anchor="middle" class="s">Right SkillLoRA router</text>
  <path d="M325 142H415" class="arrow"/><path d="M325 287H455" class="arrow"/><path d="M325 442H455" class="arrow"/>
  <rect x="810" y="145" width="320" height="305" class="box" fill="#fef3c7" stroke="#d97706"/><text x="970" y="188" text-anchor="middle" class="t">Arm-wise Attention (AWA)</text><text x="970" y="228" text-anchor="middle" class="s">Aᴸ ← G + Cᴸ + causal Aᴸ</text><text x="970" y="263" text-anchor="middle" class="s">Aᴿ ← G + Cᴿ + causal Aᴿ</text><line x1="850" y1="292" x2="1090" y2="292" stroke="#d97706" stroke-width="2"/><text x="970" y="330" text-anchor="middle" class="s">팔별 local/action 직접 연결 차단</text><text x="970" y="365" text-anchor="middle" class="s">global scene context는 공유</text><text x="970" y="405" text-anchor="middle" class="s">skill bank는 양팔·과업 간 재사용</text>
  <path d="M725 225H810" class="arrow"/><path d="M725 390H810" class="arrow"/>
  <rect x="385" y="565" width="430" height="80" class="box" fill="#e0f2fe" stroke="#0284c7"/><text x="600" y="598" text-anchor="middle" class="t">Joint bimanual action chunk (aᴸ, aᴿ)</text><text x="600" y="626" text-anchor="middle" class="s">flow matching으로 두 팔 동시 생성</text><path d="M970 450 C970 535 760 535 720 565" class="arrow"/>
  <text x="600" y="670" text-anchor="middle" class="s">논문 Figure 2를 바탕으로 재구성 · arXiv:2610.06184</text>
</svg>
