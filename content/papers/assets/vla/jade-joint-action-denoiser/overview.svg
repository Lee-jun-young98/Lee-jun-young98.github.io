<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">JADE 공동 action denoising 아키텍처</title><desc id="desc">관측과 언어 prefix를 캐시하고 현재 noisy action을 OAT latent로 VLM에 넣어, 각 denoising 단계마다 action expert를 안내하는 구조</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><style>.t{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0f172a}.h{font-size:24px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.box{rx:18;stroke-width:2}.a{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="60" y="52" class="t h">JADE: VLM과 action expert의 공동 denoising</text>
  <text x="60" y="88" class="t s" fill="#475569">논문 Figure 2와 Eq. (1)–(4)를 바탕으로 재구성</text>
  <rect x="55" y="125" width="225" height="115" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="167" y="166" text-anchor="middle" class="t b">관측 · 언어 · 상태</text><text x="167" y="198" text-anchor="middle" class="t s">VLM prefix K/V cache</text>
  <rect x="55" y="330" width="225" height="115" class="box" fill="#fee2e2" stroke="#dc2626"/><text x="167" y="371" text-anchor="middle" class="t b">현재 noisy action Aτ</text><text x="167" y="403" text-anchor="middle" class="t s">50-step action chunk</text>
  <rect x="350" y="315" width="210" height="145" class="box" fill="#ffedd5" stroke="#ea580c"/><text x="455" y="355" text-anchor="middle" class="t b">Frozen OAT</text><text x="455" y="385" text-anchor="middle" class="t s">8 compact registers</text><text x="455" y="414" text-anchor="middle" class="t s">Zτ + flow time τ</text><text x="455" y="441" text-anchor="middle" class="t s">ordered action latent</text>
  <rect x="630" y="105" width="250" height="180" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="755" y="146" text-anchor="middle" class="t b">VLM register 경로</text><text x="755" y="178" text-anchor="middle" class="t s">prefix attention</text><text x="755" y="207" text-anchor="middle" class="t s">shared residual adapter</text><text x="755" y="236" text-anchor="middle" class="t s">layer-wise Rτ⁽ˡ⁾</text><text x="755" y="264" text-anchor="middle" class="t s">매 step 갱신</text>
  <rect x="630" y="345" width="250" height="150" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="755" y="385" text-anchor="middle" class="t b">Action expert</text><text x="755" y="416" text-anchor="middle" class="t s">native flow block</text><text x="755" y="445" text-anchor="middle" class="t s">gated cross-attention</text><text x="755" y="474" text-anchor="middle" class="t s">velocity vθ(Aτ, τ)</text>
  <rect x="955" y="345" width="190" height="150" class="box" fill="#cffafe" stroke="#0891b2"/><text x="1050" y="385" text-anchor="middle" class="t b">Euler / Balanced</text><text x="1050" y="416" text-anchor="middle" class="t s">Aτ → Aτ-Δ</text><text x="1050" y="445" text-anchor="middle" class="t s">2 · ~5 · 10 NFE</text><text x="1050" y="474" text-anchor="middle" class="t s">clean action A₀</text>
  <path d="M280 182 H630" class="a"/><path d="M280 387 H350" class="a"/><path d="M560 387 C590 387 590 225 630 225" class="a"/><path d="M560 420 H630" class="a"/><path d="M755 285 V345" class="a"/><path d="M880 420 H955" class="a"/><path d="M1050 495 C1050 550 310 550 170 445" class="a"/>
  <rect x="350" y="555" width="530" height="75" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="615" y="584" text-anchor="middle" class="t b">학습 전용 clean-latent alignment</text><text x="615" y="611" text-anchor="middle" class="t s">VLM output → Z₀, Smooth-L1 · 추론 시 head 제거</text><path d="M755 285 C755 520 700 520 700 555" class="a"/>
</svg>
